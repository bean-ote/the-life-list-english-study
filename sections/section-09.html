<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 9 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>

  <script>
    const items = [{"english":"The truth is I'm an idiot.\nExpecting a total stranger\nto make everything right in my life.\nThank you for coming.","focus":"the truth is / expect to","notes":["<code>The truth is ...</code>: 사실은 ...이다","<code>idiot</code>: 바보","<code>total stranger</code>: 완전한 낯선 사람","<code>make everything right</code>: 모든 것을 바로잡다"],"chunks":["<code>The truth is I'm ...</code> 사실 나는 ...야."],"translation":"사실 저는 바보예요. 완전한 낯선 사람이 제 삶의 모든 걸 바로잡아주길 기대했으니까요. 와줘서 고마워요."},{"english":"You always talk like\nthere's something wrong with you.\nIt's bullshit.","focus":"talk like / bullshit","notes":["<code>talk like + 문장</code>: ...인 것처럼 말하다","<code>something wrong with you</code>: 너에게 뭔가 문제가 있는 것","<code>bullshit</code>: 말도 안 되는 소리, 헛소리"],"chunks":["<code>There's something wrong with ...</code> ...에게 문제가 있어."],"translation":"당신은 늘 자신에게 뭔가 문제가 있는 것처럼 말해요. 그건 말도 안 돼요."},{"english":"You're so smart and beautiful\nand full of life and\nEvery time I see you, you dazzle me.","focus":"full of life / dazzle","notes":["<code>full of life</code>: 생기 넘치는","<code>every time + 문장</code>: ...할 때마다","<code>dazzle</code>: 눈부시게 하다, 강하게 매료시키다"],"chunks":["<code>Every time I see you, ...</code> 당신을 볼 때마다 ..."],"translation":"당신은 정말 똑똑하고 아름답고 생기 넘쳐요. 당신을 볼 때마다 저는 눈이 부셔요."},{"english":"And if Garrett and your dad are too blind\nto see it, then it is their loss,\nbut it does not have to be ours.","focus":"too blind to / their loss","notes":["<code>too + 형용사 + to</code>: 너무 ...해서 ...하지 못하다","<code>their loss</code>: 그들의 손해","<code>does not have to be</code>: ...일 필요는 없다"],"chunks":["<code>It's their loss.</code> 그 사람들이 손해 보는 거야."],"translation":"Garrett과 당신 아빠가 그걸 보지 못할 만큼 눈이 멀었다면 그건 그들의 손해예요. 하지만 그게 우리 손해일 필요는 없어요."},{"english":"Except it does.\nLast night was wonderful.\nBut it was a mistake.\n-You have this amazing girlfriend--\n-Nina didn't go back because of work.","focus":"except / mistake / because of","notes":["<code>Except it does.</code>: 하지만 실제로는 그렇다는 반박","<code>wonderful</code>: 멋진, 훌륭한","<code>mistake</code>: 실수","<code>because of</code>: ...때문에"],"chunks":["<code>It was a mistake.</code> 그건 실수였어."],"translation":"하지만 그래요. 어젯밤은 멋졌어요. 하지만 실수였어요. 당신에게는 멋진 여자친구가 있잖아요. Nina가 일 때문에 돌아간 게 아니에요."},{"english":"We got in a fight and broke up.\nWhat was the fight about?\nYou.","focus":"get in a fight / break up","notes":["<code>get in a fight</code>: 싸우다","<code>break up</code>: 헤어지다","<code>What was ... about?</code>: ...은 무엇에 관한 것이었어?"],"chunks":["<code>We broke up.</code> 우리 헤어졌어."],"translation":"우리는 싸우고 헤어졌어요. 무엇 때문에 싸웠는데요? 당신이요."},{"english":"Okay. Why didn't you tell me this\nbefore you got into bed with me?\nI know I should have.\n-Yeah.","focus":"why didn't you / should have","notes":["<code>Why didn't you ...?</code>: 왜 ...하지 않았어?","<code>get into bed with</code>: ...와 잠자리에 들다","<code>should have</code>: ...했어야 했다"],"chunks":["<code>I know I should have.</code> 그래야 했다는 걸 알아."],"translation":"좋아요. 왜 나와 잠자리에 들기 전에 이걸 말하지 않았어요? 말했어야 했다는 걸 알아요. 그렇죠."},{"english":"-Everything just happened so fast, and\nUgh\nYeah.\nSorry.\nDon't go. Please, Alex.","focus":"happen fast / don't go","notes":["<code>happen so fast</code>: 너무 빠르게 벌어지다","<code>Don't go.</code>: 가지 마","<code>Please</code>: 제발"],"chunks":["<code>Everything happened so fast.</code> 모든 게 너무 빨리 벌어졌어."],"translation":"모든 게 너무 빨리 벌어졌고... 아. 그래요. 미안해요. 가지 마요. 제발, Alex."},{"english":"Look, Garrett is an amazing guy.\nI get it. He's\nsophisticated and accomplished, and he I\nI don't believe you love him.","focus":"I get it / sophisticated / accomplished","notes":["<code>I get it.</code>: 이해해","<code>sophisticated</code>: 세련된","<code>accomplished</code>: 성취가 많은, 유능한","<code>I don't believe ...</code>: ...라고 믿지 않는다"],"chunks":["<code>I don't believe you love him.</code> 네가 그를 사랑한다고 생각하지 않아."],"translation":"봐요, Garrett은 멋진 사람이죠. 알아요. 세련되고 유능하고... 하지만 당신이 그를 사랑한다고는 믿지 않아요."},{"english":"I don't even really think you like him.\n-You like how you feel about yourself\n-You need to stop talking.\n-When you're with him.\n-Wow.","focus":"not even / how you feel","notes":["<code>not even really</code>: 사실은 ...조차도 아닌","<code>how you feel about yourself</code>: 자기 자신에 대해 느끼는 방식","<code>stop talking</code>: 말 그만하다"],"chunks":["<code>You like how you feel about yourself.</code> 당신은 그와 있을 때의 자신을 좋아하는 거야."],"translation":"당신이 그를 정말 좋아한다고도 생각하지 않아요. 당신은 그와 있을 때 자기 자신에 대해 느끼는 감정을 좋아하는 거예요. 말 그만해요. 와."},{"english":"You need validation\neven after everything you've done\n-You're full of shit.\n-since your mom died.","focus":"validation / full of shit","notes":["<code>validation</code>: 인정, 확인, 자신이 괜찮다는 외부의 승인","<code>even after</code>: ...한 뒤에도","<code>You're full of shit.</code>: 헛소리하고 있다는 거친 표현"],"chunks":["<code>You need validation.</code> 당신은 인정받고 싶어 해."],"translation":"당신은 어머니가 돌아가신 뒤 해낸 모든 일에도 불구하고 여전히 인정이 필요해요. 헛소리하지 마요."},{"english":"Telling me what I want\nand how to live my life.\nRight, 'cause that would be Garrett's job.\nWow.","focus":"what I want / how to","notes":["<code>tell someone what ...</code>: 무엇이 ...인지 말해주다","<code>how to live my life</code>: 내 삶을 어떻게 살아야 하는지","<code>that would be ...</code>: 그건 ...일 테지라는 빈정거림"],"chunks":["<code>Don't tell me how to live my life.</code> 내 삶을 어떻게 살지 말하지 마."],"translation":"내가 뭘 원하는지, 내 삶을 어떻게 살아야 하는지 말해주고 있잖아요. 맞아요, 그건 Garrett이 할 일이겠죠. 와."},{"english":"It's okay.\nThe other night wasn't about the list.\nI was just freaking out about the broken\narmchair, and your friends were\nAnd the book I gave you\nthat you didn't read.","focus":"freak out / wasn't about","notes":["<code>wasn't about ...</code>: ...에 관한 문제가 아니었다","<code>freak out</code>: 겁먹다, 당황하다","<code>broken armchair</code>: 고장 난 안락의자"],"chunks":["<code>I was freaking out about ...</code> 나는 ... 때문에 완전히 불안했어."],"translation":"괜찮아요. 그날 밤은 리스트 때문이 아니었어요. 저는 고장 난 안락의자 때문에 당황했고, 당신 친구들도 그랬고... 제가 준 책을 당신이 읽지 않은 것도요."},{"english":"But then\nI have just spent the whole weekend\nmissing you.\nI spent the whole weekend\nmissing your smile\nand missing all your goofy stuff.","focus":"spend time -ing / goofy","notes":["<code>spend time + -ing</code>: ...하면서 시간을 보내다","<code>the whole weekend</code>: 주말 내내","<code>miss</code>: 그리워하다","<code>goofy</code>: 엉뚱하고 귀여운"],"chunks":["<code>I spent the whole weekend missing you.</code> 주말 내내 당신을 그리워했어."],"translation":"그런데 주말 내내 당신을 그리워했어요. 당신의 미소와 당신의 엉뚱한 모든 모습을 그리워하면서 주말을 보냈어요."},{"english":"And I realized that we can do this.\nThat I can do this.\nYou didn't ask me how it went with Johnny.\nI'm so- I'm sorry. How How did it go?","focus":"realize / how it went","notes":["<code>realize that</code>: ...라는 걸 깨닫다","<code>we can do this</code>: 우리는 이걸 해낼 수 있다","<code>How did it go?</code>: 어떻게 됐어?"],"chunks":["<code>How did it go?</code> 어떻게 됐어?"],"translation":"그리고 우리가 이걸 해낼 수 있다는 걸 깨달았어요. 내가 할 수 있다는 것도요. Johnny와 어떻게 됐는지 묻지도 않았네요. 미안해요. 어떻게 됐어요?"},{"english":"Not great.\nThe thing is,\nmy messy place,\nmy friends, the books I read\nThey're me, Garrett.\nThey're all me.","focus":"the thing is / they're me","notes":["<code>Not great.</code>: 별로 좋지 않았어","<code>The thing is</code>: 중요한 건, 사실은","<code>messy</code>: 지저분한, 정돈되지 않은","<code>They're all me.</code>: 그 모든 게 나야"],"chunks":["<code>The thing is, ...</code> 중요한 건 ...야."],"translation":"별로 좋지 않았어요. 중요한 건, 내 지저분한 집, 내 친구들, 내가 읽는 책들이 모두 나라는 거예요, Garrett. 전부 나예요."},{"english":"Hey.\nHey.\nShall we?\nYeah.","focus":"shall we","notes":["<code>Shall we?</code>: 그럴까요?, 시작할까요?","<code>Hey.</code>: 인사나 부름"],"chunks":["<code>Shall we?</code> 갈까요? / 시작할까요?"],"translation":"안녕. 안녕. 갈까요? 네."},{"english":"I don't understand why\nLucas wants us to meet with a broker.\nWe can't put the house on the market\nuntil the new year.","focus":"understand why / on the market","notes":["<code>I don't understand why ...</code>: 왜 ...인지 이해가 안 된다","<code>want us to</code>: 우리가 ...하기를 원하다","<code>broker</code>: 중개인","<code>put a house on the market</code>: 집을 매물로 내놓다"],"chunks":["<code>We can't put the house on the market.</code> 집을 매물로 내놓을 수 없어."],"translation":"Lucas가 왜 우리가 중개인을 만나길 원하는지 이해가 안 돼요. 새해 전까지는 집을 매물로 내놓을 수 없잖아요."},{"english":"If you don't mind me asking, how are you?\nGood. How are you? How are the kids?\nThey miss you.\nYeah, me too.","focus":"if you don't mind me asking","notes":["<code>If you don't mind me asking</code>: 실례가 안 된다면","<code>How are you?</code>: 어떻게 지내?","<code>They miss you.</code>: 아이들이 너를 그리워해","<code>me too</code>: 나도"],"chunks":["<code>If you don't mind me asking, ...</code> 실례가 안 된다면 ..."],"translation":"실례가 안 된다면, 어떻게 지내요? 좋아요. 당신은요? 아이들은 어때요? 아이들이 당신을 보고 싶어 해요. 네, 저도요."},{"english":"When is Lucas getting here?\nI have stuff to do.\nI'm here! Hey!\nHi, what's up?","focus":"get here / stuff to do","notes":["<code>get here</code>: 여기에 도착하다","<code>stuff to do</code>: 할 일","<code>What's up?</code>: 무슨 일이야?"],"chunks":["<code>I have stuff to do.</code> 나 할 일이 있어."],"translation":"Lucas는 언제 와요? 저 할 일이 있어요. 나 왔어! 안녕! 안녕, 무슨 일이야?"},{"english":"-Where's the broker?\n-Broker's not coming.\nWhat?\nYeah, I've got something\nI want to show you.","focus":"broker / something to show","notes":["<code>Where's ...?</code>: ...은 어디 있어?","<code>not coming</code>: 오지 않는다","<code>I've got something I want to show you.</code>: 보여주고 싶은 게 있어"],"chunks":["<code>I've got something to show you.</code> 보여줄 게 있어."],"translation":"중개인은 어디 있어요? 중개인은 안 와. 뭐? 응, 너희에게 보여주고 싶은 게 있어."},{"english":"Just, it's gonna be all right, just\nWhoa, what? I don't understand.\nCamping out under a full moon.\nNumber seven on the list.\nBingo.","focus":"be all right / camping out","notes":["<code>It's gonna be all right.</code>: 괜찮을 거야","<code>camp out</code>: 야영하다","<code>under a full moon</code>: 보름달 아래에서","<code>Bingo.</code>: 바로 그거야"],"chunks":["<code>Number seven on the list.</code> 리스트의 7번이야."],"translation":"그냥, 괜찮을 거야. 잠깐, 뭐야? 이해가 안 돼. 보름달 아래에서 야영하기. 리스트 7번. 바로 그거야."},{"english":"-This is sweet but\n-No, Chloe--\nGuys, just stop. Just shut up.\nBoth of you shut up, okay?","focus":"sweet but / shut up","notes":["<code>This is sweet but ...</code>: 마음은 고맙지만 ...","<code>just stop</code>: 그만해","<code>shut up</code>: 입 다물어, 조용히 해"],"chunks":["<code>Both of you shut up.</code> 둘 다 조용히 해."],"translation":"이건 다정하긴 한데... 아니, Chloe... 얘들아, 그만해. 그냥 조용히 해. 둘 다 조용히 해, 알았지?"},{"english":"We are gonna do this so, uh\nLet's crack open the wine, get started.\nYeah?\nYeah.","focus":"gonna / crack open","notes":["<code>We're gonna do this.</code>: 우리는 이걸 할 거야","<code>crack open</code>: 술병 등을 따다","<code>get started</code>: 시작하다"],"chunks":["<code>Let's get started.</code> 시작하자."],"translation":"우리는 이걸 할 거야. 그러니까 와인을 따고 시작하자. 어때? 좋아."},{"english":"So I got there at 10, and\nhalf an hour went by, and then an hour.\nAnd Johnny never showed up,\nand you're just sitting there waiting.","focus":"go by / show up","notes":["<code>get there</code>: 거기에 도착하다","<code>go by</code>: 시간이 지나가다","<code>show up</code>: 나타나다","<code>sit there waiting</code>: 거기 앉아서 기다리다"],"chunks":["<code>Johnny never showed up.</code> Johnny는 끝내 나타나지 않았어."],"translation":"10시에 도착했고, 30분이 지나고, 한 시간이 지났어요. 그런데 Johnny는 끝내 나타나지 않았고, 저는 거기 앉아 기다리기만 했어요."},{"english":"Must've been so tough, Alex.\nI'm sorry.\nI wasn't totally surprised.\nI liked him.","focus":"must have been / surprised","notes":["<code>Must've been ...</code>: ...였겠네","<code>tough</code>: 힘든","<code>not totally surprised</code>: 완전히 놀라지는 않은","<code>liked him</code>: 그를 좋아했다"],"chunks":["<code>Must've been so tough.</code> 정말 힘들었겠다."],"translation":"정말 힘들었겠다, Alex. 유감이야. 완전히 놀라지는 않았어요. 그를 좋아했거든요."},{"english":"But even though he told me stuff,\nit kind of felt like he was\n- holding something back, you know?\n- Mm-hmm.","focus":"even though / hold back","notes":["<code>even though</code>: 비록 ...이지만","<code>stuff</code>: 여러 이야기, 것들","<code>kind of felt like</code>: 약간 ...처럼 느껴졌다","<code>hold something back</code>: 무언가를 숨기다"],"chunks":["<code>He was holding something back.</code> 그는 뭔가 숨기고 있었어."],"translation":"그가 제게 여러 이야기를 해주긴 했지만, 뭔가를 숨기고 있는 것처럼 느껴졌어요. 알죠? 응."},{"english":"Have you
