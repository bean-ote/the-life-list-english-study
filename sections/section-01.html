<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 1 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>

  <script>
    const items = [{"english":"How's this?\nCool. Sexy. I like it.","focus":"asking for an opinion","notes":["<code>How's this?</code>: 옷이나 선택지를 보여주며 ‘이건 어때?’라고 묻는 표현"],"translation":"이건 어때? 좋아. 섹시해. 마음에 들어.","chunks":["<code>How's this?</code> 이건 어때? → <code>How's this for a first draft?</code> 초안으로는 이거 어때?","<code>I like it.</code> 마음에 들어 → <code>I really like this color.</code> 이 색 정말 마음에 들어."]},{"english":"I think I'm going to change.\nStop eating the salad.","focus":"going to / stop -ing","notes":["<code>stop + -ing</code>: 지금 하고 있는 행동을 그만두다"],"translation":"나 옷 갈아입을래. 샐러드 그만 먹어.","chunks":["<code>I think I'm going to + 동사</code> ...할까 해 → <code>I think I'm going to head home.</code> 이제 집에 갈까 해."]},{"english":"Come in.","focus":"phrasal verb","notes":["<code>come in</code>: 들어오다; 상대에게 들어오라고 허락하거나 권하는 표현"],"translation":"들어와.","chunks":[]},{"english":"I wanted to let you know\npeople are starting to arrive.","focus":"let someone know","notes":["<code>wanted</code>는 단순한 과거라기보다 현재의 용건과 거리를 두어 말을 완곡하게 꺼내는 역할로 관습적으로 쓰임"],"translation":"사람들이 도착하기 시작했다고 알려드리려고요.","chunks":["<code>I wanted to let you know (that) ...</code> ...을 알려드리려고요 → 소식·변경 사항을 조심스럽게 꺼낼 때 유용함."]},{"english":"Great. Is Alex here yet?\nUh, no. But she is gonna be bringing\nher bean salad.","focus":"yet / gonna be -ing","notes":["<code>yet</code>: 아직"],"chunks":["<code>Is + 사람 + here yet?</code> ... 아직 안 왔어? / 이제 와 있어?","<code>be gonna be + -ing</code> ...할 거야"],"translation":"좋아. Alex는 벌써 왔어? 어, 아니. 하지만 콩 샐러드를 가져올 거야."},{"english":"Ah. Alex is on Alex time\nand there's\nnever a good time for that bean salad.","focus":"comic expression","notes":["<code>be on (이름) time</code>: 늘 자기만의 시간 감각으로 움직인다는 농담"],"translation":"Alex는 늘 자기 시간대로 움직이잖아. 그리고 저 콩 샐러드가 반가울 리는 없지.","chunks":[]},{"english":"But you know what?\nLet's.. Let's give her a break today.","focus":"give someone a break","notes":["<code>give (someone) a break</code>: 문자 그대로는 “휴식을 주다”, 이 장면에서는 “그만 몰아붙이고 좀 봐주다”"],"translation":"하지만 있잖아? 오늘은 Alex를 좀 봐주자.","chunks":["<code>You know what?</code> 있잖아 / 생각해 보니","<code>Let's + 동사</code> 우리 ...하자 → 제안할 때 쓰는 기본 틀. 여기서는 <code>Let's give her a break.</code> 오늘은 그녀를 좀 봐주자."]},{"english":"Mom, you are always making excuses\nfor her. You realize that, right?","focus":"make excuses for","notes":["<code>make excuses for + 사람</code>: 그 사람의 잘못이나 행동을 계속 변명하다"],"chunks":["<code>You realize that, right?</code> 그건 알고 있지?"],"translation":"엄마는 항상 Alex를 감싸며 변명해 주잖아요. 그건 알고 있죠?"},{"english":"It's 'cause she's my favorite child.\nOkay, the truth finally comes out.","focus":"'cause / come out","notes":["<code>'cause</code>: <code>because</code>를 줄여 말한 매우 편한 구어체","<code>the truth comes out</code>: 숨겨졌던 진실이 드러나다"],"chunks":["<code>The truth finally comes out.</code> 드디어 진실이 밝혀지네."],"translation":"그 애가 내가 가장 좋아하는 자식이니까. 그래, 드디어 진실이 밝혀지네."},{"english":"Oh! Ouch! I'm still your favorite son, right?\nOh, sure.","focus":"..., right?","notes":["<code>Ouch!</code>: 아플 때뿐 아니라 마음에 상처를 받았다는 장난스러운 반응으로도 사용"],"chunks":["<code>I'm still ..., right?</code> 그래도 나는 여전히 ...인 거지?"],"translation":"아! 상처인데! 그래도 제가 가장 좋아하는 아들이죠? 아, 물론이지."},{"english":"\"Why aren't you married yet?\"\n\"Why do you work in a record store?\"\n\"Why'd you give up teaching?\"\n\"Why didn't you finish college?\"\nWhy didn't you finish college?","focus":"why questions","notes":["<code>Why'd you ...?</code>: 여기서는 <code>Why did you ...?</code>를 줄인 말","<code>give up + -ing</code>: 하던 일을 그만두다"],"chunks":["<code>Why did you + 동사?</code> 왜 ...했어?","<code>Why didn't you + 동사?</code> 왜 ...하지 않았어?"],"translation":"“왜 아직 결혼하지 않았니?” “왜 레코드 가게에서 일하니?” “왜 교사 일을 그만뒀니?” “왜 대학을 졸업하지 않았니?” 왜 대학을 졸업하지 않았어?"},{"english":"I'm a life guy.\nI learn by living, you know?\nYou love that about me.\nRight, right. Hey, how about this?","focus":"learn by -ing / how about this?","notes":["<code>learn by living</code>: 직접 경험하면서 배우다"],"translation":"나는 인생을 직접 사는 사람이야. 살아가면서 배우는 거지. 당신도 내 그런 점을 좋아하잖아. 그래, 그래. 있잖아, 이건 어때?","chunks":["<code>..., you know?</code> 있잖아 / 알지?","<code>Hey, how about this?</code> 있잖아, 이건 어때?"]},{"english":"What about we go in there, we say our hellos,\nand then you give me the high sign,","focus":"what about we ...?","notes":["<code>say our hellos</code>: 사람들에게 인사하다","<code>give me the high sign</code>: 나에게 미리 정한 신호를 보내다"],"chunks":["<code>What about we + 동사 ...?</code> 우리 ...하는 건 어때?"],"translation":"우리 안에 들어가서 사람들에게 인사하고, 그다음 네가 나한테 신호를 보내는 건 어때?"},{"english":"we sneak off to your childhood bedroom\nand make out surrounded by the Barbies and Kens.","focus":"sneak off / make out","notes":["<code>sneak off</code>: 남몰래 자리를 빠져나가다","<code>make out</code>: 진하게 키스하다"],"translation":"그러면 네 어린 시절 방으로 몰래 빠져나가서 바비와 켄 인형에 둘러싸여 진하게 키스하는 거지.","chunks":[]},{"english":"Mm, you're not getting anywhere near my Barbies, buster.","focus":"not get anywhere near","notes":["<code>not get anywhere near</code>: ...의 근처에도 가지 못하다","<code>buster</code>: 이 녀석아 (상대를 장난스럽게 타이르거나 경고할 때 쓰는 호칭)"],"chunks":["<code>You're not getting anywhere near ...</code> 넌 ... 근처에도 못 가"],"translation":"흠, 내 바비 인형 근처에는 얼씬도 못 해, 이 양반아."},{"english":"I'm going to take this into the kitchen.\nHey, Lucas. Hey, Zoe.\nHey! Happy baby shower.","focus":"take A into B / social greeting","notes":["<code>take this into the kitchen</code>: 이것을 주방 안으로 가져가다","<code>Happy baby shower.</code>: 베이비샤워를 축하한다는 가벼운 인사"],"chunks":["<code>I'm going to take this to/into ...</code> 이걸 ...로 가져갈게."],"translation":"이건 주방으로 가져갈게. Lucas. 안녕, Zoe. 안녕! 베이비샤워 축하해."},{"english":"There it is. Looks good. Super good.","focus":"short reactions","notes":["<code>There it is.</code>: 찾거나 기다리던 것을 보며 “저기 있네/왔네”","<code>Looks good.</code>: 좋아 보인다, 맛있어 보인다"],"chunks":["<code>There it is.</code> 저기 있네 / 바로 그거야"],"translation":"저기 있네. 좋아 보인다. 정말 좋아 보여."},{"english":"Auntie Allie! Hi, guys. This party is so boring, \nand Dad won't let us have cake until later.","focus":"won't let us","notes":["<code>let + 사람 + 동사원형</code>: 사람이 ...하도록 허락하다","<code>not until later</code>: 나중이 되기 전까지는 안 됨"],"chunks":["<code>He/She won't let me + 동사</code> 그 사람이 내가 ...하는 걸 허락하지 않아."],"translation":"Allie 이모! 얘들아, 안녕. 이 파티는 너무 지루해. 아빠가 나중이 될 때까지 케이크도 못 먹게 해."},{"english":"What is it with parents, huh?","focus":"what is it with ...?","notes":["사람이나 상황이 왜 늘 그런지 답답함·의아함을 나타내는 구어체 표현"],"chunks":["<code>What is it with + 명사?</code> ...은 대체 왜 그래? → <code>What is it with this weather?</code> 이 날씨는 대체 왜 이래?"],"translation":"부모들은 대체 왜 그러는 걸까, 그렇지?"},{"english":"How about one of our famous scavenger hunts?","focus":"how about","notes":["제안에 명사는 그대로, 행동은 <code>-ing</code> 형태로 붙임"],"translation":"우리의 유명한 보물찾기 놀이 하나 해보는 건 어때?","chunks":["<code>How about + 명사/-ing?</code> ...은 어때? → <code>How about getting coffee?</code> 커피 마시는 건 어때?"]},{"english":"Okay, I want six items that I could find in Harry or Hermione's room.\nAnd bonus points for anything that can be used to make boring adults disappear.","focus":"relative clauses","notes":["<code>anything [that can be used [to make boring adults disappear]]</code>: <code>that...</code>이 <code>anything</code>을 꾸며 주는 관계절","<code>to make ...</code>: 무엇에 사용하는지 목적을 나타내는 to부정사","<code>make + 목적어 + 동사원형</code>: 목적어가 ...하게 만들다 → <code>make boring adults disappear</code>: 지루한 어른들을 사라지게 만들다"],"chunks":["<code>bonus points for ...</code> ...하면 가산점 / 추가 점수"],"translation":"좋아, Harry나 Hermione의 방에서 찾을 법한 물건 여섯 개를 가져와. 지루한 어른들을 사라지게 만드는 데 쓸 수 있는 물건이라면 가산점이야."},{"english":"Got it? Oh, one second.\nYou guys need proper nutritional preparation before we commence.","focus":"got it? / commence","notes":["<code>commence</code>: 시작하다 (<code>start</code>보다 격식 있는 표현)","<code>nutritional preparation</code>: 영양 보충 준비; 여기서는 장난스럽게 과장한 말"],"chunks":["<code>Got it?</code> 알겠어? / 이해했지?","<code>before we + 동사</code> 우리가 ...하기 전에"],"translation":"알겠지? 아, 잠깐만. 시작하기 전에 제대로 영양 보충부터 해야 해."},{"english":"Zoe, I want you to meet Julia.\nHi. Nice to meet you.","focus":"introductions","notes":["<code>want + 사람 + to + 동사</code>: 그 사람이 ...하기를 원하다"],"chunks":["<code>I want you to meet + 사람</code> ...을 소개해 줄게.","<code>Nice to meet you.</code> 만나서 반가워요."],"translation":"Zoe, Julia를 소개할게. 안녕하세요. 만나서 반가워요."},{"english":"Alex! Hi! Oh, Kelly, wow. look at you. No, don't. I'm so big. But so beautiful. Aw, why, thank you.","focus":"look at you","notes":["<code>Look at you!</code>: 달라진 모습이나 멋진 모습을 보고 감탄하는 표현"],"translation":"Alex! 안녕! Kelly, 와. 세상에, 네 모습 좀 봐. 아니, 그러지 마. 나 너무 커졌어. 하지만 정말 아름다워. 어머, 고마워.","chunks":[]},{"english":"I heard you had to give up teaching.\nAnd you're working for your mother now? Yeah.","focus":"I heard ... / had to","notes":["<code>had to</code>: ...해야 했다, 상황상 어쩔 수 없었다","<code>give up + -ing</code>: 하던 일을 그만두다"],"chunks":["<code>I heard (that) ...</code> ...라고 들었어."],"translation":"교사 일을 그만둬야 했다면서요. 지금은 어머니 밑에서 일하고요? 네."},{"english":"And your boyfriend has a job at a record store?\nI didn't know there were record stores anymore.","focus":"record store / anymore","notes":["<code>anymore</code>: 이제는, 더 이상"],"translation":"남자친구는 레코드 가게에서 일한다고요? 아직 레코드 가게가 남아 있는 줄 몰랐어요.","chunks":[]},{"english":"Uh-huh. There's one left. The rest of the time, he's developing a video game called either American Zombie: Blood Apocalypse or Playground Armageddon.","focus":"there's one left / either A or B","notes":["<code>There's one left.</code>: 하나 남아 있다","<code>the rest of the time</code>: 나머지 시간에는","<code>either A or B</code>: A 또는 B 둘 중 하나"],"chunks":["<code>There's one left.</code> 하나 남아 있어."],"translation":"네, 하나 남아 있어요. 나머지 시간에는 American Zombie: Blood Apocalypse나 Playground Armageddon이라는 비디오게임을 개발하고 있어요."},{"english":"And one day, you'll make your mommy buy it for you. Yes, you will!\nI've got to go grab Alex for a second.","focus":"make someone / have got to","notes":["<code>make + 사람 + 동사원형</code>: 사람에게 ...하게 하다","<code>I've got to</code>: <code>I have to</code>와 같은 뜻의 구어체"],"chunks":["<code>for a second</code> 잠깐","<code>go grab + 사람/물건</code> 가서 ...을 데려오다/가져오다"],"translation":"그리고 언젠가는 엄마에게 이걸 사 달라고 할 거야. 꼭 그럴 거야! 잠깐 Alex를 데리러 가야겠어요."},{"english":"Elizabeth, I am dying for you to meet my friend Katie. She's a huge fan of Rose Cosmetics. Come meet her. Two seconds, two seconds.","focus":"be dying for someone to","notes":["<code>be dying for + 사람 + to + 동사</code>: 그 사람이 몹시 ...하기를 바라다","<code>a huge fan of</code>: ...의 열렬한 팬"],"chunks":["<code>Two seconds.</code> 잠깐이면 돼."],"translation":"Elizabeth, 내 친구 Katie를 꼭 소개해 주고 싶어요. Rose Cosmetics의 열렬한 팬이에요. 와서 만나봐요. 잠깐이면 돼요."},{"english":"Oh my God. Thank God you're here.\nI thought I was the only woman\nunder 40 not pregnant or lactating.","focus":"the only ... not","notes":["<code>lactating</code>: 수유 중인"],"translation":"세상에, 와줘서 정말 다행이야. 마흔 살 미만인데 임신도 안 하고 수유도 안 하는 여자는 나뿐인 줄 알았어.","chunks":["<code>Thank God you're here.</code> 와줘서 정말 다행이야.","<code>I thought I was the only one.</code> 나만 그런 줄 알았어 → 같은 경험을 발견했을 때 자주 씀."]},{"english":"Hi. How are you? Insufferable bitches. I hate them all.","focus":"insufferable / harsh insult","notes":["<code>insufferable</code>: 참기 힘든, 견딜 수 없이 짜증 나는","<code>bitch</code>: 여성을 모욕적으로 부르는 매우 거친 표현이므로 사용에 주의"],"chunks":["<code>I hate them all.</code> 난 그들 모두가 싫어."],"translation":"안녕. 잘 지내? 정말 못 견디게 재수 없는 여자들이야. 다 싫어."},{"english":"Yeah. They're just jealous because they don't get out anymore.","focus":"jealous because / get out","notes":["<code>be jealous</code>: 질투하다, 부러워하다","<code>get out</code>: 밖에 나가 활동하거나 사람들을 만나다","<code>anymore</code>: 이제는, 더 이상"],"chunks":["<code>They're just jealous because ...</code> 그들은 단지 ...해서 질투하는 거야."],"translation":"응. 이제는 밖에도 잘 못 나가니까 그냥 질투하는 거야."},{"english":"Except you don't go out anymore either.\nOr even call your friends back.\nWhat is going on with you?","focus":"what is going on with","notes":["<code>What is going on with you?</code>: 너 요즘 대체 왜 그래?"],"translation":"그런데 너도 이제 외출을 안 하잖아. 친구들 전화에 답도 안 하고. 너 대체 왜 그래?","chunks":["<code>What's going on with + 사람/일?</code> ...에 무슨 일이 있는 거야? → <code>What's going on with you two?</code> 너희 둘 무슨 일이야?"]},{"english":"Anybody want a gummy?\nYes. Can I have the, uh... They're five milligrams. Awesome.","focus":"anybody want ...?","notes":["<code>gummy</code>: 젤리 형태의 간식; 이 장면에서는 대마 성분이 든 젤리","<code>milligram</code>: 밀리그램, <code>mg</code>"],"chunks":["<code>Anybody want + 명사?</code> 누구 ... 원하는 사람?","<code>Can I have ...?</code> ...을 받을/먹을 수 있을까요?"],"translation":"구미 젤리 먹을 사람? 네. 저, 하나 먹어도 돼요? 하나에 5밀리그램이에요. 좋아요."},{"english":"Times four. You should be good to go. Excellent.\nSee you in five hours.\nYou're not driving home, right? Then you're fine.","focus":"good to go / tag check","notes":["<code>times four</code>: 4를 곱해서, 네 배로","<code>be good to go</code>: 준비가 되다, 문제없이 괜찮다"],"chunks":["<code>You should be good to go.</code> 이제 괜찮을 거야 / 준비 끝이야.","<code>You're not ..., right?</code> ...하는 건 아니지?"],"translation":"그럼 네 배로요. 이제 괜찮을 거예요. 훌륭해요. 다섯 시간 뒤에 봐요. 운전해서 집에 가는 건 아니죠? 그럼 괜찮아요."},{"english":"Where's Elliot? We broke up. Sorry.\nI gotta go. Yeah. No, it's fine. I've already gone on two..\nDid you give the kids cake?","focus":"break up / gotta","notes":["<code>break up</code>: 연인과 헤어지다","<code>gotta</code>: <code>have got to</code>를 빠르게 말한 형태, ...해야 한다"],"chunks":["<code>Where's + 사람?</code> ...은 어디 있어?","<code>We broke up.</code> 우리 헤어졌어.","<code>I've already + 과거분사</code> 나는 이미 ...했어."],"translation":"Elliot은 어디 있어? 우리 헤어졌어. 안됐다. 나 가봐야 해. 응. 아니, 괜찮아. 벌써 데이트를 두 번이나... 아이들에게 케이크 줬어?"},{"english":"That was me. Definitely.\nJulian, relax. I mean, right? Like, all we're saying is\nLet them eat cake. Lots of it. What could possibly go wrong?","focus":"all we are saying is","notes":["<code>all we're saying is ...</code>: 우리가 말하려는 건 단지 ...라는 거야","<code>Let them eat cake.</code>: 여기서는 아이들이 케이크를 먹게 내버려두자는 장난스러운 말"],"chunks":["<code>Relax.</code> 진정해 / 너무 걱정하지 마.","<code>What could possibly go wrong?</code> 설마 무슨 문제가 생기겠어? → 문제가 생길 듯한 상황에서 반어적으로도 사용."],"translation":"내가 줬어. 확실히 나야. Julian, 진정해. 그러니까, 우리가 말하려는 건 그냥 이거야. 아이들이 케이크를 먹게 내버려둬. 아주 많이. 대체 무슨 일이 잘못될 수 있겠어?"},{"english":"Let's go to Auntie Alex's room. Maybe she has a fountain pen.\nSlow down! Hurry up already!","focus":"maybe / already","notes":["<code>fountain pen</code>: 만년필","<code>already</code>: 이미; 명령문에서는 조급함을 담아 “이제 좀”이라는 느낌"],"chunks":["<code>Maybe + 문장</code> 어쩌면 ...일지도 몰라.","<code>Hurry up already!</code> 이제 좀 서둘러!"],"translation":"Alex 이모 방으로 가자. 어쩌면 만년필이 있을지도 몰라. 천천히 가! 이제 좀 빨리 와!"},{"english":"Finn, you have a really big willy. Thank you.","focus":"childish word","notes":["<code>willy</code>: 남성의 성기를 뜻하는 표현"],"translation":"Finn, 아저씨는 정말 커요. 고맙구나.","chunks":[]},{"english":"Am I grounded? Forever.\nI don't think Julian'll ever forgive you.\nIs that a promise?","focus":"grounded / ever","notes":["<code>be grounded</code>: 벌로 외출을 금지당하다","<code>Julian'll</code>: <code>Julian will</code>의 축약","<code>ever</code>: 어느 때라도; 부정문에서는 “절대”의 뉘앙스"],"chunks":["<code>Am I grounded?</code> 저 외출 금지예요?","<code>Is that a promise?</code> 그거 약속이야? → 싫은 일을 피하게 됐을 때 장난스럽게 반길 수도 있음."],"translation":"저 외출 금지예요? 영원히. Julian은 널 절대 용서하지 않을 것 같아. 그거 약속이지?"},{"english":"Seriously, though. What is going on with you?\nWhat do you mean?","focus":"seriously, though","notes":["<code>Seriously, though.</code>: 농담은 그만하고, 그런데 진지하게 말해서"],"chunks":["<code>What do you mean?</code> 무슨 뜻이야? / 왜 그렇게 말해?"],"translation":"그런데 진지하게 말해서, 너 대체 왜 그래? 무슨 뜻이야?"},{"english":"I don't know. I feel like maybe you're floundering a little bit.\nFeeling a little lost.","focus":"flounder","notes":["<code>flounder</code>: 갈피를 못 잡고 허우적거리다"],"translation":"잘 모르겠어. 네가 요즘 조금 갈피를 못 잡고 헤매는 것 같아. 약간 길을 잃은 것처럼.","chunks":["<code>I feel like + 문장</code> ...인 것 같아 → <code>I feel like we need more time.</code> 시간이 더 필요한 것 같아."]},{"english":"Lost?\nI have a new boyfriend and a great job.","focus":"echo question","notes":["<code>Lost?</code>: 상대가 쓴 표현을 되받아 말하며 의아함이나 반박을 나타냄"],"chunks":["<code>I have + 명사</code> 나에게는 ...이 있어."],"translation":"길을 잃었다고? 나한테는 새 남자친구도 있고 좋은 직장도 있어."},{"english":"Working for your mother? Selling makeup to women twice your age? What a dream.","focus":"sarcasm / twice","notes":["<code>twice your age</code>: 네 나이의 두 배인","<code>What a dream.</code>: 여기서는 “정말 꿈같네”라는 빈정거림"],"translation":"엄마 밑에서 일하는 거? 네 나이의 두 배인 여성들에게 화장품을 파는 거? 정말 꿈같네.","chunks":[]},{"english":"Yeah, but it's a job. With a future and security, and a job I thought I was getting pretty good at. Yeah, you're good at it.","focus":"get good at","notes":["<code>with a future and security</code>: 미래 전망과 안정성이 있는","<code>get good at + 명사/-ing</code>: ...에 점점 능숙해지다"],"chunks":["<code>I thought I was getting pretty good at ...</code> 나 ...을 꽤 잘하게 되고 있다고 생각했어.","<code>You're good at it.</code> 너 그거 잘해."],"translation":"그래도 직장이잖아. 미래도 있고 안정적이기도 하고, 나도 꽤 잘하게 되고 있다고 생각했던 일이야. 그래, 넌 그 일을 잘해."},{"english":"It's not who you are.\nIt's not what you're passionate about.","focus":"what-clause","notes":["<code>what you're passionate about</code>: 네가 열정을 느끼는 것"],"translation":"그건 진짜 네 모습이 아니야. 네가 열정을 가진 일도 아니고.","chunks":["<code>It's not who you are.</code> 그건 네다운 모습이 아니야"]},{"english":"Passion is overrated.","focus":"be overrated","notes":["<code>overrated</code>: 실제 가치보다 지나치게 높이 평가된"],"translation":"열정은 과대평가됐어.","chunks":["<code>... is overrated.</code> ...은 과대평가됐어 → <code>Being busy is overrated.</code> 바쁘게 사는 건 과대평가됐어."]},{"english":"What? It is. It never lasts, and it's completely exhausting.","focus":"emphatic response / last","notes":["<code>It is.</code>: 상대의 반응에 “정말 그래”라고 자신의 말을 강조","<code>last</code>: 계속되다, 지속되다","<code>exhausting</code>: 진을 빼는, 몹시 지치게 하는"],"chunks":["<code>It never lasts.</code> 그건 절대 오래가지 않아.","<code>It's completely exhausting.</code> 그건 정말 진이 빠져."],"translation":"뭐라고? 정말 그래. 열정은 절대 오래가지 않고, 완전히 진을 빼놓거든."},{"english":"Besides, isn't that what my generation is all about?\nLowering expectations and letting go of childish dreams?","focus":"be all about","notes":["<code>be all about</code>: 결국 ...을 핵심으로 하다","<code>let go of</code>: 붙잡고 있던 생각·감정·관계 등을 놓아주다, 미련을 버리다","<code>childish</code>: 철없는, 유치한; <code>childlike</code>(아이처럼 순수한)와 달리 부정적인 뉘앙스"],"translation":"게다가 우리 세대란 원래 그런 거 아니야? 기대치를 낮추고 철없던 꿈을 놓아주는 것 말이야.","chunks":["<code>Isn't that what ... is all about?</code> ...이란 원래 그런 거 아니야?"]},{"english":"Alex, you do not believe that.\nBesides, I love working for you, Mom.","focus":"emphatic do / besides","notes":["<code>do not believe</code>: 여기서 <code>do</code>는 일반동사 부정문을 만드는 조동사","<code>besides</code>: 게다가, 그뿐만 아니라"],"chunks":["<code>You do not believe that.</code> 너도 정말 그렇게 믿는 건 아니잖아.","<code>I love + -ing</code> 나는 ...하는 것을 정말 좋아해."],"translation":"Alex, 너도 정말 그렇게 믿는 건 아니잖아. 게다가 난 엄마와 함께 일하는 게 좋아."},{"english":"I do. You built this incredible business all by yourself, and I want to be a part of it. And make you proud.","focus":"emphatic do / make proud","notes":["<code>I do.</code>: 앞의 말을 강하게 확인하는 “정말 그래”","<code>all by yourself</code>: 다른 사람의 도움 없이 혼자 힘으로","<code>make + 사람 + proud</code>: 사람이 자랑스러워하게 만들다"],"chunks":["<code>I want to be a part of ...</code> 나는 ...의 일부가 되고 싶어.","<code>I want to make you proud.</code> 네가 나를 자랑스럽게 여기게 하고 싶어."],"translation":"정말 그렇게 생각해. 엄마는 이 대단한 회사를 혼자 힘으로 일궜잖아. 나도 그 일부가 되고 싶어. 그리고 엄마가 나를 자랑스러워하게 만들고 싶어."},{"english":"Well, since you put it that way.\nMom. Hmm? I have some news. Oh?","focus":"put it that way / have news","notes":["<code>put it that way</code>: 그런 식으로 말하다, 그렇게 표현하다"],"chunks":["<code>Since you put it that way.</code> 네가 그렇게 말하니 그렇네.","<code>I have some news.</code> 할 말/전할 소식이 있어."],"translation":"음, 네가 그렇게 말하니 그렇네. 엄마. 응? 할 말이 있어. 그래?"},{"english":"Finn officially asked me to move in.\nOh.\nWell, at least until I find a new place.\nIn the meantime, we both save on rent.","focus":"move in","notes":["<code>move in</code>: 함께 살기 시작하다; <code>in the meantime</code>: 그동안"],"translation":"Finn이 정식으로 같이 살자고 했어. 새집을 찾을 때까지는 말이야. 그동안 둘 다 월세도 아낄 수 있고.","chunks":["<code>at least until ...</code> 적어도 ...할 때까지 → <code>Stay here at least until it stops raining.</code> 비가 그칠 때까지만이라도 여기 있어."]},{"english":"How romantic. Why do you guys all hate him?\nIs it because he didn't finish college?\nNeither did Steve Jobs.","focus":"sarcasm / neither did","notes":["<code>How romantic.</code>: 여기서는 낭만적이지 않은 상황을 빈정거리는 말","<code>you guys</code>: 너희들, 여러분","<code>Neither did Steve Jobs.</code>: Steve Jobs도 대학을 마치지 않았다는 부정 동의 도치"],"chunks":["<code>Is it because ...?</code> ... 때문이야?","<code>Neither did + 사람.</code> 그 사람도 그러지 않았어."],"translation":"정말 낭만적이네. 다들 왜 Finn을 싫어해? 대학을 졸업하지 않아서 그래? Steve Jobs도 졸업하지 않았어."},{"english":"I do not hate Finn. I think he is a very sweet boy\nwho loves video games and apparently has a large...\nOh my God, Mom. You have to stop.","focus":"relative clause / apparently","notes":["<code>who loves video games</code>: 앞의 <code>a very sweet boy</code>를 꾸미는 관계절","<code>apparently</code>: 듣거나 보기에 ...인 듯한, 아무래도","<code>has a large...</code>: 민망한 말을 끝까지 하지 않고 중간에 끊은 표현"],"chunks":["<code>I do not + 동사</code> 나는 정말 ...하지 않아 → <code>do</code>에 힘을 주면 강한 부정","<code>You have to stop.</code> 그만해야 해."],"translation":"나는 Finn을 싫어하지 않아. 비디오게임을 좋아하고, 듣자 하니 큰... 것을 가진 아주 착한 아이라고 생각해. 세상에, 엄마. 그만해야 해."},{"english":"Okay, I'll stop. For now. Thank you. You're welcome.","focus":"for now","notes":["<code>for now</code>: 일단은, 지금 당분간은; 나중에는 달라질 수 있다는 뉘앙스"],"chunks":["<code>I'll stop.</code> 그만할게.","<code>You're welcome.</code> 천만에 / 별말을 다 해."],"translation":"알았어, 그만할게. 일단은. 고마워. 천만에."},{"english":"I have news too.\nIt's back.","focus":"short reveal","notes":["<code>be back</code>: 여기서는 암의 재발을 뜻함"],"translation":"나도 할 말이 있어. 암이 재발했어.","chunks":["<code>I have some news.</code> 할 말/소식이 있어 → 좋거나 나쁜 소식을 꺼내기 전 쓰는 중립적 표현."]},{"english":"Yeah. Okay, so they'll just have to get rid of it again.","focus":"have to / get rid of","notes":["<code>they'll</code>: <code>they will</code>의 축약","<code>have to + 동사</code>: ...해야 하다","<code>get rid of</code>: 원치 않는 것을 없애다, 제거하다"],"chunks":["<code>We'll just have to + 동사</code> 우리는 그냥 ...할 수밖에 없어.","<code>get rid of it</code> 그것을 없애다."],"translation":"응. 좋아, 그럼 의사들이 그냥 다시 없애면 되겠네."},{"english":"No. We'll find another doctor, and.. And I read about these treatments they're doing in Germany that apparently are really effective. And I will stop working...","focus":"omitted relative pronoun","notes":["<code>treatments (that) they're doing in Germany</code>: 독일에서 시행 중인 치료법; 목적격 관계대명사 <code>that</code>이 생략됨","<code>effective</code>: 효과적인","<code>apparently</code>: 듣거나 알아본 바로는 ...인 듯한"],"chunks":["<code>I read about ...</code> ...에 관해 읽어봤어.","<code>We'll find another ...</code> 다른 ...을 찾아볼 거야."],"translation":"안 돼. 다른 의사를 찾아볼 거야. 그리고... 독일에서 시행 중인 치료법들을 읽어봤는데, 듣기로는 정말 효과적이래. 나도 일을 그만둘게..."},{"english":"Alex. And move in with you... And I will take care of you until you get better.","focus":"take care of / until","notes":["<code>move in with + 사람</code>: 그 사람과 함께 살기 시작하다","<code>take care of + 사람</code>: 사람을 돌보다","<code>until + 문장</code>: ...할 때까지"],"chunks":["<code>I'll take care of you.</code> 내가 널 돌볼게.","<code>until you get better</code> 네가 나아질 때까지"],"translation":"Alex. 엄마와 같이 살게... 그리고 엄마가 나을 때까지 내가 돌볼게."},{"english":"No magic treatments in Germany. No cure that's ten times worse than the disease.\nIt's not going to make a difference. Not this time.\nCome here.","focus":"make a difference","notes":["<code>make a difference</code>: 결과를 바꾸다, 효과가 있다"],"translation":"독일의 기적 같은 치료도, 병보다 열 배는 더 고통스러운 치료도 안 돼. 이번에는 달라지는 게 없을 거야. 이리 와.","chunks":["<code>It's not going to make a difference.</code> 그래도 달라지는 건 없을 거야 → 결과에 영향이 없다고 말할 때 사용."]},{"english":"What am I going to do with you?\nWhat am I going to do without you?","focus":"emotional contrast","notes":["<code>with you / without you</code>의 대비로 감정이 크게 바뀜"],"translation":"내가 너를 어떻게 해야 할까? 네가 없으면 나는 어떻게 해야 하지?","chunks":["<code>What am I going to do without ...?</code> ... 없이 내가 어떻게 하지? → 의존·애정·막막함을 표현."]}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.ceil(items.length / itemsPerPage);
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 1:</strong> 00:00~09:20 까지 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 1 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro +
        '<section class="grid" aria-label="Sentence study table">' + rows +
        '</section><footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
