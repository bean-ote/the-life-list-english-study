<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 7 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"Hey, sorry I'm late.\nYou're not. I'm early.\nUh,\" Clair de Lune.\"\nNine down, three to go.\nJinx.","focus":"sorry I'm late / down, to go","notes":["<code>Sorry I'm late.</code>: 늦어서 미안해요","<code>Nine down, three to go.</code>: 아홉 개 끝, 세 개 남음","<code>Jinx</code>: 같은 말을 동시에 했을 때 장난스럽게 하는 말"],"chunks":["<code>... down, ... to go.</code> ...개 끝났고, ...개 남았어."],"translation":"늦어서 미안해요. 안 늦었어요. 제가 일찍 온 거예요. 음, 「Clair de Lune」. 아홉 개 끝, 세 개 남았네요. 찌찌뽕."},{"english":"I want to put the detective back on.\nI know, I know you're gonna say she hit\na dead end and that it's a lot of money--\nI already did it.","focus":"put back on / hit a dead end","notes":["<code>put someone back on</code>: 다시 투입하다, 다시 맡기다","<code>hit a dead end</code>: 막다른 길에 부딪히다","<code>I already did it.</code>: 이미 했어요"],"chunks":["<code>I know you're gonna say ...</code> 네가 ...라고 말할 거 알아."],"translation":"탐정을 다시 쓰고 싶어요. 알아요, 탐정이 막혔고 돈도 많이 든다고 말하려는 거죠. 이미 했어요."},{"english":"I know, you can pay me back later or not.\nYou could just keep being my stylist. Um\nThe point is,\nwe have to find Johnny, right?\nThanks.\nYeah, of course.","focus":"pay back / the point is","notes":["<code>pay someone back</code>: 돈을 갚다","<code>or not</code>: 아니면 말고","<code>The point is</code>: 중요한 건","<code>have to</code>: ...해야 한다"],"chunks":["<code>The point is, ...</code> 중요한 건 ...야."],"translation":"나중에 갚아도 되고 안 갚아도 돼요. 그냥 계속 제 스타일리스트로 있어도 되고요. 중요한 건 Johnny를 찾아야 한다는 거죠, 맞죠? 고마워요. 네, 물론이죠."},{"english":"Ooh, sandwiches.\nSo how are things with Garrett?\nGood. Really good.\nOkay.\nWhy are you looking at me like that?","focus":"how are things with / look at","notes":["<code>How are things with ...?</code>: ...와는 어떻게 되어가?","<code>Really good.</code>: 정말 좋아","<code>look at me like that</code>: 그런 식으로 나를 보다"],"chunks":["<code>How are things with Garrett?</code> Garrett이랑은 어때?"],"translation":"오, 샌드위치. Garrett이랑은 어때요? 좋아요. 정말 좋아요. 알겠어요. 왜 그렇게 쳐다봐요?"},{"english":"It's probably nothing, it's just\nDo you think it's strange\nhe never wants to stay at my place?\nLike, he always picks the movie\nor the restaurant.","focus":"probably nothing / at my place","notes":["<code>It's probably nothing.</code>: 별일 아닐 거야","<code>stay at my place</code>: 우리 집에서 머물다","<code>pick</code>: 고르다, 정하다"],"chunks":["<code>Do you think it's strange ...?</code> ...이 이상하다고 생각해?"],"translation":"아마 별일 아닐 거예요. 그냥, 그가 우리 집에 머물고 싶어 하지 않는 게 이상하다고 생각해요? 영화나 식당도 항상 그가 정해요."},{"english":"I don't know, it's kind of like\nwe live entirely in his world\nand only occasionally will he visit mine.\nYep.\nWhat?","focus":"kind of like / entirely / occasionally","notes":["<code>kind of like</code>: 약간 ...같은","<code>entirely</code>: 완전히","<code>occasionally</code>: 가끔","<code>visit mine</code>: 내 세계에 들어오다라는 비유"],"chunks":["<code>It's kind of like ...</code> 약간 ...같아."],"translation":"모르겠어요. 우리가 완전히 그의 세계에서만 살고, 그는 가끔 내 세계를 방문하는 느낌이에요. 맞아요. 뭐요?"},{"english":"It doesn't sound like nothing, right?\nLike, how do you really know someone\nunless you've seen their bookshelves\nor, like, the crazy shit\nthey keep in their fridge?","focus":"sound like / unless","notes":["<code>It doesn't sound like nothing.</code>: 별일 아닌 것처럼 들리지는 않는다","<code>unless</code>: ...하지 않는 한","<code>bookshelves</code>: 책장","<code>fridge</code>: 냉장고"],"chunks":["<code>How do you really know someone unless ...?</code> ...하지 않고서야 사람을 어떻게 제대로 알겠어?"],"translation":"별일 아닌 것처럼 들리지는 않죠? 책장이나 냉장고에 넣어둔 이상한 것들을 보지 않고서야 사람을 어떻게 정말 알겠어요?"},{"english":"How come every time we talk about Garrett,\nyou get all weird?\nI thought you guys were friends.\nWe are friends. Of a certain kind.","focus":"how come / of a certain kind","notes":["<code>How come ...?</code>: 왜 ...해?","<code>get all weird</code>: 갑자기 이상하게 굴다","<code>of a certain kind</code>: 어떤 종류의, 나름의"],"chunks":["<code>I thought you guys were friends.</code> 너희 친구인 줄 알았어."],"translation":"왜 Garrett 얘기만 하면 이상하게 굴어요? 둘이 친구인 줄 알았는데요. 친구예요. 어떤 종류의 친구죠."},{"english":"The kind that\ndon't really like each other?\nThe point is that you should\ntalk to him about it before it festers.\nOkay.","focus":"the kind that / fester","notes":["<code>the kind that ...</code>: ...하는 종류의","<code>talk to him about it</code>: 그 문제에 대해 그와 이야기하다","<code>fester</code>: 감정이나 문제가 곪다"],"chunks":["<code>before it festers</code> 문제가 곪기 전에"],"translation":"서로 별로 좋아하지 않는 그런 종류요? 중요한 건 그게 곪기 전에 그와 이야기해야 한다는 거예요. 알겠어요."},{"english":"Sakina grew up here\nbut works in Mumbai doing microfinancing,\nand Russell is the president\nof the Psychiatric Institute.","focus":"grow up / work doing","notes":["<code>grow up</code>: 자라다","<code>work in + 도시</code>: ...에서 일하다","<code>doing microfinancing</code>: 소액 금융 일을 하면서","<code>president</code>: 대표, 회장"],"chunks":[],"translation":"Sakina는 여기서 자랐지만 Mumbai에서 소액 금융 일을 하고, Russell은 Psychiatric Institute의 대표예요."},{"english":"Hey, can I ask you a favor?\n-Uh-huh.\n-Can we not talk about the list tonight?\nWhy? Everyone loves that story.","focus":"ask a favor / can we not","notes":["<code>ask someone a favor</code>: 부탁을 하다","<code>Can we not ...?</code>: ...하지 않으면 안 될까?","<code>Everyone loves ...</code>: 모두가 ...을 좋아해"],"chunks":["<code>Can I ask you a favor?</code> 부탁 하나 해도 돼?"],"translation":"부탁 하나 해도 돼요? 네. 오늘 밤에는 리스트 얘기 안 하면 안 돼요? 왜요? 다들 그 이야기 좋아하는데."},{"english":"It's not a story, it's my life,\nand I'm starting to feel\nlike a favorite pet trick.\nYeah, no, of course, sure. No life list.","focus":"start to feel like / pet trick","notes":["<code>It's not a story, it's my life.</code>: 이야기가 아니라 내 삶이라는 강조","<code>start to feel like</code>: ...처럼 느껴지기 시작하다","<code>pet trick</code>: 사람들 앞에서 보여주는 재롱 같은 장기"],"chunks":[],"translation":"그건 이야기가 아니라 제 삶이에요. 제가 사람들 앞에서 보여주는 애완동물 재롱처럼 느껴지기 시작해요. 네, 물론이죠. 인생 리스트 얘기 안 할게요."},{"english":"Are you okay?\nYeah.\nAlex?\nIt's nothing, it's just\nHow come we never stay at my place?\nLike, make dinner at my place.","focus":"are you okay / how come","notes":["<code>Are you okay?</code>: 괜찮아?","<code>How come ...?</code>: 왜 ...해?","<code>at my place</code>: 우리 집에서"],"chunks":["<code>How come we never ...?</code> 왜 우리는 한 번도 ...하지 않아?"],"translation":"괜찮아요? 네. Alex? 아무것도 아니에요. 그냥 왜 우리는 한 번도 우리 집에 있지 않아요? 우리 집에서 저녁을 만든다든가요."},{"english":"Because you love my apartment.\nI do, it's amazing, it's just\nIt's yours.\nIt's your life and your friends and","focus":"it's just / yours","notes":["<code>Because ...</code>: 왜냐하면 ...이니까","<code>It's just ...</code>: 그냥 ...일 뿐이야","<code>It's yours.</code>: 그건 네 것이야"],"chunks":[],"translation":"네가 내 아파트를 좋아하니까요. 좋아하죠. 정말 멋져요. 그냥 그건 당신 것이에요. 당신의 삶이고, 당신의 친구들이고..."},{"english":"I don't know, I thought maybe you'd want\nto be a bigger part of my life too.\nYeah, yeah, and we've hung out\nwith your family. We--\nWe had brunch once.","focus":"thought maybe / bigger part","notes":["<code>I thought maybe ...</code>: 어쩌면 ...일 줄 알았어","<code>be a part of</code>: ...의 일부가 되다","<code>hang out with</code>: ...와 시간을 보내다","<code>once</code>: 한 번"],"chunks":["<code>I thought maybe you'd want to ...</code> 네가 ...하고 싶어 할 줄 알았어."],"translation":"모르겠어요. 당신도 제 삶의 더 큰 일부가 되고 싶어 할 줄 알았어요. 그래요, 그리고 당신 가족과도 어울렸잖아요. 우리... 브런치 한 번 했죠."},{"english":"You always say that I should work harder\nat unraveling my feelings, so\nHere they are, unraveled.\nThank you, and I'm sorry.","focus":"work at / unravel feelings","notes":["<code>work hard at + -ing</code>: ...하려고 노력하다","<code>unravel my feelings</code>: 감정을 풀어내고 들여다보다","<code>Here they are</code>: 여기 있어"],"chunks":["<code>Here they are, unraveled.</code> 자, 내 감정을 풀어놓았어."],"translation":"당신은 늘 제가 감정을 더 열심히 풀어내야 한다고 말하잖아요. 그래서 여기 있어요, 풀어낸 감정들이요. 고마워요, 그리고 미안해요."},{"english":"I'm sorry, you're right, I'm just\nI'm a really bad guest\n'cause I'm a bit of a control freak.\nI'm a lot of a control freak.","focus":"you're right / control freak","notes":["<code>You're right.</code>: 네 말이 맞아","<code>bad guest</code>: 손님 노릇을 잘 못하는 사람","<code>control freak</code>: 모든 걸 통제하려는 사람"],"chunks":["<code>I'm a bit of a ...</code> 나는 좀 ...인 편이야."],"translation":"미안해요, 당신 말이 맞아요. 저는 손님 노릇을 정말 못해요. 제가 좀 통제하려는 성향이 있어서요. 아니, 많이 그래요."},{"english":"Maybe you should see a shrink.\nWell, maybe I should\njust stay at your place.\nReally?\nReally.","focus":"maybe you should / shrink","notes":["<code>Maybe you should ...</code>: ...하는 게 좋을지도 몰라","<code>shrink</code>: 정신과 의사, 상담가를 뜻하는 구어체","<code>stay at your place</code>: 네 집에서 머물다"],"chunks":["<code>Maybe I should just ...</code> 그냥 ...해야 할지도 모르겠네."],"translation":"상담가를 만나봐야겠네요. 그럼 제가 그냥 당신 집에서 지내야 할지도 모르죠. 정말요? 정말요."},{"english":"Oh, just give me one second.\nHello, Bradley.\nYeah, what's up?\nOh my God.\n-Baby?\n-They found my dad!\nThey found Johnny.","focus":"give me one second / find","notes":["<code>Give me one second.</code>: 잠깐만요","<code>What's up?</code>: 무슨 일이야?","<code>They found ...</code>: 그들이 ...를 찾았어"],"chunks":["<code>They found my dad!</code> 우리 아빠를 찾았어!"],"translation":"잠깐만요. 안녕, Bradley. 네, 무슨 일이에요? 세상에. 자기야? 우리 아빠를 찾았어! Johnny를 찾았어."},{"english":"He lives in Vermont, and he's still\na musician, just under a different name.\n-Which is why we couldn't find him.\n-Incredible.","focus":"under a different name / which is why","notes":["<code>under a different name</code>: 다른 이름으로","<code>which is why ...</code>: 그래서 ...한 것이다","<code>incredible</code>: 믿기 힘든, 대단한"],"chunks":["<code>Which is why we couldn't find him.</code> 그래서 우리가 그를 찾을 수 없었던 거야."],"translation":"그는 Vermont에 살고 있고, 아직 음악가예요. 다만 다른 이름으로요. 그래서 우리가 찾을 수 없었던 거예요. 믿기지 않네요."},{"english":"Your father was missing?\nNo. Yes.\nIt's kind of a long story,\nwhich I guess now I have to tell you.","focus":"missing / have to tell","notes":["<code>missing</code>: 실종된, 행방을 모르는","<code>No. Yes.</code>: 당황해서 대답이 엇갈리는 말","<code>have to tell you</code>: 말해줘야 한다"],"chunks":["<code>It's kind of a long story.</code> 이야기가 좀 길어요."],"translation":"당신 아버지가 실종됐었어요? 아니요. 맞아요. 이야기가 좀 긴데, 이제 말해줘야 할 것 같네요."},{"english":"Which is fine because I didn't get\na chance to read your New Yorker article,\nand Garrett says that\nwe can't talk about Megh at you think of me?</code> 네가 나를 그렇게 생각해?"],"translation":"방금 한 말을 다시 생각할 시간을 줄게. 난 돈 따위 전혀 신경 안 써, Garrett. 네가 나를 그렇게 생각해?"},{"english":"I honestly don't know what to think\nabout tonight, or about\nwhere we are in our relationship.","focus":"what to think / where we are","notes":["<code>I honestly don't know ...</code>: 솔직히 ...을 모르겠다","<code>what to think about</code>: ...을 어떻게 생각해야 할지","<code>where we are in our relationship</code>: 우리 관계가 어디쯤인지"],"chunks":["<code>I don't know where we are.</code> 우리가 어떤 상태인지 모르겠어."],"translation":"솔직히 오늘 밤에 대해, 그리고 우리 관계가 어디쯤인지에 대해 어떻게 생각해야 할지 모르겠어."},{"english":"We're in my apartment for the first time\nsince the week I moved in,\nwith my ridiculous friends\nwho say inane things.","focus":"for the first time since / ridiculous","notes":["<code>for the first time since ...</code>: ... 이후 처음으로","<code>move in</code>: 이사 들어오다","<code>ridiculous</code>: 우스꽝스러운, 말도 안 되는","<code>inane things</code>: 실없는 말들"],"chunks":[],"translation":"우린 내가 이사 온 주 이후 처음으로 내 아파트에 있고, 실없는 말을 하는 우스꽝스러운 내 친구들과 함께 있어."},{"english":"Well, maybe I should go.\nSounds like a plan.\nSee you later.\nGarrett, wait.\nHow am I supposed to get to Vermont?","focus":"sounds like a plan / supposed to","notes":["<code>Maybe I should go.</code>: 가는 게 좋겠어","<code>Sounds like a plan.</code>: 좋은 생각이네, 그렇게 해","<code>How am I supposed to ...?</code>: 내가 어떻게 ...하라는 거야?"],"chunks":["<code>How am I supposed to get to Vermont?</code> Vermont에는 어떻게 가라는 거야?"],"translation":"그럼 내가 가는 게 좋겠네. 좋은 생각이네. 나중에 봐. Garrett, 기다려. Vermont에는 어떻게 가라는 거야?"}];
