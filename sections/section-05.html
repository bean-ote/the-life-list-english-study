<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 5 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"You're not the only one missing her.","focus":"the only one / miss","notes":["<code>the only one + -ing</code>: ...하는 유일한 사람","<code>miss + 사람</code>: 사람을 그리워하다"],"chunks":["<code>You're not the only one ...</code> ...하는 사람은 너뿐이 아니야."],"translation":"엄마를 그리워하는 사람은 너뿐이 아니야."},{"english":"I'm here to see Brad Ackerman.\nI'm Alex Rose.\nIs he expecting you?\n- No, but I'm sure if you--\n- Alex!\n-Hey!\n-Did we have an appointment?","focus":"be here to / appointment","notes":["<code>be here to + 동사</code>: ...하러 여기 오다","<code>expect + 사람</code>: 사람이 오기로 되어 있어 기다리다","<code>have an appointment</code>: 약속이 잡혀 있다"],"chunks":["<code>I'm here to see ...</code> ...을 만나러 왔어요."],"translation":"Brad Ackerman을 만나러 왔어요. 저는 Alex Rose예요. 약속이 잡혀 있나요? 아니지만... Alex! 안녕하세요! 우리 약속이 있었나요?"},{"english":"I-I was just about to go shopping.\nNina's coming into town next week,\nand I thought it was time for a new tie.\n-Because of what I said?\n-Yep.","focus":"be about to / come into town","notes":["<code>be about to + 동사</code>: 막 ...하려던 참이다","<code>come into town</code>: 이 도시로 오다","<code>because of + 명사</code>: ...때문에"],"chunks":["<code>I was just about to ...</code> 막 ...하려던 참이었어요."],"translation":"막 쇼핑하러 가려던 참이었어요. Nina가 다음 주에 오는데 새 넥타이를 살 때가 됐다고 생각했죠. 제가 한 말 때문에요? 네."},{"english":"You know, I always hoped, if only\nI could change just one person's life.\nWhy are you here?","focus":"if only / change a life","notes":["<code>if only + 문장</code>: ...할 수만 있다면","<code>change someone's life</code>: 사람의 인생을 바꾸다"],"chunks":["<code>Why are you here?</code> 무슨 일로 왔어요?"],"translation":"늘 단 한 사람의 인생이라도 바꿀 수 있기를 바랐거든요. 무슨 일로 왔어요?"},{"english":"Uh, I finished Moby Dick.\nThought I'd pick up my DVD, and, um,\nI wanted to ask\nfor your help with something.\nSure I think.","focus":"pick up / ask for help","notes":["<code>pick up</code>: 찾아가다, 수령하다","<code>ask for help with</code>: ...에 관한 도움을 요청하다","<code>wanted</code>: 현재의 용건을 완곡하게 꺼내는 표현"],"chunks":["<code>I wanted to ask for your help with ...</code> ...에 관해 도움을 부탁드리려고요."],"translation":"「Moby Dick」을 다 읽었어요. DVD를 받으러 왔고 부탁할 일도 있어요. 물론이죠. 아마도요."},{"english":"The thing I keep obsessing about\nis why she didn't tell me.\nWe told each other everything.\nWas she afraid or ashamed?\nDid she ever give you\na hint about any of it?","focus":"keep -ing / ashamed / hint","notes":["<code>obsess about</code>: ...에 집착하다","<code>ashamed</code>: 부끄럽고 수치스러운","<code>give someone a hint</code>: 사람에게 암시를 주다"],"chunks":["<code>The thing I keep thinking about is ...</code> 내가 계속 생각하는 건 ...예요."],"translation":"계속 마음에 걸리는 건 엄마가 왜 말하지 않았느냐는 거예요. 우리는 서로 모든 걸 말했어요. 두려웠을까요, 부끄러웠을까요? 혹시 암시라도 했나요?"},{"english":"No, no, she never said a word.\nHonestly, the whole thing\nseems really just unlikely.","focus":"never say a word / unlikely","notes":["<code>never say a word</code>: 한마디도 하지 않다","<code>unlikely</code>: 가능성이 낮은, 믿기 어려운"],"chunks":[],"translation":"아니요, 한마디도 하지 않았어요. 솔직히 이 모든 일이 정말 믿기지 않아요."},{"english":"Maybe it's a part of who she really was,\nand it's one of the reasons she sent me\non this crazy \"Alex in Wonderland\" journey\nto find out for myself.","focus":"who she was / find out","notes":["<code>who she really was</code>: 그녀의 진짜 모습","<code>one of the reasons</code>: 여러 이유 중 하나","<code>find out for oneself</code>: 스스로 알아내다"],"chunks":["<code>Maybe it's part of ...</code> 어쩌면 그건 ...의 일부일지도 몰라요."],"translation":"어쩌면 그것도 엄마의 진짜 모습 일부였고, 제가 직접 알아내도록 이 미친 “Alex in Wonderland” 여정에 보낸 이유 중 하나일지도 몰라요."},{"english":"-No, way too boring.\n-What?\nMake an effort here, Bradley.\nSo\nWill you help me find Johnny Alvarez?","focus":"way too / make an effort","notes":["<code>way too + 형용사</code>: 너무나 ...한","<code>make an effort</code>: 노력을 기울이다"],"chunks":["<code>Will you help me + 동사?</code> 제가 ...하도록 도와줄래요?"],"translation":"아니요, 너무 지루해요. 뭐가요? 좀 더 노력해봐요, Bradley. 그러니까 Johnny Alvarez를 찾는 걸 도와줄래요?"},{"english":"Yeah, yeah, of course.\nWe could start by googling him.\nWow, you really do think of everything.\nOkay, smarty-pants,\nwhat did you come up with?","focus":"start by / come up with","notes":["<code>start by + -ing</code>: ...하는 것부터 시작하다","<code>do + 동사</code>: 정말 ...한다고 강조","<code>come up with</code>: 답이나 아이디어를 찾아내다"],"chunks":["<code>What did you come up with?</code> 뭘 찾아냈어요?"],"translation":"물론이죠. 인터넷 검색부터 해보죠. 정말 모든 걸 생각해내네요. 좋아요, 똑똑이 씨. 뭘 찾아냈어요?"},{"english":"A bandleader named Johnny Alvarez,\nexcept he was born in 1918.\nUh, I tried John, Juan, Jonathan\nThere's, like, a thousand entries.","focus":"named / except / entry","notes":["<code>named + 이름</code>: ...라는 이름의","<code>except</code>: 다만","<code>entry</code>: 검색 결과나 목록 항목"],"chunks":[],"translation":"Johnny Alvarez라는 밴드 지휘자를 찾았는데 1918년생이에요. John, Juan, Jonathan도 검색했지만 결과가 천 개쯤 나와요."},{"english":"Perfect\nfor your middle school graduation.\nCome on, this is\nthe amazing Tina we're talking about.\nNina, actually.","focus":"perfect for / actually","notes":["<code>perfect for</code>: ...에 완벽한","<code>We're talking about ...</code>: 지금 이야기하는 사람은 ...이다","<code>actually</code>: 사실은, 정확히는"],"chunks":[],"translation":"중학교 졸업식에 완벽하겠네요. 왜 그래요, 그 멋진 Tina를 만나는 거잖아요. 사실 Nina예요."},{"english":"Um, there is someone that I use\non divorce cases, but she's not cheap.\n-If the money's a problem, I can talk--\n-No, it's not the money. It's","focus":"use on a case / not cheap","notes":["<code>use someone on a case</code>: 사건에 전문가를 고용하다","<code>She's not cheap.</code>: 비용이 비싸다"],"chunks":["<code>If the money's a problem ...</code> 비용이 문제라면 ..."],"translation":"이혼 사건에서 고용하는 사람이 있는데 비용이 싸지는 않아요. 돈이 문제라면... 아니요, 돈 문제가 아니에요."},{"english":"It's like I've fallen down\nthis weird rabbit hole.\nOld family secrets, private detectives,\nbecoming friends with a lawyer.\nNothing makes sense anymore.","focus":"rabbit hole / make sense","notes":["<code>fall down a rabbit hole</code>: 끝없이 복잡한 세계에 빠져들다","<code>private detective</code>: 사립 탐정","<code>make sense</code>: 이해되다, 말이 되다"],"chunks":["<code>Nothing makes sense anymore.</code> 이제 아무것도 말이 되지 않아요."],"translation":"이상한 토끼굴에 빠진 기분이에요. 오래된 가족 비밀, 사립 탐정, 변호사와 친구가 되는 것까지. 이제 아무것도 말이 안 돼요."},{"english":"So we're friends now?\nLooks good.\n-Yeah?\n-Yeah.\nNow all you need is a suit to go with it.\nI was actually just--\nShh.\n-Get a new suit.\n-Yeah.","focus":"all you need / go with","notes":["<code>all you need is ...</code>: 필요한 건 ...뿐이다","<code>go with + 명사</code>: ...와 어울리다"],"chunks":["<code>All you need is ... to go with it.</code> 이제 그것과 어울릴 ...만 있으면 돼요."],"translation":"그럼 이제 우리 친구인가요? 잘 어울려요. 이제 넥타이에 어울리는 정장만 있으면 돼요. 사실 저는... 쉿. 새 정장을 사요. 알겠어요."},{"english":"Hiya, Bean.\nYou like my new tripod stick thingy\nI got for the camera?\nIt's not bad, just a little shaky.","focus":"hiya / thingy / shaky","notes":["<code>Hiya.</code>: Hi의 매우 편한 인사","<code>thingy</code>: 이름이 생각나지 않을 때 쓰는 “그 뭐시기”","<code>shaky</code>: 흔들리는"],"chunks":["<code>It's not bad, just ...</code> 나쁘진 않은데 조금 ...해."],"translation":"안녕, Bean. 카메라용 새 삼각대 막대기 같은 거 마음에 드니? 나쁘진 않은데 조금 흔들리네."},{"english":"Our chair.\nHmm. Needs a little love.\nWell, I'll have to get that\ntaken care of before I\nBefore I Why is it so hard to say \"die\"?\nI'm gonna die.","focus":"need love / take care of","notes":["<code>need a little love</code>: 손질이나 관심이 필요하다","<code>get something taken care of</code>: 일을 처리되게 하다"],"chunks":["<code>I'll have to get that taken care of.</code> 그건 처리해둬야겠어."],"translation":"우리 의자네. 손질이 좀 필요해. 죽기 전에 처리해야... 왜 “죽다”라는 말을 하기가 이렇게 어려울까? 나는 죽을 거야."},{"english":"How does that line go?\n\"What dreams may come\nwhen we shuffle off the mortal coil must\"\n-\"must give us pause.\"\n-\"give us pause.\"\n\"must give us pause.\"","focus":"how does it go / mortal coil","notes":["<code>How does that line go?</code>: 그 대사가 어떻게 되지?","<code>shuffle off the mortal coil</code>: 죽음을 뜻하는 문학적 표현","<code>give someone pause</code>: 잠시 멈춰 생각하게 하다"],"chunks":[],"translation":"그 대사가 어떻게 되지? “우리가 이 필멸의 굴레를 벗어났을 때 어떤 꿈을 꾸게 될지가 우리를 멈춰 생각하게 한다.”"},{"english":"Ah, that's got a nice ring to it.\nLike I could stick around,\nbut in some cool dream state\nwithout pain or suffering.","focus":"nice ring / stick around","notes":["<code>have a nice ring to it</code>: 듣기에 어감이 좋다","<code>stick around</code>: 떠나지 않고 머물다"],"chunks":["<code>That's got a nice ring to it.</code> 그 말은 어감이 좋네."],"translation":"그 말은 어감이 좋구나. 내가 계속 곁에 있되 고통이나 괴로움 없는 멋진 꿈속 상태로 있는 것처럼."},{"english":"Speaking of suffering,\nhow friggin' long is this book?\nI just kept looking for\nsome sort of inspiring connection\nbetween the book and the list.","focus":"speaking of / keep -ing","notes":["<code>Speaking of ...</code>: ... 이야기가 나와서 말인데","<code>friggin'</code>: 짜증이나 강조를 나타내는 완곡한 비속어","<code>some sort of</code>: 어떤 종류의"],"chunks":["<code>Speaking of ..., ...</code> ... 얘기가 나와서 말인데 ..."],"translation":"고통 얘기가 나와서 말인데 이 책은 대체 얼마나 긴 거니? 책과 리스트 사이에서 영감을 주는 연결점을 계속 찾으려 했어."},{"english":"But the best I could come up with was,\nI'm Ahab, you're my whale,\nand I've set you off\non this hopeless quest.\nI mean, I got a lot of nerve.","focus":"come up with / set off / nerve","notes":["<code>the best I could come up with</code>: 내가 생각해낼 수 있었던 최선","<code>set someone off on a quest</code>: 사람을 탐색에 나서게 하다","<code>have a lot of nerve</code>: 뻔뻔하다"],"chunks":[],"translation":"내가 생각해낸 최선은 나는 Ahab이고 너는 나의 고래이며, 내가 너를 가망 없는 탐색에 내보냈다는 거야. 내가 참 뻔뻔하지."},{"english":"-No, Mom, you have--\n-Right?\nWhat am I doing? Playing God?\nAs if I'm some kind of paragon of\nwisdom and virtue, which I can\nassure you, my darling, that I am not.","focus":"play God / paragon / assure","notes":["<code>play God</code>: 신처럼 남의 삶을 좌우하려 하다","<code>paragon of</code>: ...의 모범이나 전형","<code>assure + 사람</code>: 사람에게 확신시키다"],"chunks":["<code>I can assure you that ...</code> ...라는 건 확실히 말할 수 있어."],"translation":"내가 신 노릇이라도 하는 거야? 마치 지혜와 미덕의 모범인 것처럼. 하지만 사랑하는 딸아, 내가 그런 사람이 아니라는 건 확실히 말할 수 있어."},{"english":"Yeah, so, um,\nDad told me.\nThe truth is, I\nI","focus":"the truth is / hesitation","notes":["<code>The truth is, ...</code>: 사실은 ...","<code>I I</code>: 감정 때문에 말을 잇
