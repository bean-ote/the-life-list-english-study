<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 4 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"I know what you're thinking.\nWhat's a girl like me\ndoing with a book like this?","focus":"know what / a girl like me","notes":["<code>I know what you're thinking.</code>: 무슨 생각을 하는지 알아요","<code>a girl like me</code>: 나 같은 여자"],"chunks":["<code>What's ... doing with ...?</code> ...가 ...을 가지고 뭐 하는 거지?"],"translation":"무슨 생각 하는지 알아요. 나 같은 여자가 이런 책을 들고 뭐 하나 싶죠?"},{"english":"You're already doing better than me.\nI only got to the first chapter.\nSame. In high school,\nand then in college too.","focus":"do better than / get to","notes":["<code>do better than + 사람</code>: 사람보다 더 잘하다","<code>get to + 지점</code>: 그 지점까지 가다"],"chunks":["<code>I only got to ...</code> 나는 ...까지만 갔어요."],"translation":"벌써 나보다 잘하고 있네요. 나는 1장까지만 읽었어요. 나도요. 고등학교 때도, 대학 때도 그랬죠."},{"english":"Then the other night I was on TikTok,\nfeeling a record-breaking level of\nself-loathing, and I decided to try again.","focus":"the other night / decide to","notes":["<code>the other night</code>: 며칠 전 밤","<code>self-loathing</code>: 자기혐오","<code>decide to + 동사</code>: ...하기로 결심하다"],"chunks":["<code>I decided to try again.</code> 다시 해보기로 했어요."],"translation":"그러다 며칠 전 밤 TikTok을 보며 기록적인 수준의 자기혐오를 느끼다가 다시 읽어보기로 했어요."},{"english":"Something just clicked,\nand I got into the rhythm of it,\nand now I I can't put it down.","focus":"click / get into the rhythm","notes":["<code>Something clicked.</code>: 갑자기 이해되거나 감이 잡혔다","<code>get into the rhythm of</code>: ...의 리듬을 타다","<code>can't put it down</code>: 너무 재미있어 내려놓을 수 없다"],"chunks":["<code>I can't put it down.</code> 손에서 놓을 수가 없어요."],"translation":"갑자기 뭔가 감이 잡혔고 리듬을 타기 시작했어요. 이제는 책을 내려놓을 수가 없네요."},{"english":"So you're saying\nI should finally get myself a TikTok?\nStand clear of the closing doors, please.","focus":"so you are saying / get oneself","notes":["<code>So you're saying ...?</code>: 그러니까 ...라는 말이에요?","<code>get myself + 명사</code>: 나를 위해 ...을 마련하다","<code>stand clear of</code>: ...에서 떨어져 있다"],"chunks":["<code>So you're saying I should ...?</code> 그러니까 내가 ...해야 한다는 말이에요?"],"translation":"그러니까 나도 드디어 TikTok을 해야 한다는 말이에요? 문이 닫히니 물러서 주십시오."},{"english":"Our regular teacher, Mrs. Monnell,\nwent into labor a month early,\n-so we're grateful you could fill in.\n-I'm grateful you asked me.","focus":"go into labor / fill in","notes":["<code>go into labor</code>: 진통이 시작되다","<code>a month early</code>: 한 달 일찍","<code>fill in</code>: 임시로 대신하다"],"chunks":["<code>We're grateful you could ...</code> ...해주셔서 감사해요."],"translation":"담임인 Mrs. Monnell이 한 달 일찍 진통을 시작해서 대신 맡아주셔서 감사해요. 불러주셔서 제가 감사하죠."},{"english":"Now, the goal is\nto keep the kids on an even keel\nand up to speed on core subjects\nwhile they're living here.","focus":"goal / even keel / up to speed","notes":["<code>on an even keel</code>: 안정된 상태로","<code>up to speed on</code>: ...의 진도를 따라잡은","<code>core subjects</code>: 주요 교과목"],"chunks":["<code>The goal is to ...</code> 목표는 ...하는 것입니다."],"translation":"목표는 아이들이 여기 사는 동안 정서적으로 안정되고 주요 과목의 진도를 놓치지 않게 하는 거예요."},{"english":"-Which could be weeks, sometimes months.\n-Right.\nLesson plans and files for each child.\nLater you'll meet with Dr. Taylor,\none of our consulting therapists.","focus":"could be / later","notes":["<code>could be</code>: ...일 수도 있다","<code>lesson plan</code>: 수업 계획","<code>consulting therapist</code>: 자문 치료사"],"chunks":[],"translation":"그 기간은 몇 주, 때로는 몇 달이 될 수도 있어요. 알겠습니다. 아이별 수업 계획과 파일이에요. 나중에 자문 치료사인 Dr. Taylor를 만나게 될 거예요."},{"english":"Anything else you need, just ask.\nThen I'll tell you\nwhy you probably can't have it.\nGood luck.","focus":"anything else / just ask","notes":["<code>Anything else you need</code>: 그 밖에 필요한 것은 무엇이든","<code>Just ask.</code>: 말만 해요, 물어봐요"],"chunks":["<code>Anything else you need, just ask.</code> 그 밖에 필요한 게 있으면 말해요."],"translation":"그 밖에 필요한 게 있으면 말해요. 그러면 아마 왜 안 되는지 알려줄게요. 행운을 빌어요."},{"english":"Good morning.\nI'm Miss Rose.\nHey, guys, can we just please\nquiet down so we can get started?","focus":"quiet down / get started","notes":["<code>quiet down</code>: 조용히 하다","<code>so + 문장</code>: ...할 수 있도록"],"chunks":["<code>Can we please quiet down?</code> 우리 좀 조용히 할까요?"],"translation":"좋은 아침이에요. 저는 Miss Rose예요. 얘들아, 수업을 시작할 수 있게 좀 조용히 해줄래?"},{"english":"- Whoa!\n- Aaron!\nAaron, come on. Give me my sweater.\n-Can you please give her the sweater?\n-It's not even funny.","focus":"come on / not even","notes":["<code>Come on.</code>: 왜 이래, 어서","<code>not even funny</code>: 전혀 웃기지도 않다"],"chunks":["<code>Can you please give her ...?</code> 그녀에게 ...을 돌려줄래?"],"translation":"우와! Aaron! 왜 그래, 내 스웨터 돌려줘. 그 애에게 스웨터를 돌려줄래? 하나도 안 웃겨."},{"english":"Aaron, come on, man.\nPink's not even your color.\n-Thank you, Your Majesty.\n-Thanks.","focus":"not your color / Your Majesty","notes":["<code>not someone's color</code>: 그 사람에게 어울리는 색이 아니다","<code>Your Majesty</code>: 폐하"],"chunks":[],"translation":"Aaron, 그만해. 분홍색은 너한테 어울리지도 않아. 감사합니다, 폐하. 고마워."},{"english":"Some people think\nHamlet is a play about indecision.\nYou know, the feeling when\nyou can't decide between Edward and Jacob,\nor whoever the hot vampires are\nthese days.","focus":"indecision / these days","notes":["<code>indecision</code>: 우유부단함","<code>the feeling when ...</code>: ...할 때의 느낌","<code>these days</code>: 요즘"],"chunks":["<code>You can't decide between A and B</code> A와 B 중 결정하지 못하다"],"translation":"어떤 사람들은 「Hamlet」이 우유부단함에 관한 희곡이라고 생각해요. Edward와 Jacob, 아니 요즘 인기 있는 뱀파이어가 누구든 그 둘 중 고르지 못하는 느낌처럼요."},{"english":"Miss Rose,\nyou gotta update your references.","focus":"gotta / reference","notes":["<code>gotta</code>: got to 또는 have got to의 구어체","<code>reference</code>: 인용이나 비유의 소재"],"chunks":["<code>You gotta update ...</code> ...을 최신으로 바꿔야 해요."],"translation":"Miss Rose, 비유를 좀 최신으로 바꾸셔야겠어요."},{"english":"So I want everyone\nto write about a time\nwhen they had\nsomething really important to do.","focus":"want someone to / a time when","notes":["<code>want + 사람 + to + 동사</code>: 사람에게 ...하기를 원하다","<code>a time when ...</code>: ...했던 때"],"chunks":["<code>Write about a time when ...</code> ...했던 때에 관해 쓰세요."],"translation":"모두 정말 중요한 일을 해야 했던 때에 관해 써보세요."},{"english":"But like Hamlet,\nyou couldn't quite\nfind a way to take action.\nYou have 30 minutes.","focus":"quite / take action","notes":["<code>couldn't quite</code>: 좀처럼 ...하지 못했다","<code>take action</code>: 행동에 나서다"],"chunks":["<code>find a way to + 동사</code> ...할 방법을 찾다"],"translation":"하지만 Hamlet처럼 좀처럼 행동에 나설 방법을 찾지 못했던 때요. 30분 줄게요."},{"english":"Wow, that's really beautiful.\nThank you.\nBut it's not the assignment we're doing,\nis it, Ezra?\nWhatever.","focus":"tag question / whatever","notes":["<code>is it?</code>: 그렇지?라는 부가의문문","<code>Whatever.</code>: 아무래도 상관없어, 됐어요"],"chunks":[],"translation":"와, 정말 아름답다. 고마워요. 하지만 지금 하는 과제는 아니지, Ezra? 아무래도 상관없어요."},{"english":"You know, that's not a bad word\nfor thinking about Hamlet.\n-Why not use it as a starting point?\n-Maybe 'cause I don't care.","focus":"not a bad / starting point","notes":["<code>not a bad + 명사</code>: 꽤 괜찮은 ...","<code>starting point</code>: 출발점","<code>'cause</code>: because의 구어체 축약"],"chunks":["<code>Why not use it as ...?</code> 그것을 ...로 써보는 건 어때?"],"translation":"그건 Hamlet을 생각할 때 꽤 괜찮은 단어야. 출발점으로 써보는 건 어때? 어쩌면 내가 관심이 없어서요."},{"english":"Maybe because \"to be or not to be\"\nis a stupid question.\nHmm. Maybe.\nOr maybe it's the most important question.","focus":"maybe because / most important","notes":["<code>Maybe because ...</code>: 어쩌면 ...이기 때문일지도","<code>the most important</code>: 가장 중요한"],"chunks":[],"translation":"어쩌면 “사느냐 죽느냐”가 바보 같은 질문이라서요. 그럴지도. 아니면 가장 중요한 질문일지도 모르지."},{"english":"And hey, if you don't agree with me,\nthen maybe you can write about that.\nIn the meantime, I will take a deeper\ndive into your beautiful art.","focus":"agree with / in the meantime / deep dive","notes":["<code>agree with + 사람</code>: 사람에게 동의하다","<code>in the meantime</code>: 그동안","<code>take a deep dive into</code>: ...을 깊이 살펴보다"],"chunks":["<code>If you don't agree, write about that.</code> 동의하지 않으면 그 점을 써보세요."],"translation":"내 말에 동의하지 않는다면 그 점을 써도 돼. 그동안 나는 네 아름다운 작품을 더 깊이 살펴볼게."},{"english":"Hey, give that back!\nAbsolutely, the second you're done.\nAh! Ow!\n-Ezra, what do you think you're doing?\n-Taking action.","focus":"the second / take action","notes":["<code>the second + 문장</code>: ...하는 즉시","<code>What do you think you're doing?</code>: 지금 대체 뭐 하는 거야?"],"chunks":["<code>The second you're done.</code> 네가 끝내는 즉시."],"translation":"이봐요, 돌려줘요! 물론이지, 네가 끝내는 즉시. 아야! Ezra, 지금 뭐 하는 거니? 행동에 나서는 거요."},{"english":"Oh my God.\nHe wouldn't do the assignment,\nand then he gave me the finger.\nOnly after you took away\nhis prized possession.","focus":"would not / give the finger","notes":["<code>wouldn't do</code>: 완강히 ...하려 하지 않았다","<code>give someone the finger</code>: 가운데손가락을 세워 욕하다","<code>prized possession</code>: 매우 아끼는 물건"],"chunks":[],"translation":"세상에. 과제를 하지 않더니 나한테 손가락 욕까지 했어요. 당신이 그 애의 가장 아끼는 물건을 빼앗은 뒤에야 그랬죠."},{"english":"-Right, but I didn't know that.\n-It was in the folder I asked you to read.\nTen minutes before class.","focus":"ask someone to / before class","notes":["<code>ask + 사람 + to + 동사</code>: 사람에게 ...하라고 부탁하다","<code>before class</code>: 수업 전에"],"chunks":[],"translation":"맞아요, 하지만 몰랐어요. 읽으라고 드린 파일에 있었어요. 수업 10분 전에 주셨잖아요."},{"english":"Alex, these children\nare in a very vulnerable place.\nBefore anything else, you have to\nunderstand that if this is gonna work.","focus":"vulnerable / before anything else","notes":["<code>vulnerable</code>: 상처받기 쉬운, 취약한","<code>before anything else</code>: 무엇보다 먼저","<code>if this is gonna work</code>: 이 일이 제대로 되려면"],"chunks":["<code>Before anything else, ...</code> 무엇보다 먼저 ..."],"translation":"Alex, 이 아이들은 아주 취약한 상황에 있어요. 이 일이 제대로 되려면 무엇보다 먼저 그걸 이해해야 해요."},{"english":"Ms. Howard, I can teach these kids. I want\nto teach them. Please don't fire me.\nWho's getting fired?\nNobody. Yet.","focus":"fire / yet","notes":["<code>fire + 사람</code>: 사람을 해고하다","<code>Nobody. Yet.</code>: 아직은 아무도 아니에요"],"chunks":["<code>Please don't fire me.</code> 저를 해고하지 말아주세요."],"translation":"Ms. Howard, 저는 이 아이들을 가르칠 수 있고 가르치고 싶어요. 해고하지 말아주세요. 누가 해고돼요? 아무도요. 아직은."},{"english":"This is Alex Rose, the teacher\nrecommended by Brad Ackerman.\nAnd it's her first day,\nand it's not going particularly well.","focus":"recommended by / particularly","notes":["<code>recommended by</code>: ...가 추천한","<code>particularly</code>: 특별히, 그다지"],"chunks":["<code>It's not going particularly well.</code> 일이 그다지 잘 풀리지 않고 있어요."],"translation":"이쪽은 Brad Ackerman이 추천한 교사 Alex Rose예요. 첫날인데 일이 그다지 잘 풀리지는 않고 있어요."},{"english":"Well, I remember your first day, Carol.\nActually, I remember the whole week.\nVery funny.\nMaybe you can help Alex\nget the hang of how things work?","focus":"get the hang of / how things work","notes":["<code>get the hang of</code>: 요령을 익히다","<code>how things work</code>: 일이 돌아가는 방식"],"chunks":["<code>Help someone get the hang of ...</code> 사람이 ...의 요령을 익히게 돕다"],"translation":"Carol, 당신의 첫날도 기억해요. 사실 첫 주 전체가 기억나죠. 참 재미있네요. Alex가 이곳의 돌아가는 방식을 익히도록 도와줄래요?"},{"english":"Yeah, I'd be delighted.\nGirl with Moby Dick.\nThat did not come out right.","focus":"be delighted / come out right","notes":["<code>I'd be delighted.</code>: 기꺼이 그러죠","<code>come out right</code>: 말이 의도대로 나오다"],"chunks":["<code>That didn't come out right.</code> 방금 말이 이상하게 나왔네요."],"translation":"기꺼이요. 「Moby Dick」을 든 여자분. 방금 말이 이상하게 나왔네요."},{"english":"Ezra's mom died last year,\nand he and his aunt are here\nwhile she sorts out\na complicated family situation.","focus":"while / sort out","notes":["<code>sort out</code>: 문제를 정리하고 해결하다","<code>family situation</code>: 가족 사정"],"chunks":[],"translation":"Ezra의 엄마가 작년에 돌아가셨고, 이모가 복잡한 가족 문제를 해결하는 동안 둘이 이곳에 머물고 있어요."},{"english":"My mother died recently.\nI'm so sorry.\nThank you. Uh, but I'm thinking\nmaybe it's something\nI could connect with him about.","focus":"recently / connect with","notes":["<code>recently</code>: 최근에","<code>connect with + 사람</code>: 사람과 공감대를 형성하다"],"chunks":["<code>Somethin de>: 식당 계산서"],"chunks":["<code>Can I get the check, please?</code> 계산서 주세요."],"translation":"아, 세금을 속였나 보네요. 아니, 잠깐. 아빠를 두고 바람피웠어요? 아빠? 실례합니다, 계산서 좀 주세요."},{"english":"Dad.\nShe cheated on you,\nthat's what you're saying, isn't it?\nDad, you can't just drop a bomb\nlike that and walk away.","focus":"that is what / drop a bomb","notes":["<code>That's what you're saying</code>: 그게 지금 하는 말이다","<code>drop a bomb</code>: 폭탄 같은 충격적인 말을 던지다","<code>walk away</code>: 자리를 떠나다"],"chunks":["<code>You can't just ... and walk away.</code> 그렇게 ...하고 가버리면 안 돼요."],"translation":"아빠. 엄마가 아빠를 두고 바람피웠다는 말이죠? 그런 폭탄 같은 말을 던지고 그냥 가면 안 돼요."},{"english":"I was 15 when you got divorced,\nis that when it happened?\nWhy are you running away from me? Stop!","focus":"get divorced / happen","notes":["<code>get divorced</code>: 이혼하다","<code>run away from + 사람</code>: 사람을 피해 달아나다"],"chunks":["<code>Is that when it happened?</code> 그때 그 일이 있었던 거예요?"],"translation":"두 분이 이혼했을 때 제가 열다섯이었어요. 그때 일어난 일이에요? 왜 저를 피해 도망가요? 멈춰요!"},{"english":"Things happen in a marriage, Alex.\nBut we got through it, and we managed\nto have some pretty good years together,\nso can we please just leave it at that?","focus":"get through / leave it at that","notes":["<code>get through</code>: 어려운 일을 견뎌내다","<code>manage to</code>: 어렵게 ...해내다","<code>leave it at that</code>: 그 정도로 이야기를 끝내다"],"chunks":["<code>Can we leave it at that?</code> 그 이야기로 끝내면 안 될까?"],"translation":"결혼 생활에서는 여러 일이 생긴다. 하지만 우리는 그 일을 넘겼고 꽤 좋은 세월도 함께 보냈어. 그러니 그 정도로 끝내면 안 되겠니?"},{"english":"No, we can't.\nPlease, I need to know.\nIt was before you were born.\nIt wasn't just a fling. Something\nSomething else happened.\nOh.","focus":"before / fling / something else","notes":["<code>fling</code>: 짧고 가벼운 연애","<code>something else</code>: 다른 무언가"],"chunks":["<code>It wasn't just a fling.</code> 단순한 한때의 바람이 아니었어."],"translation":"아니요, 안 돼요. 제발 알아야겠어요. 네가 태어나기 전 일이었어. 단순한 한때의 바람이 아니었고 다른 일이 생겼어. 아."},{"english":"Why don't we go for a walk, sweetheart?\nAre you kidding me?\nLet me get this straight.\nYou're saying that Dad\nis not actually my father.","focus":"why do not we / get this straight","notes":["<code>Why don't we ...?</code>: 우리 ...하는 게 어떨까?","<code>Let me get this straight.</code>: 정확히 이해했는지 확인해볼게","<code>actually</code>: 실제로"],"chunks":["<code>You're saying that ...</code> 지금 ...라는 말이에요?"],"translation":"우리 산책할까, 얘야? 지금 농담해? 정확히 이해해보자. 아빠가 사실 내 친아버지가 아니라는 말이죠?"},{"english":"Mom had an affair\nwith a musician named Johnny Alvarez.\nApparently he played at a club\nthey'd go to in the Village.","focus":"have an affair / named","notes":["<code>have an affair with</code>: ...와 불륜 관계를 맺다","<code>named + 이름</code>: ...라는 이름의","<code>apparently</code>: 듣자 하니"],"chunks":[],"translation":"엄마는 Johnny Alvarez라는 음악가와 불륜 관계였대. 두 분이 Village에서 다니던 클럽에서 연주했다고 해."},{"english":"Um, that's just\nI don't know what to say.\nJohnny Alvarez?\nSounds like Mom had a type.\nLucas.","focus":"know what to say / have a type","notes":["<code>I don't know what to say.</code>: 무슨 말을 해야 할지 모르겠어","<code>have a type</code>: 선호하는 이성 유형이 있다"],"chunks":["<code>Sounds like ...</code> ...인 것 같네."],"translation":"그건 정말... 무슨 말을 해야 할지 모르겠어. Johnny Alvarez? 엄마에게 취향이 있었나 보네. Lucas."},{"english":"She ended the relationship\nwhen she got pregnant,\nand she and Dad made this agreement\nnot to tell me. Or any of us.","focus":"end a relationship / make an agreement","notes":["<code>end a relationship</code>: 관계를 끝내다","<code>get pregnant</code>: 임신하다","<code>make an agreement not to</code>: ...하지 않기로 합의하다"],"chunks":[],"translation":"엄마는 임신했을 때 그 관계를 끝냈고 아빠와 나에게, 아니 우리 모두에게 말하지 않기로 합의했대."},{"english":"Like that was the way\nthat they could save their marriage.\nAlex, I can't imagine how difficult\nit must be to make sense of this.","focus":"save a marriage / make sense of","notes":["<code>save a marriage</code>: 결혼 생활을 지키다","<code>make sense of</code>: 이해하고 받아들이다","<code>must be</code>: 틀림없이 ...일 것이다"],"chunks":["<code>I can't imagine how difficult ...</code> 얼마나 어려울지 상상도 못 하겠어."],"translation":"그게 두 분이 결혼을 지킬 방법이라고 생각한 거지. Alex, 이 일을 이해하고 받아들이기가 얼마나 어려울지 상상도 못 하겠어."},{"english":"I'm somewhere between numb\nand completely furious.\nLike, who am I?\nAnd why didn't anyone,\nnamely Mom, bother to tell me?","focus":"somewhere between / bother to","notes":["<code>somewhere between A and B</code>: A와 B 사이 어딘가","<code>numb</code>: 감각이 없고 멍한","<code>furious</code>: 몹시 화난","<code>bother to + 동사</code>: 애써 ...하다"],"chunks":["<code>Why didn't anyone bother to tell me?</code> 왜 아무도 내게 말해주지 않았지?"],"translation":"나는 멍한 상태와 완전히 분노한 상태 사이 어딘가에 있어. 나는 누구지? 왜 아무도, 특히 엄마는 내게 말해줄 생각조차 하지 않았을까?"},{"english":"It definitely explains\na lot about me and Dad.\nWhy he never could love me\nthe same as you guys.","focus":"explain / the same as","notes":["<code>explain a lot about</code>: ...에 관한 많은 것을 설명하다","<code>the same as</code>: ...와 똑같이"],"chunks":[],"translation":"이 일은 나와 아빠 사이의 많은 것을 분명 설명해줘. 왜 아빠가 나를 너희와 똑같이 사랑할 수 없었는지도."},{"english":"-No.\n-Hey, that is not true, okay?\nAnd he's still your father.\nHe's the man who raised you.","focus":"still / relative clause","notes":["<code>raise + 사람</code>: 사람을 키우다","<code>the man who raised you</code>: 너를 키운 남자"],"chunks":["<code>He's still your father.</code> 그래도 그분은 네 아버지야."],"translation":"아니야. 그건 사실이 아니야. 그래도 아빠는 네 아버지야. 너를 키운 사람이잖아."},{"english":"I don't know.\nI think I need to find him.\nI'm not sure that's a good idea.\nJulian, how can you say that?\nAlex should know\nwho her biological father is.","focus":"need to / biological father","notes":["<code>biological father</code>: 생물학적 친부","<code>I'm not sure that's a good idea.</code>: 그게 좋은 생각인지 모르겠어"],"chunks":["<code>How can you say that?</code> 어떻게 그런 말을 할 수 있어?"],"translation":"모르겠어. 그 사람을 찾아야 할 것 같아. 그게 좋은 생각인지 모르겠어. Julian, 어떻게 그런 말을 해? Alex는 친부가 누구인지 알아야 해."},{"english":"I know, but the company is\na trusted family brand\ngoing through What?\nIt's going through a big transition\nright now, and if the story gets out--","focus":"go through / get out","notes":["<code>go through a transition</code>: 전환기를 겪다","<code>get out</code>: 소문이나 정보가 밖으로 알려지다","<code>trusted family brand</code>: 신뢰받는 가족 브랜드"],"chunks":["<code>If the story gets out ...</code> 이 이야기가 알려지면 ..."],"translation":"알아. 하지만 회사는 신뢰받는 가족 브랜드이고 지금 큰 전환기를 겪고 있어. 이 이야기가 알려지면... 뭐라고?"},{"english":"The story? Are you kidding me?\nAlex, we are all going to do whatever\nwe have to do to help you with this.\nOkay, that's not what I meant.","focus":"whatever / mean","notes":["<code>whatever we have to do</code>: 우리가 해야 하는 일이라면 무엇이든","<code>That's not what I meant.</code>: 내 뜻은 그게 아니야"],"chunks":["<code>We'll do whatever we have to do.</code> 필요한 일이라면 무엇이든 할게."],"translation":"이 이야기라고? 지금 농담해? Alex, 우리는 널 돕기 위해 필요한 일이라면 무엇이든 할 거야. 알겠어, 내 뜻은 그게 아니었어."},{"english":"-Jesus, why am I always the bad guy?\n-Because you're so fucking good at it.\nJulian didn't mean that.\nHe's just been having\na really hard time lately.","focus":"bad guy / be good at","notes":["<code>the bad guy</code>: 나쁜 역할을 맡는 사람","<code>be good at</code>: ...을 잘하다","<code>have a hard time</code>: 힘든 시간을 보내다"],"chunks":["<code>Why am I always the bad guy?</code> 왜 항상 내가 나쁜 사람이야?"],"translation":"젠장, 왜 항상 내가 나쁜 사람이야? 그 역할을 지독하게 잘하니까. Julian도 그런 뜻은 아니었어. 요즘 정말 힘든 시간을 보내고 있어."},{"english":"With what?\nRaising two wonderful children?\nBeing married to the perfect woman\nwho took the perfect job\nthat I was apparently unfit to handle?","focus":"be unfit to / relative clauses","notes":["<code>be unfit to + 동사</code>: ...하기에 적합하지 않다","<code>apparently</code>: 보아하니, 듣자 하니"],"chunks":[],"translation":"뭐가 힘든데? 훌륭한 아이 둘을 키우는 것? 내가 맡기에 부적합했던 완벽한 직업을 가져간 완벽한 여자와 결혼한 것?"},{"english":"A hard time that his mother died.\nYou're not the only one missing her.","focus":"have a hard time / the only one","notes":["<code>have a hard time that ...</code>: ...한 일로 힘들어하다","<code>the only one + -ing</code>: ...하는 유일한 사람"],"chunks":["<code>You're not the only one missing her.</code> 엄마를 그리워하는 사람은 너뿐이 아니야."],"translation":"엄마가 돌아가셔서 힘든 거야. 엄마를 그리워하는 사람은 너뿐이 아니야."}];

    const escapeHtml = (value) => value

      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;

      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {

          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0

      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 4 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
