<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 3 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>

  <script>
    const items = [{"english":"This is crazy.\n\"Go all out in a mosh pit.\"\n\"Play one-on-one with a New York Knick.\"\n\"Do stand-up comedy.\"","focus":"go all out / one-on-one","notes":["<code>go all out</code>: 전력을 다하다, 마음껏 하다","<code>mosh pit</code>: 록 공연장에서 격하게 춤추는 공간","<code>one-on-one</code>: 일대일로"],"chunks":["<code>Go all out.</code> 제대로 한번 해봐."],"translation":"이건 미쳤어. “모시 피트에서 온 힘을 다해 놀기.” “뉴욕 닉스 선수와 일대일 농구하기.” “스탠드업 코미디 하기.”"},{"english":"Walk me through that.\nLucas and I once swore that we would do\nopen mic night at the Comedy Cellar.\nAnd and I still have the jokes I wrote.","focus":"walk someone through / swear","notes":["<code>walk someone through</code>: 과정을 차근차근 설명해 주다","<code>swear that ...</code>: ...하겠다고 굳게 약속하다","<code>open mic night</code>: 누구나 무대에 설 수 있는 공개 공연"],"chunks":["<code>Walk me through that.</code> 그게 어떻게 된 건지 자세히 말해 봐."],"translation":"그 얘기 좀 자세히 해봐. Lucas와 나는 예전에 Comedy Cellar의 오픈 마이크 무대에 서겠다고 맹세했어. 그리고 그때 쓴 농담도 아직 가지고 있어."},{"english":"-I gonna need to read those.\n-\"Make peace with Dad.\"\n\"Be a great teacher.\" You can do these.\n-Mm-hmm.\n-You should do these.","focus":"need to / make peace with","notes":["<code>make peace with + 사람</code>: 그 사람과 화해하다","<code>You should + 동사</code>: ...하는 게 좋겠어"],"chunks":["<code>You can do these.</code> 이것들은 할 수 있어."],"translation":"그 농담들은 읽어봐야겠네. “아빠와 화해하기.” “훌륭한 선생님 되기.” 이건 할 수 있잖아. 응. 꼭 해봐."},{"english":"Why? So I can inherit some money?\n-Yeah.\n-No, it's just gross.","focus":"so / inherit / gross","notes":["<code>inherit</code>: 상속받다","<code>gross</code>: 역겨운, 불쾌한"],"chunks":["<code>So I can ...?</code> 내가 ...할 수 있게 하려고?"],"translation":"왜? 돈을 좀 상속받으라고? 그래. 싫어, 그냥 너무 불쾌해."},{"english":"Besides, I swore that I would never\nstep foot into a classroom ever again.","focus":"besides / step foot into","notes":["<code>Besides</code>: 게다가, 그뿐만 아니라","<code>step foot into + 장소</code>: ...에 발을 들이다"],"chunks":["<code>I swore I would never ... again.</code> 다시는 ...하지 않겠다고 맹세했어."],"translation":"게다가 나는 다시는 교실에 발을 들이지 않겠다고 맹세했어."},{"english":"Oh my God, who cares?\nTemp for a couple of weeks.\nRoll out one of those rickety TVs,\npop on Land Before Time, and then voil.","focus":"who cares / temp / pop on","notes":["<code>Who cares?</code>: 그게 무슨 상관이야?","<code>temp</code>: 임시로 일하다","<code>rickety</code>: 낡아서 금방이라도 부서질 듯한","<code>pop on</code>: 영상이나 음악을 가볍게 틀다"],"chunks":["<code>for a couple of weeks</code> 몇 주 동안"],"translation":"세상에, 그게 무슨 상관이야? 몇 주만 임시 교사를 해. 낡은 TV 하나 끌고 와서 「공룡시대」를 틀면, 짜잔."},{"english":"Or maybe you enjoy teaching again.\nIsn't that the idea here?\nNot my idea.","focus":"maybe / idea","notes":["<code>maybe + 문장</code>: 어쩌면 ...일지도 모른다","<code>Isn't that the idea?</code>: 원래 취지가 그거 아니야?"],"chunks":["<code>Not my idea.</code> 내 생각은 아니야."],"translation":"아니면 다시 가르치는 일을 좋아하게 될지도 모르지. 원래 취지가 그거 아니야? 내 생각은 아니야."},{"english":"Alex. I've known you for a long time.\nYou'd never enjoy running that company,\nno matter what you tell yourself.","focus":"present perfect / no matter what","notes":["<code>I've known you for ...</code>: ...동안 계속 너를 알아왔다","<code>no matter what</code>: 무엇을 ...하든 상관없이"],"chunks":["<code>No matter what you tell yourself</code> 네가 스스로에게 뭐라고 말하든"],"translation":"Alex, 난 너를 오래 알았어. 네가 스스로에게 뭐라고 말하든, 그 회사를 운영하는 걸 절대 좋아하지 못할 거야."},{"english":"Love when you guys get real.\nHmm, \"Find true love.\"\nYou love Finn, right?\nHe's so sweet, so fun.\nApparently has a ginormous willy.","focus":"get real / apparently","notes":["<code>get real</code>: 솔직해지다, 현실적으로 말하다","<code>apparently</code>: 듣자 하니, 보아하니","<code>ginormous</code>: 엄청나게 큰"],"chunks":["<code>You love ..., right?</code> 너 ...를 사랑하지, 그렇지?"],"translation":"너희가 이렇게 솔직해질 때 정말 좋다니까. 흠, “진정한 사랑 찾기.” Finn을 사랑하지? 정말 다정하고 재미있잖아. 듣자 하니 엄청나게 크기도 하고."},{"english":"There's been three new iPhones\nsince you've been together.\nYou should know by now\nif you love the guy.","focus":"since / by now","notes":["<code>since + 과거 시점</code>: ...한 뒤로","<code>by now</code>: 지금쯤은"],"chunks":["<code>You should know by now if ...</code> 지금쯤 ...인지 알아야 해."],"translation":"너희가 만난 뒤로 아이폰이 세 번이나 새로 나왔어. 지금쯤은 그 남자를 사랑하는지 알아야지."},{"english":"Yeah, but living together was just\nsupposed to be like a temporary thing,\nand then Mom got sick, and it just seemed,\nyou know, easier not to find my own place.","focus":"be supposed to / seem","notes":["<code>be supposed to be</code>: ...일 예정이었다","<code>temporary thing</code>: 임시적인 일","<code>It seemed easier not to ...</code>: ...하지 않는 편이 더 쉬워 보였다"],"chunks":["<code>It was just supposed to be ...</code> 그건 그냥 ...일 예정이었어."],"translation":"그래, 하지만 같이 사는 건 원래 잠깐만 그러려던 거였어. 그러다 엄마가 아프셨고, 내 집을 따로 구하지 않는 게 더 쉬워 보였어."},{"english":"Which is exactly what she meant.\nYou're not dealing with shit.\nLike not telling Finn about the list?","focus":"exactly / deal with","notes":["<code>Which is exactly what ... meant.</code>: 바로 그게 ...가 뜻한 바다","<code>deal with</code>: 문제를 마주하고 처리하다"],"chunks":["<code>You're not dealing with ...</code> 넌 ...을 제대로 마주하지 않고 있어."],"translation":"그게 바로 엄마가 말한 거야. 넌 아무 문제도 제대로 마주하지 않고 있잖아. Finn에게 리스트 얘기를 안 한 것처럼?"},{"english":"Do you remember when Lucas and I broke up\nbefore we got engaged?\nThe whole world remembers.\nDidn't Anderson Cooper do a special?\nHilarious.","focus":"remember when / break up","notes":["<code>break up</code>: 헤어지다","<code>get engaged</code>: 약혼하다","<code>do a special</code>: 특집 방송을 하다"],"chunks":["<code>Do you remember when ...?</code> ...했을 때 기억나?"],"translation":"Lucas와 내가 약혼 전에 헤어졌던 거 기억나? 온 세상이 기억하지. Anderson Cooper가 특집 방송도 하지 않았나? 정말 웃기네."},{"english":"I asked your mom for advice,\nand she told me about her true love test.\nRemember that?\nVaguely.","focus":"ask for advice / vaguely","notes":["<code>ask someone for advice</code>: 누구에게 조언을 구하다","<code>vaguely</code>: 어렴풋이"],"chunks":["<code>Remember that?</code> 그거 기억나?"],"translation":"네 엄마에게 조언을 구했더니 진정한 사랑 테스트를 알려주셨어. 기억나? 어렴풋이."},{"english":"There's four questions\nyou're supposed to ask yourself?\nOr is that Passover?\nYes, four questions.","focus":"be supposed to / ask yourself","notes":["<code>ask yourself</code>: 스스로에게 묻다","<code>Passover</code>: 유월절"],"chunks":["<code>There's ... you're supposed to ...</code> 네가 ...해야 할 ...가 있어."],"translation":"스스로에게 물어봐야 하는 질문이 네 개였지? 아니면 그건 유월절인가? 맞아, 네 가지 질문."},{"english":"One, can you tell him\neverything in your heart?\nTwo, is he kind?\nThree, does he help you\nbecome the best version of yourself?","focus":"tell someone / help someone","notes":["<code>tell + 사람 + 내용</code>: 사람에게 내용을 말하다","<code>help + 사람 + 동사원형</code>: 사람이 ...하도록 돕다","<code>the best version of yourself</code>: 가장 좋은 모습의 자신"],"chunks":["<code>Can you tell him everything ...?</code> 그에게 모든 것을 말할 수 있어?"],"translation":"첫째, 마음속 모든 것을 그에게 말할 수 있는가? 둘째, 그는 친절한가? 셋째, 그가 네가 최고의 모습이 되도록 돕는가?"},{"english":"Meaning?\nAlex in full flight with Finn.\nFour, can you imagine him\nas the father of your children?","focus":"meaning / imagine A as B","notes":["<code>in full flight</code>: 능력을 마음껏 펼치는 상태","<code>imagine A as B</code>: A를 B로 상상하다"],"chunks":["<code>Meaning?</code> 무슨 뜻이야?"],"translation":"무슨 뜻이야? Finn과 함께 있을 때 자신의 능력을 마음껏 펼치는 Alex 말이야. 넷째, 그를 네 아이들의 아버지로 상상할 수 있는가?"},{"english":"Elizabeth said to ask myself\nthose questions,\nand if Lucas passed, I was on my way.","focus":"tell someone to / pass","notes":["<code>say to + 동사</code>: ...하라고 말하다","<code>pass a test</code>: 시험을 통과하다","<code>be on one's way</code>: 목표를 향해 나아가고 있다"],"chunks":["<code>If ... passed, ...</code> ...가 통과하면 ..."],"translation":"Elizabeth는 그 질문들을 스스로에게 해보라고 했고, Lucas가 통과하면 나는 제대로 가고 있는 거라고 했어."},{"english":"This is totally crazy. I know.\nBut I trust your mom.\nBesides, what have you got to lose?","focus":"trust / have got to lose","notes":["<code>trust + 사람</code>: 사람을 믿다","<code>What have you got to lose?</code>: 잃을 게 뭐가 있어?"],"chunks":["<code>What have you got to lose?</code> 밑져야 본전이잖아."],"translation":"이건 완전히 미친 짓이야. 알아. 하지만 난 네 엄마를 믿어. 게다가 네가 잃을 게 뭐가 있어?"},{"english":"Is Finn kind?\nAbsolutely.\nDoes he help me\nbecome the best version of myself?\nCan I tell him everything in my heart?\nI can barely tell myself.","focus":"absolutely / barely","notes":["<code>Absolutely.</code>: 물론이지, 확실히","<code>barely</code>: 거의 ...하지 못하다"],"chunks":["<code>I can barely ...</code> 나는 거의 ...조차 못해."],"translation":"Finn은 친절한가? 물론이지. 그가 내가 최고의 모습이 되도록 돕는가? 마음속 모든 것을 그에게 말할 수 있는가? 나 자신에게도 거의 말하지 못하는데."},{"english":"Can I imagine him being\nthe father of our children?\nWhat the hell are you doing?\n-Oh, hey, babe.\n-Hi.","focus":"imagine someone -ing / what the hell","notes":["<code>imagine + 사람 + -ing</code>: 사람이 ...하는 모습을 상상하다","<code>What the hell ...?</code>: 도대체 ...하는 거야?"],"chunks":["<code>Can I imagine him being ...?</code> 그가 ...인 모습을 상상할 수 있을까?"],"translation":"그가 우리 아이들의 아버지가 되는 모습을 상상할 수 있을까? 도대체 뭐 하는 거야? 아, 안녕 자기야. 안녕."},{"english":"I'm just, uh\ndoing the stoner test of my game.\nThe what?\nThe stoner test?","focus":"the what / stoner","notes":["<code>stoner</code>: 대마초를 자주 피우는 사람","<code>The what?</code>: 뭐라고? 무슨 ...?"],"chunks":["<code>I'm just doing ...</code> 그냥 ...하고 있어."],"translation":"그냥 내 게임의 취한 사람 테스트를 하고 있어. 무슨 테스트? 취한 사람 테스트?"},{"english":"Kids like to play video games stoned,\nso you have to make sure\nit's still easy enough while you're high,\nbut still super challenging\nwhen you're not high.\nKnow what I mean?","focus":"make sure / enough / challenging","notes":["<code>make sure + 문장</code>: 반드시 ...인지 확인하다","<code>형용사 + enough</code>: 충분히 ...한","<code>challenging</code>: 도전적인, 어려운"],"chunks":["<code>Know what I mean?</code> 무슨 말인지 알지?"],"translation":"애들은 취한 채로 비디오 게임 하는 걸 좋아하니까, 취했을 때도 충분히 쉽지만 안 취했을 때는 여전히 아주 어렵게 만들어야 해. 무슨 말인지 알지?"},{"english":"I need to talk to you about something.\nLike, now?\nYeah.","focus":"need to talk / like now","notes":["<code>talk to someone about something</code>: 누구와 어떤 일에 관해 이야기하다","<code>Like, now?</code>: 그러니까, 지금?"],"chunks":["<code>I need to talk to you about ...</code> 너와 ...에 대해 이야기해야 해."],"translation":"너와 할 얘기가 있어. 지금 말이야? 응."},{"eng 역시 내가 실수로 당신을 초대한 데는 이유가 있었네요."},{"english":"Hi, Bean.\nI would've given anything\nto have seen you on that stage.\nScared shitless, I bet.\nYeah.\nBut alive, am I right?","focus":"would have given anything / scared shitless","notes":["<code>would have given anything to ...</code>: ...하기 위해서라면 무엇이든 했을 것이다","<code>scared shitless</code>: 죽도록 겁먹은; 매우 거친 표현","<code>I bet.</code>: 분명 그랬겠지"],"chunks":["<code>Am I right?</code> 내 말이 맞지?"],"translation":"안녕, Bean. 네가 그 무대에 선 모습을 볼 수 있었다면 무엇이든 줬을 거야. 죽도록 무서웠겠지. 그래. 하지만 살아 있다는 느낌이 들었지, 맞지?"},{"english":"You were such a a fearless kid.\nWhat do you think happened to that?\nI don't know what happened.\nLife.","focus":"fearless / happen to","notes":["<code>fearless</code>: 두려움이 없는","<code>What happened to ...?</code>: ...은 어떻게 된 거야?"],"chunks":["<code>What do you think happened to ...?</code> ...이 어떻게 됐다고 생각해?"],"translation":"너는 정말 겁 없는 아이였어. 그 모습에 무슨 일이 생긴 걸까? 무슨 일이 있었는지 모르겠어. 인생이지."},{"english":"I think you suffered some real setbacks.\nAnd I get it.\nBut I watched you gradually start to\nsettle for what was safe and less painful.","focus":"setback / settle for","notes":["<code>suffer a setback</code>: 좌절이나 차질을 겪다","<code>gradually</code>: 점차","<code>settle for</code>: 만족스럽지 않아도 ...에 안주하다"],"chunks":["<code>I get it.</code> 이해해."],"translation":"네가 정말 큰 좌절을 겪었다고 생각해. 이해해. 하지만 네가 점차 안전하고 덜 아픈 것에 안주하기 시작하는 걸 지켜봤어."},{"english":"But, honey, settling is never gonna make\nthe fear and the pain go away.\nAnd I can tell you that from experience.","focus":"make something go away / from experience","notes":["<code>make + 목적어 + 동사원형</code>: 목적어가 ...하게 만들다","<code>go away</code>: 사라지다","<code>from experience</code>: 경험으로 미루어"],"chunks":["<code>I can tell you that from experience.</code> 그건 내 경험으로 확실히 말할 수 있어."],"translation":"하지만 얘야, 안주한다고 두려움과 고통이 사라지지는 않아. 그건 내 경험으로 확실히 말할 수 있어."},{"english":"So I want you to try something for me.\nFor the next week, I want you to do\nsomething every day that scares you.\nOne thing that makes you feel nauseous\nin the pit of your stomach.","focus":"want someone to / make someone feel","notes":["<code>for the next week</code>: 앞으로 일주일 동안","<code>make + 사람 + feel</code>: 사람이 ...을 느끼게 하다","<code>nauseous</code>: 메스꺼운"],"chunks":["<code>Do something that scares you.</code> 너를 두렵게 하는 일을 해봐."],"translation":"그래서 날 위해 무언가를 해봤으면 해. 앞으로 일주일 동안 매일 너를 두렵게 하는 일을 하나씩 해. 속 깊은 곳이 메스꺼워질 정도의 일 하나."},{"english":"That's how I felt after your dad left\nand I started my business.\nTerrifying.\nBut life-changing.\n-Got it?\n-Got it.\nI will see you on the next one.\nOver and out.","focus":"how I felt / life-changing","notes":["<code>That's how I felt</code>: 그게 내가 느낀 방식이다","<code>terrifying</code>: 끔찍하게 무서운","<code>life-changing</code>: 인생을 바꾸는","<code>Over and out.</code>: 교신 끝, 이상"],"chunks":["<code>Got it?</code> 알겠지?"],"translation":"네 아빠가 떠나고 내가 사업을 시작했을 때 바로 그렇게 느꼈어. 끔찍하게 무서웠지만 인생을 바꿨지. 알겠어? 알겠어. 다음 영상에서 보자. 이상, 끝."},{"english":"You know what, I don't know if I can\nhandle doing something scary every day\non top of everything else.","focus":"handle -ing / on top of","notes":["<code>handle + -ing</code>: ...하는 일을 감당하다","<code>on top of + 명사</code>: ...에 더하여"],"chunks":["<code>I don't know if I can handle ...</code> 내가 ...을 감당할 수 있을지 모르겠어요."],"translation":"있잖아요, 다른 모든 일에 더해 매일 무서운 일을 하는 것까지 감당할 수 있을지 모르겠어요."},{"english":"I could maybe do it twice a week\nif I got some Xanax from my assistant.\nWhat would you do first?","focus":"could / twice a week","notes":["<code>twice a week</code>: 일주일에 두 번","<code>What would you do first?</code>: 무엇을 먼저 하겠어요?"],"chunks":[],"translation":"비서에게 Xanax를 좀 받는다면 일주일에 두 번 정도는 할 수 있을지도 몰라요. 뭘 먼저 하겠어요?"},{"english":"That's easy. I would go straight\ninto old man Sullivan's office\n-and ask why I'm not a full partner yet.\n-Mm.","focus":"go straight into / yet","notes":["<code>go straight into</code>: 곧장 ...으로 들어가다","<code>full partner</code>: 정식 파트너","<code>yet</code>: 아직"],"chunks":["<code>ask why I'm not ... yet</code> 왜 내가 아직 ...이 아닌지 묻다"],"translation":"그건 쉬워요. Sullivan 영감의 사무실로 곧장 들어가 왜 아직 정식 파트너가 아닌지 묻겠어요."},{"english":"It's crazy. Every time I tell myself\nI'm gonna do it, I literally feel sick.\nIt's ridiculous. I'm a grown man.\nWith ketchup on his tie?\nWho once had ketchup on his tie.","focus":"every time / literally / grown man","notes":["<code>every time</code>: ...할 때마다","<code>literally</code>: 말 그대로","<code>grown man</code>: 다 큰 성인 남자"],"chunks":["<code>Every time I tell myself ...</code> 스스로 ...하겠다고 말할 때마다"],"translation":"미친 일이죠. 하겠다고 마음먹을 때마다 정말로 속이 안 좋아져요. 말도 안 돼요. 난 다 큰 남자인데. 넥타이에 케첩 묻힌 남자요? 한 번 케첩을 묻힌 적 있는 남자죠."},{"english":"Who's too afraid to ask\nfor what I know I deserve.\nOkay, so go into Sullivan's office\ntomorrow and ask for what's yours.","focus":"too ... to / deserve","notes":["<code>too + 형용사 + to</code>: 너무 ...해서 ...하지 못하다","<code>deserve</code>: 받을 자격이 있다","<code>what's yours</code>: 네 몫, 네가 받아야 할 것"],"chunks":["<code>Ask for what you deserve.</code> 네가 받을 자격이 있는 것을 요구해."],"translation":"자기가 받을 자격이 있다고 아는 것조차 요구하기 무서워하는 남자요. 좋아요. 그럼 내일 Sullivan의 사무실로 가서 당신 몫을 요구해요."},{"english":"I mean, who cares if he's the scariest,\nwrinkliest old dude in New York, right?\nYeah. Yeah, right.\n-Yeah, I'll do that tomorrow.\n-Mm.\nOr maybe the next day.","focus":"who cares if / superlative","notes":["<code>Who cares if ...?</code>: ...이면 또 어때?","<code>wrinkliest</code>: 가장 주름이 많은","<code>the next day</code>: 그다음 날"],"chunks":["<code>I'll do that tomorrow.</code> 내일 그걸 할게요."],"translation":"New York에서 가장 무섭고 주름 많은 노인이면 또 어때요, 그렇죠? 그래요, 맞아요. 내일 할게요. 아니면 그다음 날일지도."},{"english":"What about you?\nWell, that's a no-brainer.\nMake peace with my dad.\nWe just never really connected.","focus":"what about / no-brainer / connect","notes":["<code>no-brainer</code>: 고민할 필요도 없이 쉬운 선택","<code>connect with + 사람</code>: 사람과 정서적으로 통하다"],"chunks":["<code>What about you?</code> 당신은요?"],"translation":"당신은요? 그건 생각할 것도 없어요. 아빠와 화해하기. 우리는 한 번도 진정으로 통하지 못했어요."},{"english":"And because my brothers\nare so damn perfect,\nhe always acts like I'm the screw-up.\nBut you're not a screw-up.\nReally?","focus":"act like / screw-up","notes":["<code>act like + 문장</code>: 마치 ...인 것처럼 행동하다","<code>screw-up</code>: 늘 일을 망치는 사람","<code>damn</code>: 강조를 더하는 거친 표현"],"chunks":["<code>He acts like I'm ...</code> 그는 나를 ...인 것처럼 대해요."],"translation":"형제들이 너무나 완벽해서 아빠는 늘 내가 문제아인 것처럼 대해요. 하지만 당신은 문제아가 아니에요. 정말요?"},{"english":"Then how come I can't get through\na single chapter of Moby Dick\nwithout falling asleep?\nAnd I still don't have one job interview.","focus":"how come / without -ing","notes":["<code>How come + 문장?</code>: 왜 ...한 거야?","<code>get through</code>: 끝까지 해내다, 읽어내다","<code>without + -ing</code>: ...하지 않고"],"chunks":["<code>How come I can't ...?</code> 나는 왜 ...하지 못할까요?"],"translation":"그럼 나는 왜 잠들지 않고 「Moby Dick」 한 장도 끝까지 읽지 못하죠? 아직 면접 제안도 하나 없고요."},{"english":"Oh, that reminds me.\nI do pro bono work for a women's shelter\non the Lower East Side.\nThey have a classroom--","focus":"remind / pro bono","notes":["<code>That reminds me.</code>: 그 말을 들으니 생각났어요","<code>pro bono work</code>: 무료 공익 활동","<code>women's shelter</code>: 여성 보호소"],"chunks":["<code>That reminds me of ...</code> 그 말을 들으니 ...이 생각나요."],"translation":"아, 그 말을 들으니 생각났어요. 저는 Lower East Side의 여성 보호소에서 무료 법률 활동을 해요. 거기에 교실이 있는데..."},{"english":"I'm sorry, you do free work\nfor a women's shelter?\nUh, yeah.\nSo modest, Bradley.","focus":"free work / modest","notes":["<code>free work</code>: 무료로 하는 일","<code>modest</code>: 겸손한"],"chunks":["<code>You do ...?</code> 당신이 ...한다고요?"],"translation":"잠깐, 여성 보호소를 위해 무료로 일한다고요? 네. 참 겸손하시네요, Bradley."},{"english":"The point is they have a classroom\nfor the high school kids that live there,\nand they need a teacher\nto finish out the rest of the semester.\nAny interest?","focus":"the point is / finish out","notes":["<code>The point is ...</code>: 요점은 ...이다","<code>finish out</code>: 남은 기간을 마무리하다","<code>the rest of</code>: 나머지"],"chunks":["<code>Any interest?</code> 관심 있어요?"],"translation":"요점은 그곳에 사는 고등학생들을 위한 교실이 있고, 남은 학기를 마무리해 줄 교사가 필요하다는 거예요. 관심 있어요?"},{"english":"Maybe.\nYeah.\nWhy are you being so nice to me?\nDo you get, like, a bonus\nif I actually get my inheritance?","focus":"be being / bonus","notes":["<code>Why are you being ...?</code>: 왜 지금 ...하게 구는 거예요?","<code>bonus</code>: 보너스, 성과급","<code>actually</code>: 실제로"],"chunks":["<code>Do you get a bonus if ...?</code> ...하면 보너스를 받아요?"],"translation":"아마도요. 네. 왜 이렇게 잘해줘요? 내가 실제로 유산을 받으면 보너스라도 받아요?"},{"english":"Wow. Okay, now you've hurt my feelings.\nI don't know why.\nActually, I just feel like\nyou'd be a good fit.","focus":"hurt feelings / good fit","notes":["<code>hurt someone's feelings</code>: 사람의 감정을 상하게 하다","<code>a good fit</code>: 잘 맞는 사람이나 선택"],"chunks":["<code>You'd be a good fit.</code> 당신이 잘 맞을 것 같아요."],"translation":"와, 이제 제 마음이 상했네요. 왜인지는 모르겠지만요. 사실 그냥 당신이 그 일에 잘 맞을 것 같아요."}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 3:</strong> 21:26~35:40 까지 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      const body = rows
        ? '<section class="grid" aria-label="Sentence study table">' + rows + '</section>'
        : '<section class="empty">Section 3 대사 원문을 보내주면, Section 1과 같은 형식으로 번호, 해석, 문법, 활용 표현을 정리합니다.</section>';
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 3 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
</body>

<!doctype html>

  <meta charset="utf-8">

  <title>The Life List - Section 3 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }

    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"This is crazy.\n\"Go all out in a mosh pit.\"\n\"Play one-on-one with a New York Knick.\"\n\"Do stand-up comedy.\"","focus":"go all out / one-on-one","notes":["<code>go all out</code>: 전력을 다하다, 마음껏 하다","<code>mosh pit</code>: 록 공연장에서 격하게 춤추는 공간","<code>one-on-one</code>: 일대일로"],"chunks":["<code>Go all out.</code> 제대로 한번 해봐."],"translation":"이건 미쳤어. “모시 피트에서 온 힘을 다해 놀기.” “뉴욕 닉스 선수와 일대일 농구하기.” “스탠드업 코미디 하기.”"},{"english":"Walk me through that.\nLucas and I once swore that we would do\nopen mic night at the Comedy Cellar.\nAnd and I still have the jokes I wrote.","focus":"walk someone through / swear","notes":["<code>walk someone through</code>: 과정을 차근차근 설명해 주다","<code>swear that ...</code>: ...하겠다고 굳게 약속하다","<code>open mic night</code>: 누구나 무대에 설 수 있는 공개 공연"],"chunks":["<code>Walk me through that.</code> 그게 어떻게 된 건지 자세히 말해 봐."],"translation":"그 얘기 좀 자세히 해봐. Lucas와 나는 예전에 Comedy Cellar의 오픈 마이크 무대에 서겠다고 맹세했어. 그리고 그때 쓴 농담도 아직 가지고 있어."},{"english":"-I gonna need to read those.\n-\"Make peace with Dad.\"\n\"Be a great teacher.\" You can do these.\n-Mm-hmm.\n-You should do these.","focus":"need to / make peace with","notes":["<code>make peace with + 사람</code>: 그 사람과 화해하다","<code>You should + 동사</code>: ...하는 게 좋겠어"],"chunks":["<code>You can do these.</code> 이것들은 할 수 있어."],"translation":"그 농담들은 읽어봐야겠네. “아빠와 화해하기.” “훌륭한 선생님 되기.” 이건 할 수 있잖아. 응. 꼭 해봐."},{"english":"Why? So I can inherit some money?\n-Yeah.\n-No, it's just gross.","focus":"so / inherit / gross","notes":["<code>inherit</code>: 상속받다","<code>gross</code>: 역겨운, 불쾌한"],"chunks":["<code>So I can ...?</code> 내가 ...할 수 있게 하려고?"],"translation":"왜? 돈을 좀 상속받으라고? 그래. 싫어, 그냥 너무 불쾌해."},{"english":"Besides, I swore that I would never\nstep foot into a classroom ever again.","focus":"besides / step foot into","notes":["<code>Besides</code>: 게다가, 그뿐만 아니라","<code>step foot into + 장소</code>: ...에 발을 들이다"],"chunks":["<code>I swore I would never ... again.</code> 다시는 ...하지 않겠다고 맹세했어."],"translation":"게다가 나는 다시는 교실에 발을 들이지 않겠다고 맹세했어."},{"english":"Oh my God, who cares?\nTemp for a couple of weeks.\nRoll out one of those rickety TVs,\npop on Land Before Time, and then voil.","focus":"who cares / temp / pop on","notes":["<code>Who cares?</code>: 그게 무슨 상관이야?","<code>temp</code>: 임시로 일하다","<code>rickety</code>: 낡아서 금방이라도 부서질 듯한","<code>pop on</code>: 영상이나 음악을 가볍게 틀다"],"chunks":["<code>for a couple of weeks</code> 몇 주 동안"],"translation":"세상에, 그게 무슨 상관이야? 몇 주만 임시 교사를 해. 낡은 TV 하나 끌고 와서 「공룡시대」를 틀면, 짜잔."},{"english":"Or maybe you enjoy teaching again.\nIsn't that the idea here?\nNot my idea.","focus":"maybe / idea","notes":["<code>maybe + 문장</code>: 어쩌면 ...일지도 모른다","<code>Isn't that the idea?</code>: 원래 취지가 그거 아니야?"],"chunks":["<code>Not my idea.</code> 내 생각은 아니야."],"translation":"아니면 다시 가르치는 일을 좋아하게 될지도 모르지. 원래 취지가 그거 아니야? 내 생각은 아니야."},{"english":"Alex. I've known you for a long time.\nYou'd never enjoy running that company,\nno matter what you tell yourself.","focus":"present perfect / no matter what","notes":["<code>I've known you for ...</code>: ...동안 계속 너를 알아왔다","<code>no matter what</code>: 무엇을 ...하든 상관없이"],"chunks":["<code>No matter what you tell yourself</code> 네가 스스로에게 뭐라고 말하든"],"translation":"Alex, 난 너를 오래 알았어. 네가 스스로에게 뭐라고 말하든, 그 회사를 운영하는 걸 절대 좋아하지 못할 거야."},{"english":"Love when you guys get real.\nHmm, \"Find true love.\"\nYou love Finn, right?\nHe's so sweet, so fun.\nApparently has a ginormous willy.","focus":"get real / apparently","notes":["<code>get real</code>: 솔직해지다, 현실적으로 말하다","<code>apparently</code>: 듣자 하니, 보아하니","<code>ginormous</code>: 엄청나게 큰"],"chunks":["<code>You love ..., right?</code> 너 ...를 사랑하지, 그렇지?"],"translation":"너희가 이렇게 솔직해질 때 정말 좋다니까. 흠, “진정한 사랑 찾기.” Finn을 사랑하지? 정말 다정하고 재미있잖아. 듣자 하니 엄청나게 크기도 하고."},{"english":"There's been three new iPhones\nsince you've been together.\nYou should know by now\nif you love the guy.","focus":"since / by now","notes":["<code>since + 과거 시점</code>: ...한 뒤로","<code>by now</code>: 지금쯤은"],"chunks":["<code>You should know by now if ...</code> 지금쯤 ...인지 알아야 해."],"translation":"너희가 만난 뒤로 아이폰이 세 번이나 새로 나왔어. 지금쯤은 그 남자를 사랑하는지 알아야지."},{"english":"Yeah, but living together was just\nsupposed to be like a temporary thing,\nand then Mom got sick, and it just seemed,\nyou know, easier not to find my own place.","focus":"be supposed to / seem","notes":["<code>be supposed to be</code>: ...일 예정이었다","<code>temporary thing</code>: 임시적인 일","<code>It seemed easier not to ...</code>: ...하지 않는 편이 더 쉬워 보였다"],"chunks":["<code>It was just supposed to be ...</code> 그건 그냥 ...일 예정이었어."],"translation":"그래, 하지만 같이 사는 건 원래 잠깐만 그러려던 거였어. 그러다 엄마가 아프셨고, 내 집을 따로 구하지 않는 게 더 쉬워 보였어."},{"english":"Which is exactly what she meant.\nYou're not dealing with shit.\nLike not telling Finn about the list?","focus":"exactly / deal with","notes":["<code>Which is exactly what ... meant.</code>: 바로 그게 ...가 뜻한 바다","<code>deal with</code>: 문제를 마주하고 처리하다"],"chunks":["<code>You're not dealing with ...</code> 넌 ...을 제대로 마주하지 않고 있어."],"translation":"그게 바로 엄마가 말한 거야. 넌 아무 문제도 제대로 마주하지 않고 있잖아. Finn에게 리스트 얘기를 안 한 것처럼?"},{"english":"Do you remember when Lucas and I broke up\nbefore we got engaged?\nThe whole world remembers.\nDidn't Anderson Cooper do a special?\nHilarious.","focus":"remember when / break up","notes":["<code>break up</code>: 헤어지다","<code>get engaged</code>: 약혼하다","<code>do a special</code>: 특집 방송을 하다"],"chunks":["<code>Do you remember when ...?</code> ...했을 때 기억나?"],"translation":"Lucas와 내가 약혼 전에 헤어졌던 거 기억나? 온 세상이 기억하지. Anderson Cooper가 특집 방송도 하지 않았나? 정말 웃기네."},{"english":"I asked your mom for advice,\nand she told me about her true love test.\nRemember that?\nVaguely.","focus":"ask for advice / vaguely","notes":["<code>ask someone for advice</code>: 누구에게 조언을 구하다","<code>vaguely</code>: 어렴풋이"],"chunks":["<code>Remember that?</code> 그거 기억나?"],"translation":"네 엄마에게 조언을 구했더니 진정한 사랑 테스트를 알려주셨어. 기억나? 어렴풋이."},{"english":"There's four questions\nyou're supposed to ask yourself?\nOr is that Passover?\nYes, four questions.","focus":"be supposed to / ask yourself","notes":["<code>ask yourself</code>: 스스로에게 묻다","<code>Passover</code>: 유월절"],"chunks":["<code>There's ... you're supposed to ...</code> 네가 ...해야 할 ...가 있어."],"translation":"스스로에게 물어봐야 하는 질문이 네 개였지? 아니면 그건 유월절인가? 맞아, 네 가지 질문."},{"english":"One, can you tell him\neverything in your heart?\nTwo, is he kind?\nThree, does he help you\nbecome the best version of yourself?","focus":"tell someone / help someone","notes":["<code>tell + 사람 + 내용</code>: 사람에게 내용을 말하다","<code>help + 사람 + 동사원형</code>: 사람이 ...하도록 돕다","<code>the best version of yourself</code>: 가장 좋은 모습의 자신"],"chunks":["<code>Can you tell him everything ...?</code> 그에게 모든 것을 말할 수 있어?"],"translation":"첫째, 마음속 모든 것을 그에게 말할 수 있는가? 둘째, 그는 친절한가? 셋째, 그가 네가 최고의 모습이 되도록 돕는가?"},{"english":"Meaning?\nAlex in full flight with Finn.\nFour, can you imagine him\nas the father of your children?","focus":"meaning / imagine A as B","notes":["<code>in full flight</code>: 능력을 마음껏 펼치는 상태","<code>imagine A as B</code>: A를 B로 상상하다"],"chunks":["<code>Meaning?</code> 무슨 뜻이야?"],"translation":"무슨 뜻이야? Finn과 함께 있을 때 자신의 능력을 마음껏 펼치는 Alex 말이야. 넷째, 그를 네 아이들의 아버지로 상상할 수 있는가?"},{"english":"Elizabeth said to ask myself\nthose questions,\nand if Lucas passed, I was on my way.","focus":"tell someone to / pass","notes":["<code>say to + 동사</code>: ...하라고 말하다","<code>pass a test</code>: 시험을 통과하다","<code>be on one's way</code>: 목표를 향해 나아가고 있다"],"chunks":["<code>If ... passed, ...</code> ...가 통과하면 ..."],"translation":"Elizabeth는 그 질문들을 스스로에게 해보라고 했고, Lucas가 통과하면 나는 제대로 가고 있는 거라고 했어."},{"english":"This is totally crazy. I know.\nBut I trust your mom.\nBesides, what have you got to lose?","focus":"trust / have got to lose","notes":["<code>trust + 사람</code>: 사람을 믿다","<code>What have you got to lose?</code>: 잃을 게 뭐가 있어?"],"chunks":["<code>What have you got to lose?</code> 밑져야 본전이잖아."],"translation":"이건 완전히 미친 짓이야. 알아. 하지만 난 네 엄마를 믿어. 게다가 네가 잃을 게 뭐가 있어?"},{"english":"Is Finn kind?\nAbsolutely.\nDoes he help me\nbecome the best version of myself?\nCan I tell him everything in my heart?\nI can barely tell myself.","focus":"absolutely / barely","notes":["<code>Absolutely.</code>: 물론이지, 확실히","<code>barely</code>: 거의 ...하지 못하다"],"chunks":["<code>I can barely ...</code> 나는 거의 ...조차 못해."],"translation":"Finn은 친절한가? 물론이지. 그가 내가 최고의 모습이 되도록 돕는가? 마음속 모든 것을 그에게 말할 수 있는가? 나 자신에게도 거의 말하지 못하는데."},{"english":"Can I imagine him being\nthe father of our children?\nWhat the hell are you doing?\n-Oh, hey, babe.\n-Hi.","focus":"imagine someone -ing / what the hell","notes":["<code>imagine + 사람 + -ing</code>: 사람이 ...하는 모습을 상상하다","<code>What the hell ...?</code>: 도대체 ...하는 거야?"],"chunks":["<code>Can I imagine him being ...?</code> 그가 ...인 모습을 상상할 수 있을까?"],"translation":"그가 우리 아이들의 아버지가 되는 모습을 상상할 수 있을까? 도대체 뭐 하는 거야? 아, 안녕 자기야. 안녕."},{"english":"I'm just, uh\ndoing the stoner test of my game.\nThe what?\nThe stoner test?","focus":"the what / stoner","notes":["<code>stoner</code>: 대마초를 자주 피우는 사람","<code>The what?</code>: 뭐라고? 무슨 ...?"],"chunks":["<code>I'm just doing ...</code> 그냥 ...하고 있어."],"translation":"그냥 내 게임의 취한 사람 테스트를 하고 있어. 무슨 테스트? 취한 사람 테스트?"},{"english":"Kids like to play video games stoned,\nso you have to make sure\nit's still easy enough while you're high,\nbut still super challenging\nwhen you're not high.\nKnow what I mean?","focus":"make sure / enough / challenging","notes":["<code>make sure + 문장</code>: 반드시 ...인지 확인하다","<code>형용사 + enough</code>: 충분히 ...한","<code>challenging</code>: 도전적인, 어려운"],"chunks":["<code>Know what I mean?</code> 무슨 말인지 알지?"],"translation":"애들은 취한 채로 비디오 게임 하는 걸 좋아하니까, 취했을 때도 충분히 쉽지만 안 취했을 때는 여전히 아주 어렵게 만들어야 해. 무슨 말인지 알지?"},{"english":"I need to talk to you about something.\nLike, now?\nYeah.","focus":"need to talk / like now","notes":["<code>talk to someone about something</code>: 누구와 어떤 일에 관해 이야기하다","<code>Like, now?</code>: 그러니까, 지금?"],"chunks":["<code>I need to talk to you about ...</code> 너와 ...에 대해 이야기해야 해."],"translation":"너와 할 얘기가 있어. 지금 말이야? 응."},{"eng slation":"그건 쉬워요. Sullivan 영감의 사무실로 곧장 들어가 왜 아직 정식 파트너가 아닌지 묻겠어요."},{"english":"It's crazy. Every time I tell myself\nI'm gonna do it, I literally feel sick.\nIt's ridiculous. I'm a grown man.\nWith ketchup on his tie?\nWho once had ketchup on his tie.","focus":"every time / literally / grown man","notes":["<code>every time</code>: ...할 때마다","<code>literally</code>: 말 그대로","<code>grown man</code>: 다 큰 성인 남자"],"chunks":["<code>Every time I tell myself ...</code> 스스로 ...하겠다고 말할 때마다"],"translation":"미친 일이죠. 하겠다고 마음먹을 때마다 정말로 속이 안 좋아져요. 말도 안 돼요. 난 다 큰 남자인데. 넥타이에 케첩 묻힌 남자요? 한 번 케첩을 묻힌 적 있는 남자죠."},{"english":"Who's too afraid to ask\nfor what I know I deserve.\nOkay, so go into Sullivan's office\ntomorrow and ask for what's yours.","focus":"too ... to / deserve","notes":["<code>too + 형용사 + to</code>: 너무 ...해서 ...하지 못하다","<code>deserve</code>: 받을 자격이 있다","<code>what's yours</code>: 네 몫, 네가 받아야 할 것"],"chunks":["<code>Ask for what you deserve.</code> 네가 받을 자격이 있는 것을 요구해."],"translation":"자기가 받을 자격이 있다고 아는 것조차 요구하기 무서워하는 남자요. 좋아요. 그럼 내일 Sullivan의 사무실로 가서 당신 몫을 요구해요."},{"english":"I mean, who cares if he's the scariest,\nwrinkliest old dude in New York, right?\nYeah. Yeah, right.\n-Yeah, I'll do that tomorrow.\n-Mm.\nOr maybe the next day.","focus":"who cares if / superlative","notes":["<code>Who cares if ...?</code>: ...이면 또 어때?","<code>wrinkliest</code>: 가장 주름이 많은","<code>the next day</code>: 그다음 날"],"chunks":["<code>I'll do that tomorrow.</code> 내일 그걸 할게요."],"translation":"New York에서 가장 무섭고 주름 많은 노인이면 또 어때요, 그렇죠? 그래요, 맞아요. 내일 할게요. 아니면 그다음 날일지도."},{"english":"What about you?\nWell, that's a no-brainer.\nMake peace with my dad.\nWe just never really connected.","focus":"what about / no-brainer / connect","notes":["<code>no-brainer</code>: 고민할 필요도 없이 쉬운 선택","<code>connect with + 사람</code>: 사람과 정서적으로 통하다"],"chunks":["<code>What about you?</code> 당신은요?"],"translation":"당신은요? 그건 생각할 것도 없어요. 아빠와 화해하기. 우리는 한 번도 진정으로 통하지 못했어요."},{"english":"And because my brothers\nare so damn perfect,\nhe always acts like I'm the screw-up.\nBut you're not a screw-up.\nReally?","focus":"act like / screw-up","notes":["<code>act like + 문장</code>: 마치 ...인 것처럼 행동하다","<code>screw-up</code>: 늘 일을 망치는 사람","<code>damn</code>: 강조를 더하는 거친 표현"],"chunks":["<code>He acts like I'm ...</code> 그는 나를 ...인 것처럼 대해요."],"translation":"형제들이 너무나 완벽해서 아빠는 늘 내가 문제아인 것처럼 대해요. 하지만 당신은 문제아가 아니에요. 정말요?"},{"english":"Then how come I can't get through\na single chapter of Moby Dick\nwithout falling asleep?\nAnd I still don't have one job interview.","focus":"how come / without -ing","notes":["<code>How come + 문장?</code>: 왜 ...한 거야?","<code>get through</code>: 끝까지 해내다, 읽어내다","<code>without + -ing</code>: ...하지 않고"],"chunks":["<code>How come I can't ...?</code> 나는 왜 ...하지 못할까요?"],"translation":"그럼 나는 왜 잠들지 않고 「Moby Dick」 한 장도 끝까지 읽지 못하죠? 아직 면접 제안도 하나 없고요."},{"english":"Oh, that reminds me.\nI do pro bono work for a women's shelter\non the Lower East Side.\nThey have a classroom--","focus":"remind / pro bono","notes":["<code>That reminds me.</code>: 그 말을 들으니 생각났어요","<code>pro bono work</code>: 무료 공익 활동","<code>women's shelter</code>: 여성 보호소"],"chunks":["<code>That reminds me of ...</code> 그 말을 들으니 ...이 생각나요."],"translation":"아, 그 말을 들으니 생각났어요. 저는 Lower East Side의 여성 보호소에서 무료 법률 활동을 해요. 거기에 교실이 있는데..."},{"english":"I'm sorry, you do free work\nfor a women's shelter?\nUh, yeah.\nSo modest, Bradley.","focus":"free work / modest","notes":["<code>free work</code>: 무료로 하는 일","<code>modest</code>: 겸손한"],"chunks":["<code>You do ...?</code> 당신이 ...한다고요?"],"translation":"잠깐, 여성 보호소를 위해 무료로 일한다고요? 네. 참 겸손하시네요, Bradley."},{"english":"The point is they have a classroom\nfor the high school kids that live there,\nand they need a teacher\nto finish out the rest of the semester.\nAny interest?","focus":"the point is / finish out","notes":["<code>The point is ...</code>: 요점은 ...이다","<code>finish out</code>: 남은 기간을 마무리하다","<code>the rest of</code>: 나머지"],"chunks":["<code>Any interest?</code> 관심 있어요?"],"translation":"요점은 그곳에 사는 고등학생들을 위한 교실이 있고, 남은 학기를 마무리해 줄 교사가 필요하다는 거예요. 관심 있어요?"},{"english":"Maybe.\nYeah.\nWhy are you being so nice to me?\nDo you get, like, a bonus\nif I actually get my inheritance?","focus":"be being / bonus","notes":["<code>Why are you being ...?</code>: 왜 지금 ...하게 구는 거예요?","<code>bonus</code>: 보너스, 성과급","<code>actually</code>: 실제로"],"chunks":["<code>Do you get a bonus if ...?</code> ...하면 보너스를 받아요?"],"translation":"아마도요. 네. 왜 이렇게 잘해줘요? 내가 실제로 유산을 받으면 보너스라도 받아요?"},{"english":"Wow. Okay, now you've hurt my feelings.\nI don't know why.\nActually, I just feel like\nyou'd be a good fit.","focus":"hurt feelings / good fit","notes":["<code>hurt someone's feelings</code>: 사람의 감정을 상하게 하다","<code>a good fit</code>: 잘 맞는 사람이나 선택"],"chunks":["<code>You'd be a good fit.</code> 당신이 잘 맞을 것 같아요."],"translation":"와, 이제 제 마음이 상했네요. 왜인지는 모르겠지만요. 사실 그냥 당신이 그 일에 잘 맞을 것 같아요."}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 3:</strong> 21:26 이후 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      const body = rows
        ? '<section class="grid" aria-label="Sentence study table">' + rows + '</section>'
        : '<section class="empty">Section 3 대사 원문을 보내주면, Section 1과 같은 형식으로 번호, 해석, 문법, 활용 표현을 정리합니다.</section>';
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 3 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
</body>
</html>
