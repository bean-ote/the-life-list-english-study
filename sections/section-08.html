<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 8 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>

  <script>
    const items = [{"english":"- Pringle?\n- Yes.\nThank you.\nYou okay?\nYeah.\nNo.","focus":"short replies / you okay","notes":["<code>You okay?</code>: 괜찮아?","<code>Yeah. No.</code>: 말은 괜찮다면서 곧바로 부정하는 감정 표현","<code>Pringle</code>: 과자 이름"],"chunks":["<code>You okay?</code> 괜찮아?"],"translation":"Pringle 먹을래? 응. 고마워. 괜찮아? 응. 아니."},{"english":"He won't answer any of my calls or texts,\nwhich is just great.\nYou guys are amazing for doing this.\nI really appreciate it.","focus":"won't / appreciate","notes":["<code>won't + 동사</code>: ...하려 하지 않는다","<code>calls or texts</code>: 전화나 문자","<code>which is just great</code>: 반어적으로 짜증을 드러내는 표현","<code>I appreciate it.</code>: 고마워요"],"chunks":["<code>I really appreciate it.</code> 정말 고마워요."],"translation":"그가 전화도 문자도 안 받아요. 정말 끝내주죠. 이렇게 해줘서 두 사람 정말 대단해요. 진심으로 고마워요."},{"english":"It's an adventure.\nIf I was meeting my father\nfor the first time, I'd want some backup.\nWhat?","focus":"if I was / backup","notes":["<code>adventure</code>: 모험","<code>for the first time</code>: 처음으로","<code>backup</code>: 지원군, 뒷받침해 줄 사람","<code>I'd want</code>: I would want의 줄임말"],"chunks":["<code>I'd want some backup.</code> 나도 지원군이 있었으면 할 거야."],"translation":"모험이잖아요. 내가 아버지를 처음 만나는 거라면 나도 지원군을 원할 거예요. 뭐요?"},{"english":"I'm trying to put on some weight.\nI'm getting way too good-looking.\nPeople are starting to think\nI'm superficial.","focus":"put on weight / superficial","notes":["<code>put on weight</code>: 살이 찌다","<code>way too</code>: 너무나도, 훨씬 지나치게","<code>good-looking</code>: 잘생긴","<code>superficial</code>: 피상적인, 외모만 보는"],"chunks":["<code>I'm trying to ...</code> ...하려고 노력 중이야."],"translation":"살을 좀 찌우려고요. 제가 너무 잘생겨지고 있어서요. 사람들이 제가 피상적인 사람이라고 생각하기 시작했어요."},{"english":"You see? She never laughs at my jokes.\n-You told her that?\n-Because you don't.\nMaybe I was laughing on the inside.\nI don't know.","focus":"laugh at / on the inside","notes":["<code>You see?</code>: 봤지?","<code>laugh at one's jokes</code>: 농담에 웃다","<code>on the inside</code>: 속으로, 마음속으로"],"chunks":["<code>Maybe I was laughing on the inside.</code> 속으로 웃고 있었을지도 몰라."],"translation":"봤죠? 그녀는 제 농담에 절대 안 웃어요. 그 얘길 했어? 네가 안 웃으니까. 속으로 웃고 있었을지도 몰라요. 모르죠."},{"english":"Well, laugh louder on the inside.\nOh my God.\n- No way.\n- She laughed.\n- Let's go.\n- What?\nHa, ha, ha, ha, ha.\nHm.","focus":"laugh louder / no way","notes":["<code>laugh louder</code>: 더 크게 웃다","<code>No way.</code>: 말도 안 돼, 설마","<code>Let's go.</code>: 가자, 해냈다의 환호"],"chunks":["<code>She laughed.</code> 그녀가 웃었어."],"translation":"그럼 속으로 더 크게 웃어줘요. 세상에. 말도 안 돼. 그녀가 웃었어. 좋았어. 뭐? 하하하하하. 흠."},{"english":"Hey, can we listen to something else?\nYeah, sure.","focus":"can we / something else","notes":["<code>Can we ...?</code>: 우리 ...해도 될까?","<code>something else</code>: 다른 것","<code>Yeah, sure.</code>: 응, 물론이지"],"chunks":["<code>Can we listen to something else?</code> 다른 것 좀 들을 수 있을까?"],"translation":"우리 다른 것 좀 들을 수 있을까요? 네, 물론이죠."},{"english":"[Song plays: \"That's Not My Name.\"]","focus":"song cue","notes":["노래 가사는 저작권상 길게 싣지 않고 장면 표시만 남김","<code>play</code>: 음악이 재생되다"],"chunks":[],"translation":"노래 「That's Not My Name」이 재생된다."},{"english":"-Hey.\n-Hmm.\nWhat if my dad doesn't like me?\nWhat if you don't like him?\nIs that you being reassuring?","focus":"what if / reassuring","notes":["<code>What if ...?</code>: ...하면 어떡하지?","<code>doesn't like me</code>: 나를 좋아하지 않다","<code>reassuring</code>: 안심시키는"],"chunks":["<code>What if my dad doesn't like me?</code> 아빠가 나를 안 좋아하면 어떡하지?"],"translation":"저기요. 응? 우리 아빠가 날 안 좋아하면 어떡하죠? 당신이 그를 안 좋아하면요? 지금 그게 안심시키는 말이에요?"},{"english":"What if he doesn't like me and I don't\nlike him? I already have one of those.","focus":"one of those","notes":["<code>What if ...?</code>: ...하면 어떡하지?","<code>one of those</code>: 그런 사람 하나, 그런 관계 하나","<code>already</code>: 이미"],"chunks":["<code>I already have one of those.</code> 그런 사람은 이미 하나 있어요."],"translation":"그가 저를 안 좋아하고 저도 그를 안 좋아하면요? 그런 사람은 이미 하나 있어요."},{"english":"God, Nina's so beautiful.\nShe has a neck like Audrey Hepburn.\nYou should check out her ears.\n-Really?\n-I'm serious, yeah.","focus":"check out / be serious","notes":["<code>so beautiful</code>: 정말 아름다운","<code>have a neck like ...</code>: ...같은 목선을 갖다","<code>check out</code>: 한번 보다","<code>I'm serious.</code>: 진심이야"],"chunks":["<code>You should check out ...</code> ... 한번 봐야 해."],"translation":"세상에, Nina는 정말 아름다워요. Audrey Hepburn 같은 목선을 가졌어요. 귀도 한번 봐야 해요. 정말요? 진심이에요."},{"english":"Wow!\nIt's like a golden orb\ndesigned by a sun god.\nAnd her skin.\nYeah.\nIs the sex amazing?","focus":"it's like / amazing","notes":["<code>It's like ...</code>: ...같다","<code>golden orb</code>: 황금빛 구체","<code>designed by</code>: ...가 설계한","<code>amazing</code>: 굉장한"],"chunks":["<code>Is the sex amazing?</code> 잠자리도 굉장해요?"],"translation":"와! 태양신이 만든 황금빛 구체 같아요. 그리고 피부도요. 맞아요. 잠자리도 굉장해요?"},{"english":"I mean, even if it wasn't,\nI'd be so impressed with myself,\nI would just feel like it was amazing.\nHm.","focus":"even if / impressed with","notes":["<code>even if</code>: 설령 ...라 해도","<code>be impressed with oneself</code>: 스스로에게 감탄하다","<code>feel like</code>: ...처럼 느끼다"],"chunks":["<code>Even if it wasn't, ...</code> 설령 그렇지 않더라도 ..."],"translation":"그러니까, 설령 그렇지 않더라도 제가 제 자신에게 너무 감탄해서 그냥 굉장한 것처럼 느낄 거예요. 흠."},{"english":"Just so you know,\nI can hear every word you're saying.\nThe only annoying thing about her\nis that she talks in her sleep.\nMm.","focus":"just so you know / talk in sleep","notes":["<code>Just so you know</code>: 알아두라고 하는 말인데","<code>every word</code>: 한마디 한마디 전부","<code>annoying</code>: 짜증나는","<code>talk in one's sleep</code>: 잠꼬대를 하다"],"chunks":["<code>Just so you know, ...</code> 알아두라고 말하는데 ..."],"translation":"참고로 말하자면, 당신들이 하는 말 한마디 한마디 다 들려요. 그녀의 유일하게 짜증나는 점은 잠꼬대를 한다는 거예요. 음."},{"english":"We are checking in\nfor Alexandra Rose.\n- And Bradley Ackerman.\n- Bradley Ackerman.\nThe Acker Man?","focus":"check in / nickname","notes":["<code>check in</code>: 호텔에 체크인하다","<code>for + 이름</code>: ... 이름으로","<c
