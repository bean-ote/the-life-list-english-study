<!doctype html>

  <title>The Life List - Section 6 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"- This is fantastic.\n- Pretty great, isn't it?\nHoly shit, is that Patrick Ewing?","focus":"fantastic / tag question","notes":["<code>fantastic</code>: 환상적인","<code>isn't it?</code>: 그렇지?라는 부가의문문","<code>Holy shit</code>: 강한 놀라움을 나타내는 거친 표현"],"chunks":["<code>Pretty great, isn't it?</code> 꽤 멋지죠, 그렇죠?"],"translation":"정말 환상적이에요. 꽤 멋지죠? 세상에, 저 사람 Patrick Ewing이에요?"},{"english":"Wait, you're into basketball?\nI was the point guard\nat the Ditmas Park Middle School team.\nI loved the Knicks,\nand I need to talk to him.","focus":"be into / point guard","notes":["<code>be into + 명사</code>: ...을 좋아하고 관심 있어 하다","<code>point guard</code>: 농구의 포인트 가드","<code>need to + 동사</code>: ...해야 한다"],"chunks":["<code>You're into ...?</code> ...을 좋아해요?"],"translation":"잠깐, 농구 좋아해요? 저는 Ditmas Park 중학교 팀의 포인트 가드였어요. Knicks를 정말 좋아했고 저 사람과 꼭 이야기해야 해요."},{"english":"It's kind of a long story.\nWhich I will tell you if you're very good.\nWell, if you're very good,\nI might just introduce you to him.\nYou know him?","focus":"kind of / might just","notes":["<code>kind of</code>: 조금, 어느 정도","<code>if you are very good</code>: 얌전히 잘하면","<code>might just + 동사</code>: 어쩌면 정말 ...할지도 모른다"],"chunks":["<code>It's kind of a long story.</code> 이야기가 좀 길어요."],"translation":"이야기가 좀 길어요. 잘하면 말해줄게요. 그럼 당신이 잘하면 제가 그를 소개해줄지도 모르죠. 아는 사이예요?"},{"english":"I'm just gonna check my coat.\nI'll be right back.\nPatrick Ewing.\n-Yeah. Thank you.\n-You're welcome.","focus":"check a coat / be right back","notes":["<code>check one's coat</code>: 외투를 보관소에 맡기다","<code>be right back</code>: 곧 돌아오다"],"chunks":["<code>I'll be right back.</code> 금방 돌아올게요."],"translation":"외투를 맡기고 올게요. 금방 돌아올게요. Patrick Ewing 씨. 네, 감사합니다. 천만에요."},{"english":"Aren't you supposed to wear a tux?\nAren't you supposed\nto be wearing a fancy gown?\nOh, don't be so gender normative.","focus":"be supposed to / gender normative","notes":["<code>be supposed to + 동사</code>: ...하기로 되어 있다, ...해야 한다","<code>tux</code>: 턱시도","<code>gender normative</code>: 전통적 성 역할을 당연시하는"],"chunks":["<code>Aren't you supposed to ...?</code> ...해야 하는 거 아니에요?"],"translation":"턱시도를 입어야 하는 거 아니에요? 당신은 화려한 드레스를 입어야 하는 거 아니고요? 그렇게 성 역할에 얽매이지 마요."},{"english":"At least you got yourself a nice tie.\nYou look damn good, counselor.\nHe does, doesn't he?","focus":"at least / damn / counselor","notes":["<code>at least</code>: 적어도","<code>damn + 형용사</code>: 정말 ...하다고 강하게 강조","<code>counselor</code>: 변호사를 부르는 호칭"],"chunks":["<code>You look damn good.</code> 정말 멋져 보여요."],"translation":"그래도 멋진 넥타이는 샀네요. 정말 멋져요, 변호사님. 그렇죠?"},{"english":"Alex, this is Nina Keller.\n-Ah!\n-Nina, this is my client, Alex Rose.\nIt's so nice to meet you, Nina.\nI've heard so much about you.","focus":"introductions / hear about","notes":["<code>This is + 사람</code>: 사람을 소개할 때 쓰는 표현","<code>hear about + 사람</code>: 사람에 관해 듣다"],"chunks":["<code>I've heard so much about you.</code> 말씀 많이 들었어요."],"translation":"Alex, 이쪽은 Nina Keller예요. Nina, 이쪽은 제 의뢰인 Alex Rose예요. 만나서 정말 반가워요. 말씀 많이 들었어요."},{"english":"Yeah, you too. I think\nyou may be Brad's favorite client.\nNina just got offered a job\nheading the Mayor's\nSustained Manhattan Initiative.","focus":"may be / get offered / head","notes":["<code>may be</code>: ...일지도 모른다","<code>get offered a job</code>: 일자리를 제안받다","<code>head + 조직</code>: 조직을 이끌다"],"chunks":[],"translation":"저도요. 아마 Brad가 가장 좋아하는 의뢰인인가 봐요. Nina는 시장의 Sustained Manhattan Initiative를 이끄는 일자리를 제안받았어요."},{"english":"-Wow.\n-Looks like she's moving back to New York.\n\"Just when I thought I was out,\nthey pulled me back in.\"\nWell, congrats.","focus":"look like / pull back in","notes":["<code>Looks like + 문장</code>: ...인 것 같다","<code>move back to</code>: ...로 다시 이사 오다","<code>pull someone back in</code>: 사람을 다시 끌어들이다","<code>congrats</code>: congratulations의 구어체"],"chunks":["<code>Looks like she's ...</code> 그녀가 ...할 것 같네요."],"translation":"와. New York으로 돌아오게 된 것 같네요. “빠져나왔다고 생각한 순간 그들이 다시 끌어들였지.” 축하해요."},{"english":"What are you doing here? This is\nthe last place I'd think to find you.\nShe's with me.\nHey.\nGarrett.","focus":"the last place / with me","notes":["<code>the last place I'd think to ...</code>: ...할 거라고는 전혀 생각 못 한 장소","<code>be with + 사람</code>: 사람과 함께 오다"],"chunks":["<code>What are you doing here?</code> 여기서 뭐 해요?"],"translation":"여기서 뭐 해요? 당신을 볼 거라고는 전혀 생각 못 한 곳인데요. 저와 함께 왔어요. 안녕하세요. Garrett."},{"english":"- Nina.\n- Dr. Taylor.\n- You know each other.\n- know each other.\nThat makes perfect sense.\nGarrett knows everyone.\nAnd I thought I was special.","focus":"know each other / make sense","notes":["<code>know each other</code>: 서로 알다","<code>make perfect sense</code>: 완전히 말이 되다","<code>I thought I was special.</code>: 나만 특별한 줄 알았다는 농담"],"chunks":[],"translation":"Nina. Dr. Taylor. 서로 아는 사이네요. 당연하네요. Garrett은 모두를 아니까요. 나만 특별한 줄 알았는데."},{"english":"And you are special. Nina and I had\na disastrous date a long time ago.\nIt's impossible to have\ntwo alphas in a relationship.\nSomeone always has to be\nthe beta.","focus":"disastrous / alpha / beta","notes":["<code>disastrous</code>: 처참한, 엉망인","<code>alpha</code>: 주도적인 사람","<code>beta</code>: 상대적으로 따르는 사람","<code>have to</code>: ...해야 한다"],"chunks":["<code>Someone has to be ...</code> 누군가는 ...여야 해요."],"translation":"당신은 특별해요. Nina와 저는 오래전에 처참한 데이트를 했어요. 관계에 주도적인 사람이 둘이면 안 되거든요. 누군가는 따르는 쪽이어야 하죠."},{"english":"I guess that's where I come in.\nOh, that's not what I meant.\nYou have all the alpha a girl needs.","focus":"that is where / mean","notes":["<code>That's where I come in.</code>: 그게 바로 내가 필요한 부분이군요","<code>That's not what I meant.</code>: 그런 뜻은 아니었어요"],"chunks":["<code>You have all the ... a girl needs.</code> 당신은 여자가 원하는 ...을 다 가졌어요."],"translation":"그럼 제가 그 역할인가 보네요. 그런 뜻은 아니었어요. 당신은 여자가 원하는 주도성을 다 가졌어요."},{"english":"Oh, did you hear that?\nI have all of the alpha\nCheers to your alpha.\n- To Brad's alpha.\n- Cheers.\n- Wow. That's Cheers.\n- I love this so much.","focus":"cheers to / hear that","notes":["<code>Did you hear t     const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 6:</strong> 57:03~1:07:56 까지 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      const body = rows
        ? '<section class="grid" aria-label="Sentence study table">' + rows + '</section>'
        : '<section class="empty">Section 6 대사 원문을 보내주면, Section 1과 같은 형식으로 번호, 해석, 문법, 활용 표현을 정리합니다.</section>';
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 6 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
</body>
</html>
