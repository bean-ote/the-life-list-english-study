<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 10 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"Remember the summer\nwhen you and your brothers\ndid the combination\ncar wash and lemonade stand,\nand your brothers assumed that the money\nwould go to their video game fund,\nbut you hung these everywhere\nuntil they finally had to relent,\nand all the money\nwent to the Humane Society.","focus":"remember when / relent","notes":["<code>Remember the summer when ...</code>: ...했던 그 여름 기억하니?","<code>combination</code>: 결합된, 함께 하는","<code>relent</code>: 마음을 누그러뜨리다, 결국 양보하다","<code>Humane Society</code>: 동물 보호 단체"],"chunks":["<code>until they finally had to relent</code> 결국 그들이 양보할 때까지"],"translation":"너와 네 오빠들이 세차와 레모네이드 판매를 같이 했던 그 여름 기억하니? 오빠들은 돈이 자기들 비디오게임 자금으로 갈 거라고 생각했지만, 네가 이걸 여기저기 붙이고 다녀서 결국 그들이 양보했고, 돈은 전부 동물 보호 단체로 갔지."},{"english":"What? I thought I said\nmosh pits were out of the question.\nFine.\nJust don't go anywhere near\na tattoo parlor or any vehicle whatsoever.","focus":"out of the question / whatsoever","notes":["<code>out of the question</code>: 절대 안 되는, 논외인","<code>Fine.</code>: 알았어, 좋아","<code>go anywhere near</code>: ...근처에도 가다","<code>whatsoever</code>: 조금도, 전혀"],"chunks":["<code>Don't go anywhere near ...</code> ...근처에도 가지 마."],"translation":"뭐라고? 모쉬핏은 절대 안 된다고 했던 것 같은데. 좋아. 문신 가게나 어떤 차량 근처에도 가지 마."},{"english":"I want you to live your best life.\nYou have to get yourself\nout of this hole that you're in.\nI'm not gonna be around to dig you out,\nbut I can sure as hell leave you a shovel.","focus":"live your best life / dig out","notes":["<code>live your best life</code>: 최고의 삶을 살다","<code>get yourself out of ...</code>: 스스로 ...에서 빠져나오다","<code>dig someone out</code>: 누군가를 파내어 구해주다","<code>sure as hell</code>: 정말로, 반드시"],"chunks":["<code>I can leave you a shovel.</code> 네가 빠져나올 도구는 남겨줄 수 있어."],"translation":"네가 최고의 삶을 살았으면 해. 네가 빠진 이 구덩이에서 스스로 나와야 해. 내가 곁에 있어 널 파내 줄 수는 없지만, 삽 하나는 확실히 남겨줄 수 있어."},{"english":"Do you remember\nthe cottage we rented upstate?\nAnd at night, we would all go sit out\non the porch together\nand just look at the moon and the stars.","focus":"upstate / would","notes":["<code>cottage</code>: 작은 별장, 오두막집","<code>upstate</code>: 주 북부 지역으로","<code>would</code>: 과거에 자주 ...하곤 했다","<code>porch</code>: 현관 앞 베란다"],"chunks":["<code>We would all go sit out ...</code> 우리는 모두 나가 앉곤 했어."],"translation":"우리가 북쪽 지역에서 빌렸던 별장 기억하니? 밤이면 우리는 모두 현관 앞에 나가 앉아서 달과 별을 바라보곤 했지."},{"english":"And it seemed like the only time that\nwe didn't have to talk or tease or argue.\nAnd sometimes you'd curl up\nin your father's lap,\nand it was just quiet.","focus":"seem like / curl up","notes":["<code>It seemed like ...</code>: ...처럼 느껴졌다","<code>tease</code>: 놀리다","<code>curl up</code>: 몸을 웅크리고 기대다","<code>lap</code>: 무릎"],"chunks":["<code>It was just quiet.</code> 그저 조용했어."],"translation":"그때만큼은 우리가 말하거나 놀리거나 다툴 필요가 없는 유일한 시간처럼 느껴졌어. 가끔 너는 아빠 무릎에 몸을 웅크리고 앉았고, 그저 조용했지."},{"english":"Just a moment\nto experience that sense of wonder\nand reflect and be grateful\nfor all that we have.\nAnd most of all, for each other.","focus":"sense of wonder / grateful","notes":["<code>a sense of wonder</code>: 경이로움","<code>reflect</code>: 되돌아보다, 성찰하다","<code>be grateful for</code>: ...에 감사하다","<code>most of all</code>: 무엇보다도"],"chunks":["<code>Be grateful for all that we have.</code> 우리가 가진 모든 것에 감사하다."],"translation":"그건 경이로움을 느끼고, 우리가 가진 모든 것에 대해 돌아보고 감사하는 순간이었어. 그리고 무엇보다 서로에게 감사하는 순간이었지."},{"english":"Hi.\nHey, Dad.\nSo happy to see you.","focus":"happy to see you","notes":["<code>Hey, Dad.</code>: 아빠, 안녕","<code>So happy to see you.</code>: 만나서 정말 기뻐요","<code>happy to + 동사</code>: ...해서 기쁜"],"chunks":["<code>I'm happy to see you.</code> 만나서 기뻐."],"translation":"안녕하세요. 안녕, 아빠. 만나서 정말 기뻐요."},{"english":"I would pull up in the driveway,\nhome from work\nrun out of the house,\nand I'd pick you up and spin you around.","focus":"pull up / spin around","notes":["<code>pull up</code>: 차를 세우다","<code>driveway</code>: 집 앞 진입로","<code>pick someone up</code>: 누군가를 들어 올리다","<code>spin someone around</code>: 빙글빙글 돌리다"],"chunks":["<code>I would pull up ... and I'd ...</code> 예전에는 ...하고 ...하곤 했어."],"translation":"내가 퇴근해서 집 앞 진입로에 차를 세우면, 네가 집에서 뛰어나왔고, 나는 널 들어 올려 빙글빙글 돌렸지."},{"english":"Mr. Sullivan!\nAlexandra. Wonderful to see you.\nEven if you don't exactly\nseem thrilled to see me.","focus":"wonderful / thrilled","notes":["<code>Wonderful to see you.</code>: 만나서 정말 반갑습니다","<code>even if</code>: 비록 ...일지라도","<code>not exactly</code>: 꼭 ...인 것은 아닌","<code>thrilled</code>: 아주 기쁜, 신난"],"chunks":["<code>You don't seem thrilled.</code> 별로 반가워 보이진 않네요."],"translation":"Sullivan 씨! Alexandra, 만나서 정말 반갑군요. 당신은 저를 보고 딱히 반가워 보이지는 않지만요."},{"english":"Sorry, it's just,\nI thought Mr. Ackerman would be here.","focus":"it's just / I thought","notes":["<code>It's just ...</code>: 그냥 ...라서요","<code>I thought ... would be here</code>: ...가 여기 있을 줄 알았다","<code>would be</code>: 예상 속의 상황을 말할 때 사용"],"chunks":["<code>I thought you would be here.</code> 네가 여기 있을 줄 알았어."],"translation":"죄송해요, 그냥 Ackerman 씨가 여기 있을 줄 알았어요."},{"english":"Bradley sends his regrets.\nNow that he's a full partner,\nhis schedule is more complicated.","focus":"send regrets / now that","notes":["<code>send one's regrets</code>: 참석하지 못해 유감이라는 뜻을 전하다","<code>now that</code>: 이제 ...이므로","<code>full partner</code>: 정식 파트너","<code>schedule</code>: 일정"],"chunks":["<code>Now that he's a full partner, ...</code> 이제 그가 정식 파트너가 되었으니 ..."],"translation":"Bradley가 못 와서 유감이라고 전하더군요. 이제 정식 파트너가 되었으니 일정이 더 복잡해졌습니다."},{"english":"I'm sorry. Did you say he's a partner?\nHe marched into my office\nand gave me an ultimatum.\nI couldn't decide\nwhether to rap him on the knuckles\nor ask what took him so long.","focus":"did you say / ultimatum","notes":["<code>Did you say ...?</code>: ...라고 하셨나요?","<code>march into</code>: 당당히 들어가다","<code>ultimatum</code>: 최후통첩","<code>what took him so long</code>: 왜 그렇게 오래 걸렸는지"],"chunks":["<code>I couldn't decide whether to A or B.</code> A할지 B할지 결정할 수 없었다."],"translation":"죄송한데, 그가 파트너라고 하셨나요? 제 사무실로 당당히 들어와 최후통첩을 하더군요. 손등을 때려야 할지, 왜 이렇게 오래 걸렸냐고 물어야 할지 모르겠더군요."},{"english":"I assume that's for him.\nOh. It's nothing. It's just a tie.\n-Mm.\n-And a bib, just a little joke between us.\nI'll make sure he gets it.","focus":"assume / make sure","notes":["<code>I assume ...</code>: ...라고 생각합니다","<code>It's nothing.</code>: 별거 아니에요","<code>bib</code>: 턱받이","<code>make sure</code>: 반드시 ...하게 하다"],"chunks":["<code>I'll make sure he gets it.</code> 그가 받도록 할게요."],"translation":"그건 그에게 줄 거라고 생각하는데요. 아, 별거 아니에요. 그냥 넥타이예요. 그리고 턱받이도요. 우리 둘만의 작은 농담이에요. 그가 받게 해두겠습니다."},{"english":"So, when Elizabeth proposed\nthis little scheme,\nI told her she was off her rocker.","focus":"propose / off one's rocker","notes":["<code>propose</code>: 제안하다","<code>scheme</code>: 계획, 술책","<code>off one's rocker</code>: 제정신이 아닌, 정신 나간"],"chunks":["<code>You're off your rocker.</code> 너 제정신이 아니야."],"translation":"Elizabeth가 이 작은 계획을 제안했을 때, 저는 그녀에게 제정신이 아니라고 말했습니다."},{"english":"That's when we agreed it'd be wise\nto have someone like Bradley\nhandle the particulars.","focus":"it'd be wise to / particulars","notes":["<code>That's when ...</code>: 바로 그때 ...했다","<code>it'd be wise to</code>: ...하는 것이 현명할 것이다","<code>handle</code>: 처리하다","<code>particulars</code>: 세부 사항"],"chunks":["<code>It'd be wise to ...</code> ...하는 게 현명할 거야."],"translation":"그때 우리는 Bradley 같은 사람이 세부 사항을 처리하게 하는 것이 현명하겠다고 합의했습니다."},{"english":"In any case, I hope you haven't\nsuffered too much this last year.\nI had my moments. But, um\nI guess that was partly the point.","focus":"in any case / have one's moments","notes":["<code>In any case</code>: 어쨌든","<code>suffer</code>: 고생하다, 고통받다","<code>I had my moments.</code>: 힘든 순간들이 있었어요","<code>partly the point</code>: 어느 정도는 의도였던 것"],"chunks":["<code>I had my moments.</code> 쉽지 않은 순간들이 있었어."],"translation":"어쨌든, 지난 1년 동안 너무 고생하지 않았기를 바랍니다. 힘든 순간들이 있었죠. 하지만 그게 어느 정도는 의도였던 것 같아요."},{"english":"The thing is, Mr. Sullivan, um\nI didn't finish the list.","focus":"the thing is","notes":["<code>The thing is</code>: 문제는, 사실은","<code>finish the list</code>: 리스트를 끝내다","<code>um</code>: 말을 고를 때 쓰는 머뭇거림"],"chunks":["<code>The thing is, I didn't ...</code> 사실은 내가 ...하지 못했어요."],"translation":"문제는요, Sullivan 씨, 제가 리스트를 끝내지 못했다는 거예요."},{"english":"Seems true love continues to elude me.\nTrue love is a bitch.\nAsk any of my ex-wives.","focus":"elude / ex-wife","notes":["<code>seems</code>: ...인 것 같다","<code>elude</code>: 잡히지 않다, 피해 가다","<code>a bitch</code>: 정말 골치 아픈 것이라는 거친 표현","<code>ex-wife</code>: 전처"],"chunks":["<code>True love continues to elude me.</code> 진정한 사랑은 계속 나를 피해 가요."],"translation":"진정한 사랑은 계속 저를 피해 가는 것 같아요. 진정한 사랑은 골치 아프죠. 제 전처들 아무에게나 물어보세요."},{"english":"Is there like a consolation prize?\nA week at Club Med?\n-I'm afraid not.\n-Yeah.\nJust this.","focus":"consolation prize / I'm afraid not","notes":["<code>consolation prize</code>: 위로상","<code>I'm afraid not.</code>: 안타깝지만 아닙니다","<code>just this</code>: 이것뿐입니다"],"chunks":["<code>Is there a consolation prize?</code> 위로상 같은 건 있나요?"],"translation":"위로상 같은 건 없나요? Club Med 일주일 이용권 같은 거요? 안타깝지만 없습니다. 그렇군요. 이것뿐입니다."},{"english":"Your mother didn't think it was fair\nto expect you to find true love\nwith a ticking clock.\nAnd I quote,\n\"I just hope she won't settle for less.\"","focus":"fair / settle for less","notes":["<code>it was fair to ...</code>: ...하는 것이 공정했다","<code>with a ticking clock</code>: 시간이 촉박한 상태에서","<code>And I quote</code>: 그대로 인용하자면","<code>settle for less</code>: 더 못한 것에 만족하다"],"chunks":["<code>Don't settle for less.</code> 그보다 못한 것에 만족하지 마."],"translation":"당신의 어머니는 시간 제한을 두고 진정한 사랑을 찾으라고 기대하는 건 공정하지 않다고 생각했습니다. 그대로 인용하자면, “그 아이가 그보다 못한 것에 만족하지 않기를 바랄 뿐이야.”"},{"english":"Your inheritance, my dear.\nThe house?\nHer wish from the start.","focus":"inheritance / from the start","notes":["<code>inheritance</code>: 유산","<code>my dear</code>: 친근하게 부르는 말","<code>from the start</code>: 처음부터"],"chunks":["<code>That was her wish from the start.</code> 그건 처음부터 그녀의 바람이었어."],"translation":"당  doing with that?\n-I am doing a little project.\nYou'll see.","focus":"what are you doing / you'll see","notes":["<code>What are you doing with ...?</code>: ...로 뭐 하는 거야?","<code>a little project</code>: 작은 프로젝트","<code>You'll see.</code>: 보면 알아"],"chunks":["<code>You'll see.</code> 보면 알게 될 거야."],"translation":"그걸로 뭐 하는 거야? 작은 프로젝트를 하고 있어. 보면 알아."},{"english":"I love you so much, Bean.\nForever and always.\nDon't forget it.\nI love you too, Mom.\nBye.","focus":"forever and always","notes":["<code>so much</code>: 정말 많이","<code>forever and always</code>: 영원히 언제나","<code>Don't forget it.</code>: 잊지 마"],"chunks":["<code>I love you so much.</code> 정말 많이 사랑해."],"translation":"정말 사랑해, Bean. 영원히 언제나. 잊지 마. 나도 사랑해요, 엄마. 안녕."},{"english":"Oh shit!\nAre you callin' me bird?\nZoe, what are\nthe four true love questions?\n[Song plays: \"That's Not My Name.\"]\nShit.","focus":"callin' / true love questions","notes":["<code>callin'</code>: <code>calling</code>의 구어식 발음","<code>the four true love questions</code>: 진정한 사랑을 확인하는 네 가지 질문","노래 가사는 저작권 때문에 장면 표시로만 정리"],"chunks":["<code>What are the four ... questions?</code> 네 가지 ... 질문이 뭐였지?"],"translation":"젠장! 나를 새라고 부르는 거야? Zoe, 진정한 사랑의 네 가지 질문이 뭐였지? 노래 「That's Not My Name」가 재생된다. 젠장."},{"english":"What are you doing?\nWhat does it look like I'm doing?","focus":"what does it look like","notes":["<code>What are you doing?</code>: 뭐 하는 거야?","<code>What does it look like I'm doing?</code>: 내가 뭐 하는 것처럼 보여?"],"chunks":["<code>What does it look like ...?</code> ...처럼 보이지 않아?"],"translation":"뭐 하는 거야? 내가 뭐 하는 것처럼 보여?"},{"english":"Why didn't you answer any of my calls?\nI was trying to apologize to you.","focus":"answer calls / apologize","notes":["<code>answer one's calls</code>: 전화를 받다","<code>try to</code>: ...하려고 하다","<code>apologize to</code>: ...에게 사과하다"],"chunks":["<code>I was trying to apologize.</code> 사과하려고 했어."],"translation":"왜 내 전화를 하나도 안 받았어? 너에게 사과하려고 했어."},{"english":"Okay, well, apology accepted,\nand I'm sorry too,\nbut y fter + -ing</code>: ...한 뒤에","<code>for 36 hours</code>: 36시간 동안"],"chunks":["<code>That's what it felt like.</code> 딱 그런 느낌이었어."],"translation":"36시간 동안 플레이하고 나니 딱 그런 느낌이었어."},{"english":"Okay. Hey, everyone.\nHey, gather around, you beautiful\nrevelers. Come on, come inside.\nI wanted to make a toast. Um","focus":"gather around / make a toast","notes":["<code>gather around</code>: 모여 주세요","<code>revelers</code>: 즐기는 사람들, 파티 손님들","<code>make a toast</code>: 건배사를 하다","<code>I wanted to ...</code>: ...하고 싶었어요를 부드럽게 꺼내는 말"],"chunks":["<code>I wanted to make a toast.</code> 건배사를 하고 싶었어요."],"translation":"좋아요. 여러분. 다들 모여주세요, 멋진 파티 사람들. 어서 안으로 들어오세요. 건배사를 하고 싶었어요."},{"english":"It is so incredible to be in this house,\nthis house that Lucas\nand Alex and I grew up in.","focus":"incredible / grow up","notes":["<code>incredible</code>: 정말 대단한, 믿기 힘든","<code>grow up in</code>: ...에서 자라다","<code>this house that ...</code>: ...했던 이 집"],"chunks":["<code>The house I grew up in</code> 내가 자란 집"],"translation":"이 집에 있다는 게 정말 놀랍습니다. Lucas와 Alex와 제가 자란 바로 이 집에요."},{"english":"As you all know, this wasn't\nthe easiest year.\nIt tested us.","focus":"as you all know / test","notes":["<code>As you all know</code>: 여러분 모두 아시다시피","<code>the easiest year</code>: 가장 쉬운 해","<code>test someone</code>: 누군가를 시험에 들게 하다"],"chunks":["<code>It tested us.</code> 그 일은 우리를 시험했어요."],"translation":"여러분 모두 아시다시피, 올해는 쉽지 않았습니다. 우리를 시험한 해였죠."},{"english":"So thank you to old friends,\nto new friends, and finally,\nto our lovely dear mother.\nHappy New Year!\nHappy New Year!\nCheers.","focus":"thank you to / finally","notes":["<code>thank you to ...</code>: ...에게 감사드립니다","<code>old friends</code>: 오랜 친구들","<code>new friends</code>: 새 친구들","<code>finally</code>: 마지막으로"],"chunks":["<code>Cheers.</code> 건배."],"translation":"그러니 오랜 친구들에게, 새 친구들에게, 그리고 마지막으로 사랑하는 우리 어머니에게 감사드립니다. 새해 복 많이 받으세요! 새해 복 많이 받으세요! 건배."},{"english":"[Song plays: \"Our House.\"]","focus":"song cue","notes":["노래 가사는 저작권 때문에 전체 수록하지 않고 장면     const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +

          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0

      const body = rows

      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 10 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based on the transcript supplied by the user. Song lyrics are represented as scene cues.</footer></main>';
    }).join("");
