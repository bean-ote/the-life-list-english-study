<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List - Section 2 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>

  <script>
    const items = [{"english":"Ready to make an appearance?\nGonna be okay?","focus":"make an appearance / gonna","notes":["<code>make an appearance</code>: 모습을 드러내다, 사람들 앞에 나오다","<code>Gonna</code>: <code>going to</code>의 편한 구어체"],"chunks":["<code>Ready to + 동사?</code> ...할 준비 됐어?","<code>Gonna be okay?</code> 괜찮겠어?"],"translation":"사람들 앞에 나갈 준비 됐어? 괜찮겠어?"},{"english":"Hi, Sam. It's good to see you. Really is.","focus":"greeting / emphasis","notes":["<code>It's good to see you.</code>: 만나서 반갑다는 따뜻한 인사","<code>Really is.</code>: 앞 문장의 <code>It is</code>를 줄여 진심을 강조"],"chunks":["<code>It's good to see you.</code> 만나서 반가워요."],"translation":"안녕하세요, Sam. 만나서 정말 반가워요. 진심이에요."},{"english":"Don't you think it's surreal?\nHow do you mean?","focus":"asking what someone means","notes":["<code>surreal</code>: 비현실적인, 꿈같은","<code>How do you mean?</code>: 무슨 뜻이야? 어떻게 그런 말이야?"],"chunks":["<code>Don't you think ...?</code> ...라고 생각하지 않아?","<code>How do you mean?</code> 무슨 뜻이야?"],"translation":"이 상황이 너무 비현실적이지 않아? 무슨 뜻이야?"},{"english":"All of these people here except the one person who's supposed to be.","focus":"except / be supposed to","notes":["<code>except</code>: ...을 제외하고","<code>be supposed to + 동사</code>: ...하기로 되어 있다, ...해야 한다"],"chunks":["<code>the one person who's supposed to be here</code> 여기 있어야 할 단 한 사람"],"translation":"여기 이렇게 많은 사람들이 있는데, 정작 있어야 할 단 한 사람만 없잖아."},{"english":"I keep expecting her to walk out of the kitchen and tell me to stop slouching.\nI didn't know Dad was gonna be here.","focus":"keep -ing / tell someone to","notes":["<code>keep + -ing</code>: 계속 ...하다","<code>tell + 사람 + to + 동사</code>: 사람에게 ...하라고 말하다","<code>slouch</code>: 구부정하게 앉거나 서다"],"chunks":["<code>I keep expecting ...</code> 자꾸 ...할 것만 같아.","<code>I didn't know ... was gonna be here.</code> ...가 여기 올 줄 몰랐어."],"translation":"엄마가 주방에서 걸어 나와서 구부정하게 있지 말라고 할 것만 같아. 아빠가 여기 올 줄은 몰랐어."},{"english":"They were married for 20 years, most of them, happy.\nOf course he was gonna be there.\nWhatever.","focus":"of course / whatever","notes":["<code>for 20 years</code>: 20년 동안","<code>Of course</code>: 당연히","<code>Whatever.</code>: 됐어, 아무래도 상관없어처럼 대화를 밀어내는 말"],"chunks":["<code>Of course + 문장</code> 당연히 ...이지."],"translation":"두 분은 20년 동안 결혼 생활을 했고, 그 대부분은 행복했어. 당연히 아빠도 와야지. 됐어."},{"english":"I just hate when he talks as if the divorce was some kind of mutual decision.\nLike, bro, he left her.","focus":"as if / mutual decision","notes":["<code>as if</code>: 마치 ...인 것처럼","<code>mutual decision</code>: 서로 합의한 결정"],"chunks":["<code>I hate when ...</code> ...할 때 정말 싫어."],"translation":"아빠가 이혼이 무슨 서로 합의한 결정이었던 것처럼 말할 때 정말 싫어. 아니, 형, 아빠가 엄마를 떠난 거잖아."},{"english":"I hope your mom was clear about dividing stuff up.\nYou don't wanna be like the Nelsons.\nThey don't talk to each other anymore.","focus":"wanna / anymore","notes":["<code>divide stuff up</code>: 물건이나 재산을 나누다","<code>wanna</code>: <code>want to</code>의 편한 구어체","<code>not ... anymore</code>: 더 이상 ...하지 않다"],"chunks":["<code>I hope ... was clear about ...</code> ...에 대해 분명히 해뒀으면 좋겠어.","<code>You don't wanna be like ...</code> ...처럼 되고 싶진 않잖아."],"translation":"너희 엄마가 물건 나누는 문제를 분명히 해뒀길 바라. Nelson 가족처럼 되고 싶진 않잖아. 그 사람들은 이제 서로 말도 안 해."},{"english":"Agreed. As long as I get the Tamayo painting in the front hall.","focus":"as long as","notes":["<code>Agreed.</code>: 동의해","<code>as long as</code>: ...하기만 한다면","<code>front hall</code>: 현관 홀, 앞쪽 복도"],"chunks":["<code>As long as I get ...</code> 내가 ...만 받을 수 있다면."],"translation":"동의해. 현관 홀에 있는 Tamayo 그림만 내가 받는다면."},{"english":"God, Mom's barely been gone a week, and all you can talk about is her stuff?\nThat's easy for you to say. You're inheriting the company.","focus":"barely / inherit","notes":["<code>barely</code>: 겨우, 간신히; 여기서는 ‘고작’의 느낌","<code>inherit</code>: 상속받다"],"chunks":["<code>all you can talk about is ...</code> 네가 말하는 건 온통 ...뿐이야.","<code>That's easy for you to say.</code> 너야 그렇게 말하기 쉽지."],"translation":"세상에, 엄마가 돌아가신 지 고작 일주일도 안 됐는데 엄마 물건 얘기밖에 못 해? 너야 그렇게 말하기 쉽지. 넌 회사를 물려받을 거잖아."},{"english":"You don't know that. I've barely worked a year.","focus":"you don't know that","notes":["<code>You don't know that.</code>: 그건 아직 모르는 일이야","<code>barely worked a year</code>: 일한 지 겨우 1년 정도밖에 안 됐다"],"chunks":["<code>I've barely + 과거분사</code> 겨우 ...했을 뿐이야."],"translation":"그건 모르는 일이야. 나 일한 지 겨우 1년밖에 안 됐어."},{"english":"Why do you think Catherine spent so much time training you?\nGod, you make me sound like a pet.","focus":"why do you think","notes":["<code>Why do you think ...?</code>: 왜 ...라고 생각해? / ...인 이유가 뭐겠어?","<code>make me sound like ...</code>: 나를 ...처럼 들리게 만들다"],"chunks":["<code>You make me sound like ...</code> 네 말은 내가 ...인 것처럼 들리게 해."],"translation":"Catherine이 왜 그렇게 많은 시간을 들여 널 훈련시켰겠어? 세상에, 네 말 들으면 내가 애완동물 같잖아."},{"english":"Stop it, both of you. Alex is doing great at work.\nShe's entirely ready for what's ahead.","focus":"ready for what's ahead","notes":["<code>Stop it, both of you.</code>: 둘 다 그만해","<code>do great at work</code>: 직장에서 잘하다","<code>what's ahead</code>: 앞으로 닥칠 일, 앞으로의 상황"],"chunks":["<code>be ready for what's ahead</code> 앞으로의 일을 맞을 준비가 되어 있다."],"translation":"둘 다 그만해. Alex는 회사에서 아주 잘하고 있어. 앞으로의 일도 충분히 감당할 준비가 되어 있어."},{"english":"Hello, everyone. Apologies for being late.\nI'd just like to say how truly sorry I am for your loss.","focus":"condolences","notes":["<code>Apologies for being late.</code>: 늦어서 죄송합니다","<code>I'm sorry for your loss.</code>: 상을 당한 사람에게 전하는 애도 표현"],"chunks":["<code>I'd just like to say ...</code> ...라고 말씀드리고 싶습니다."],"translation":"여러분, 안녕하세요. 늦어서 죄송합니다. 진심으로 애도의 말씀을 드리고 싶습니다."},{"english":"Uh, who are you exactly?","focus":"exactly","notes":["<code>exactly</code>: 정확히; 질문에서 의아함이나 불편함을 더함"],"chunks":["<code>Who are you exactly?</code> 정확히 누구시죠?"],"translation":"어, 정확히 누구신데요?"},{"english":"My name is Brad Ackerman.\nI worked with your mother on the final draft of her will.","focus":"work with / will","notes":["<code>work with</code>: ...와 함께 일하다","<code>final draft</code>: 최종 초안","<code>will</code>: 유언장"],"chunks":["<code>I worked with ... on ...</code> ...와 함께 ... 작업을 했습니다."],"translation":"제 이름은 Brad Ackerman입니다. 어머니의 유언장 최종본 작업을 함께했습니다."},{"english":"Where's old man Sullivan? Mr. Sullivan is in his office.","focus":"old man / in his office","notes":["<code>old man</code>: 나이 든 남자를 가리키는 아주 편한 표현; 상황에 따라 무례할 수 있음","<code>in his office</code>: 사무실에 있다"],"chunks":["<code>Where's + 사람?</code> ...은 어디 있어요?"],"translation":"Sullivan 영감은 어디 있어요? Sullivan 씨는 사무실에 계십니다."},{"english":"Um, it's Brad, right? I'm sorry, but are you even a partner here?","focus":"I'm sorry, but","notes":["<code>It's Brad, right?</code>: Brad 맞죠?","<code>I'm sorry, but ...</code>: 미안하지만 ...; 불편한 말을 꺼낼 때 완충하는 표현","<code>even</code>: 심지어, 정말로의 뉘앙스"],"chunks":["<code>Are you even ...?</code> 당신이 정말 ...이긴 해요?"],"translation":"음, Brad 맞죠? 미안하지만, 여기 파트너 변호사이긴 해요?"},{"english":"I'm an associate partner. Maybe we should ask to see his law degree.","focus":"associate partner / should","notes":["<code>associate partner</code>: 준파트너, 협력 파트너급 직함","<code>law degree</code>: 법학 학위"],"chunks":["<code>Maybe we should + 동사</code> 우리 ...해야 할지도 몰라."],"translation":"저는 어소시에이트 파트너입니다. 그의 법학 학위를 보여달라고 해야 할지도 모르겠네."},{"english":"You must be Alex. And let me guess, Julian, Catherine, Lucas, and Zoe.\nCongratulations on the birth of your daughter, Emma. Thank you.","focus":"must be / let me guess","notes":["<code>You must be ...</code>: 당신이 ...이겠군요","<code>Let me guess</code>: 맞혀 볼게요","<code>Congratulations on ...</code>: ...을 축하합니다"],"chunks":["<code>Congratulations on the birth of ...</code> ...의 탄생을 축하합니다."],"translation":"당신이 Alex겠군요. 그리고 맞혀 볼게요, Julian, Catherine, Lucas, Zoe. 따님 Emma의 탄생을 축하드립니다. 감사합니다."},{"english":"Your mother was an amazing woman.\nEven when she was sick, she was so strong and funny,\nand, I don't know if this makes any sense, present in everything that she said and did.","focus":"make sense / present","notes":["<code>Even when ...</code>: ...할 때조차도","<code>make sense</code>: 말이 되다, 이해되다","<code>present</code>: 여기서는 순간에 온전히 깨어 있고 진심으로 함께하는 느낌"],"chunks":["<code>I don't know if this makes any sense</code> 이 말이 말이 될지 모르겠지만."],"translation":"어머니는 정말 대단한 분이셨습니다. 아프셨을 때조차도 강하고 유머가 있으셨고, 이 말이 말이 될지 모르겠지만, 말과 행동 하나하나에 온전히 깨어 있는 분이셨어요."},{"english":"I'm honored she chose me to be the executor of her estate.\nShall we begin?","focus":"executor / shall we","notes":["<code>I'm honored</code>: 영광입니다","<code>executor of her estate</code>: 유산 집행인","<code>Shall we begin?</code>: 시작할까요?"],"chunks":["<code>I'm honored + 문장</code> ...해서 영광입니다."],"translation":"그분이 저를 유산 집행인으로 선택해 주셔서 영광입니다. 시작할까요?"},{"english":"\"I, Elizabeth Rose, a resident of Brooklyn, New York, and a citizen of the United States, declare this to be my final will.\" \nThis is so weird.","focus":"legal wording","notes":["<code>resident</code>: 거주자","<code>citizen</code>: 시민, 국민","<code>declare this to be ...</code>: 이것을 ...로 선언하다"],"chunks":["<code>This is so weird.</code> 이거 너무 이상해."],"translation":"“나 Elizabeth Rose는 뉴욕 브루클린 거주자이자 미국 시민으로서, 이것이 나의 최종 유언장임을 선언한다.” 이거 너무 이상해."},{"english":"\"To Julian, I leave my Loeb edition of Plato's works.\"\n\"A gentle reminder that he may not always be the smartest person in the room.\"","focus":"leave / reminder","notes":["<code>leave A to B</code>: A를 B에게 남기다, 유산으로 주다","<code>a gentle reminder</code>: 부드러운 상기, 은근한 reminder","<code>may not always</code>: 항상 ...인 것은 아닐 수 있다"],"chunks":["<code>the smartest person in the room</code> 그 자리에서 가장 똑똑한 사람"],"translation":"“Julian에게는 내 Loeb판 플라톤 저작집을 남긴다.” “그가 항상 방 안에서 가장 똑똑한 사람은 아닐 수 있다는 부드러운 reminder로.”"},{"english":"\"The Tamayo painting, an evocative reminder of the heritage of our family, I leave to Zoe.\"\n\"She can share it with Lucas, as long as he never leaves her.\"\nI would never. ","focus":"as long as / leave","notes":["<code>evocative</code>: 강한 기억이나 감정을 불러일으키는","<code>heritage</code>: 유산, 전통","<code>as long as</code>: ...하기만 한다면","<code>I would never.</code>: 절대 안 그래"],"chunks":["<code>share it with + 사람</code> ...와 그것을 함께 쓰다/나누다."],"translation":"“우리 가족의 유산을 떠올리게 하는 Tamayo 그림은 Zoe에게 남긴다.” “Lucas가 절대 그녀를 떠나지 않는 한, Zoe는 그와 함께 나눠도 된다.” 절대 안 그래요."},{"english":"Next is your mother's house.\n\"It is my wish that neither the house nor its contents be sold or leased for 12 months.\"","focus":"neither nor","notes":["<code>It is my wish that ...</code>: ...이 나의 바람이다","<code>neither A nor B</code>: A도 B도 아니다","<code>leased</code>: 임대된"],"chunks":["<code>neither the house nor its contents</code> 집도 그 안의 물건들도"],"translation":"다음은 어머니의 집입니다. “집과 그 안의 물건 어느 것도 12개월 동안 팔거나 임대하지 않기를 바란다.”"},{"english":"\"My children may inhabit the home during this time, but for no longer than 90 consecutive days.\"","focus":"may / consecutive","notes":["<code>may</code>: ...해도 된다, 허가를 나타냄","<code>inhabit</code>: 거주하다","<code>consecutive</code>: 연속적인"],"chunks":["<code>no longer than ...</code> ...보다 길지 않게, 최대 ...까지만"],"translation":"“내 자녀들은 이 기간 동안 그 집에 거주할 수 있으나, 연속 90일을 넘겨서는 안 된다.”"},{"english":"Whoa, sorry to interrupt. Did our mother explain why she wanted us to keep the house?","focus":"sorry to interrupt","notes":["<code>Sorry to interrupt.</code>: 끼어들어서 죄송합니다","<code>explain why ...</code>: 왜 ...인지 설명하다","<code>keep the house</code>: 집을 유지하다, 처분하지 않다"],"chunks":["<code>Did ... explain why ...?</code> ...가 왜 ...인지 설명했나요?"],"translation":"잠깐만요, 끼어들어서 죄송한데요. 어머니가 왜 우리가 집을 유지하길 원했는지 설명하셨나요?"},{"english":"I wish we could keep it forever. The house is Mom. It's our history.","focus":"I wish we could","notes":["<code>I wish we could ...</code>: 우리가 ...할 수 있으면 좋겠어","<code>The house is Mom.</code>: 집이 곧 엄마라는 감정적 표현","<code>history</code>: 여기서는 가족의 추억과 역사"],"chunks":["<code>I wish we could keep it forever.</code> 영원히 간직할 수 있으면 좋겠어."],"translation":"우리가 영원히 간직할 수 있으면 좋겠어. 그 집은 엄마야. 우리 역사라고."},{"english":"Yeah, that's sweet, Alex. Do you know what the taxes are?","focus":"that's sweet / taxes","notes":["<code>That's sweet.</code>: 다정한 말이네; 문맥에 따라 살짝 빈정거릴 수도 있음","<code>taxes</code>: 세금"],"chunks":[],"translation":"그래, 다정한 말이네, Alex. 세금이 얼마인지 알아?"},{"english":"Brad, are you sure she understood how expensive this will be?\nIn fact, she made provisions to cover any costs.","focus":"are you sure / provisions","notes":["<code>Are you sure ...?</code>: ...이 확실해요?","<code>make provisions</code>: 대비책을 마련하다, 필요한 조치를 해두다","<code>cover costs</code>: 비용을 충당하다"],"chunks":["<code>In fact</code> 사실은, 실제로는"],"translation":"Brad, 어머니가 이게 얼마나 비쌀지 정말 이해하신 게 맞나요? 사실, 비용을 충당할 대비책을 마련해 두셨습니다."},{"english":"Shall we move on to Rose Cosmetics?\n\"My children's shares of Rose Cosmetics will stay at 20%.\"","focus":"move on to / shares","notes":["<code>move on to</code>: 다음 주제로 넘어가다","<code>shares</code>: 주식, 지분","<code>stay at</code>: ...에 머무르다, 그대로 유지되다"],"chunks":["<code>Shall we move on to ...?</code> ...로 넘어갈까요?"],"translation":"Rose Cosmetics로 넘어갈까요? “내 자녀들의 Rose Cosmetics 지분은 20%로 유지된다.”"},{"english":"\"The remaining shares and title of CEO will go to my daughter-in-law, Catherine Williams Rose.\"","focus":"remaining / go to","notes":["<code>remaining</code>: 남아 있는","<code>title of CEO</code>: CEO 직함","<code>go to</code>: 유산이나 권리가 ...에게 돌아가다","<code>daughter-in-law</code>: 며느리"],"chunks":["<code>The remaining ... will go to ...</code> 남은 ...은 ...에게 돌아간다."],"translation":"“남은 지분과 CEO 직함은 내 며느리 Catherine Williams Rose에게 돌아간다.”"},{"english":"Wait, what? Your mother's remaining shares of Rose Cosmetics\nwill go to your sister-in-law, Catherine.","focus":"wait what / sister-in-law","notes":["<code>Wait, what?</code>: 잠깐, 뭐라고?","<code>sister-in-law</code>: 형수, 제수, 시누이 등 결혼으로 맺어진 자매 관계"],"chunks":["<code>will go to + 사람</code> ...에게 돌아갈 것이다."],"translation":"잠깐, 뭐라고요? 어머니의 Rose Cosmetics 남은 지분은 당신의 올케/형수인 Catherine에게 돌아갑니다."},{"english":"Her last directive is that Catherine appoint a new head of marketing.\nBut I'm head of marketing. ","focus":"directive / appoint","notes":["<code>directive</code>: 지시, 명령","<code>appoint</code>: 임명하다","<code>head of marketing</code>: 마케팅 책임 ve changed.","focus":"who I was / obviously","notes":["<code>Who I was.</code>: 지금의 내가 아니라 예전의 나라는 반박","<code>obviously</code>: 당연히, 분명히","<code>have changed</code>: 변했다"],"chunks":["<code>I was 13 when ...</code> ...했을 때 나는 13살이었어."],"translation":"내가 어떤 사람이었는지를 보여주는 거겠지. 그걸 썼을 때 나는 13살이었어. 그리고 물론 네가 변했다는 건 알아."},{"english":"Oh my God, it's like she's listening to me.","focus":"it's like","notes":["<code>It's like ...</code>: 마치 ...같아","<code>listen to me</code>: 내 말을 듣다"],"chunks":["<code>It's like she's ...</code> 마치 그녀가 ...하는 것 같아."],"translation":"세상에, 마치 엄마가 내 말을 듣고 있는 것 같아."},{"english":"And I think that's my concern, is that I don't know that you have replaced this with anything.\nI wonder, have you given up your dreams and your aspirations? Your goals?","focus":"concern / give up","notes":["<code>concern</code>: 걱정, 우려","<code>replace A with B</code>: A를 B로 대체하다","<code>give up</code>: 포기하다","<code>aspirations</code>: 열망, 포부"],"chunks":["<code>I wonder, have you ...?</code> 궁금하구나, 네가 ...한 건 아닐까?"],"translation":"그리고 그게 내 걱정이야. 네가 이것을 다른 무엇으로 대체했는지 모르겠거든. 궁금해. 너는 꿈과 포부를 포기한 걸까? 네 목표들을?"},{"english":"And don't tell me Rose Cosmetics, because I feel like I gave you this cozy job that allowed you to run away from who you really are.","focus":"don't tell me / allow","notes":["<code>Don't tell me ...</code>: ...라고 말하지는 마","<code>cozy job</code>: 편하고 안락한 일자리","<code>allow someone to + 동사</code>: 사람이 ...할 수 있게 해주다","<code>run away from</code>: ...로부터 도망치다"],"chunks":["<code>who you really are</code> 네 진짜 모습"],"translation":"그리고 Rose Cosmetics라고 말하진 마. 내가 너에게 편한 일자리를 줘서 네 진짜 모습으로부터 도망칠 수 있게 해준 것 같거든."},{"english":"Thanks a lot.","focus":"sarcastic thanks","notes":["<code>Thanks a lot.</code>: 문자 그대로는 ‘정말 고마워’; 문맥에 따라 빈정거리는 말"],"chunks":[],"translation":"참 고맙네."},{"english":"So okay, let's look at the list.\n\"Help people and make a difference.\"\n\"Be a great teacher.\"\nAlex, you are a born teacher.","focus":"make a difference / born","notes":["<code>make a difference</code>: 좋은 변화를 만들다, 의미 있는 영향을 주다","<code>a born teacher</code>: 타고난 선생님"],"chunks":["<code>Let's look at ...</code> ...을 한번 보자.","<code>You are a born ...</code> 너는 타고난 ...야."],"translation":"그래, 리스트를 한번 보자. “사람들을 돕고 변화를 만들기.” “훌륭한 선생님 되기.” Alex, 너는 타고난 선생님이야."},{"english":"Okay, \"learn to drive, get a tattoo.\"\nYou can skip those, please, dear God.\nMy one request \"Find true love.\"\nWhy do I have a horrible feeling you've given up on that too?","focus":"skip / give up on","notes":["<code>learn to drive</code>: 운전을 배우다","<code>get a tattoo</code>: 문신을 하다","<code>skip</code>: 건너뛰다","<code>give up on + 명사</code>: ...을 포기하다"],"chunks":["<code>My one request</code> 내 한 가지 부탁","<code>Why do I have a horrible feeling ...?</code> 왜 ...일 것 같은 불길한 예감이 들지?"],"translation":"좋아, “운전 배우기, 문신하기.” 제발, 그것들은 건너뛰어도 돼. 내 한 가지 부탁은 “진정한 사랑 찾기.” 왜 그것마저 포기한 것 같은 불길한 느낌이 들까?"},{"english":"That's not fair.","focus":"not fair","notes":["<code>That's not fair.</code>: 그건 공평하지 않아, 그렇게 말하면 안 되지"],"chunks":[],"translation":"그건 불공평해."},{"english":"I want you to know how incredible you are.\nI want you to live your best life.\nYou have to get yourself out of this hole you're in.","focus":"want someone to / hole","notes":["<code>I want you to know ...</code>: 네가 ...을 알았으면 해","<code>live your best life</code>: 가장 자기답고 충만한 삶을 살다","<code>get yourself out of this hole</code>: 지금 빠진 구덩이 같은 상황에서 스스로 빠져나오다"],"chunks":["<code>You have to get yourself out of ...</code> 너는 ...에서 빠져나와야 해."],"translation":"네가 얼마나 대단한 사람인지 알았으면 해. 네 최고의 삶을 살았으면 해. 네가 빠져 있는 이 구덩이에서 스스로 빠져나와야 해."},{"english":"I'm not in a hole. ","focus":"denial","notes":["<code>be in a hole</code>: 곤란하거나 막힌 상황에 처해 있다"],"chunks":["<code>I'm not in ...</code> 나는 ...에 있는 게 아니야."],"translation":"나 구덩이에 빠진 거 아니야."},{"english":"I'm sorry, that's not up for discussion.\nI'm not gonna be around to dig you out, but I can sure as hell leave you a shovel.","focus":"not up for discussion","notes":["<code>not up for discussion</code>: 논의 대상이 아니다","<code>be around</code>: 곁에 있다","<code>dig someone out</code>: 곤란한 상황에서 꺼내 주다","<code>sure as hell</code>: 정말로, 반드시; 강한 구어체"],"chunks":["<code>That's not up for discussion.</code> 그건 논의할 문제가 아니야.","<code>leave you a shovel</code> 네가 빠져나올 삽은 남겨줄 수 있어."],"translation":"미안하지만 그건 논의할 문제가 아니야. 내가 곁에 있으면서 널 파내 줄 수는 없겠지만, 삽 하나쯤은 확실히 남겨줄 수 있어."},{"english":"I want you to complete this list, Bean. Hold on.\nMom, you can't just say that and..","focus":"complete / can't just","notes":["<code>complete this list</code>: 이 목록을 완수하다","<code>Hold on.</code>: 잠깐만","<code>You can't just say that</code>: 그런 말을 그냥 해버리면 안 되지"],"chunks":["<code>I want you to complete ...</code> 네가 ...을 완수했으면 해."],"translation":"Bean, 네가 이 리스트를 완수했으면 해. 잠깐만. 엄마, 그렇게 말만 하고..."},{"english":"Okay. Every time you check off something from the list,\nBrad is going to give you one of these DVDs, which I am going to record.","focus":"every time / check off","notes":["<code>every time</code>: ...할 때마다","<code>check off</code>: 목록에서 완료 표시를 하다","<code>one of these DVDs</code>: 이 DVD들 중 하나","<code>which</code>: 앞의 DVDs를 받아 추가 설명"],"chunks":["<code>Every time you + 동사</code> 네가 ...할 때마다"],"translation":"좋아. 네가 리스트에서 하나를 해낼 때마다 Brad가 내가 녹화해 둘 이 DVD들 중 하나를 줄 거야."},{"english":"And once the list is completely finished, you will get this envelope.\nBut the clock is ticking. The list has to be finished by New Year's.\nOtherwise, no envelope.","focus":"once / by / otherwise","notes":["<code>once + 문장</code>: 일단 ...하면","<code>the clock is ticking</code>: 시간이 가고 있다, 시간이 얼마 없다","<code>by New Year's</code>: 새해 전까지, 새해가 되기 전까지","<code>otherwise</code>: 그렇지 않으면"],"chunks":["<code>has to be finished by ...</code> ...까지 끝나야 한다."],"translation":"그리고 리스트가 완전히 끝나면 이 봉투를 받게 될 거야. 하지만 시간은 흐르고 있어. 리스트는 새해 전까지 끝내야 해. 그렇지 않으면 봉투는 없어."},{"english":"Oh my God, I can't believe this.","focus":"can't believe","notes":["<code>I can't believe this.</code>: 이게 믿기지 않아, 말도 안 돼"],"chunks":[],"translation":"세상에, 이걸 믿을 수가 없어."},{"english":"I'm not screwing around, Bean. This is serious business.\nThis is your life. And I love you.\nSee you on the next DVD.","focus":"serious business","notes":["<code>screw around</code>: 장난치다, 허튼짓하다; 매우 편한 표현","<code>serious business</code>: 진지한 일, 중요한 문제","<code>See you on ...</code>: ...에서 보자"],"chunks":["<code>I'm not screwing around.</code> 나 장난치는 거 아니야.","<code>This is your life.</code> 이건 네 인생이야."],"translation":"Bean, 나 장난치는 거 아니야. 이건 진지한 일이야. 이건 네 인생이야. 그리고 사랑해. 다음 DVD에서 보자."}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 2:</strong> 09:20 이후 장례식과 유언장 공개 장면부터 Alex가 엄마의 DVD 메시지를 확인하는 장면까지, 사용자가 제공한 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      const body = rows
        ? '<section class="grid" aria-label="Sentence study table">' + rows + '</section>'
        : '<section class="empty">Section 2 대사 원문을 보내주면, Section 1과 같은 형식으로 번호, 해석, 문법, 활용 표현을 정리합니다.</section>';
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 2 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
</body>

<!doctype html>

  <meta charset="utf-8">

  <title>The Life List - Section 2 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:21px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .empty { margin-top:18px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:none; }
    .site-nav a:hover { text-decoration:underline; }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english":"Ready to make an appearance?\nGonna be okay?","focus":"make an appearance / gonna","notes":["<code>make an appearance</code>: 모습을 드러내다, 사람들 앞에 나오다","<code>Gonna</code>: <code>going to</code>의 편한 구어체"],"chunks":["<code>Ready to + 동사?</code> ...할 준비 됐어?","<code>Gonna be okay?</code> 괜찮겠어?"],"translation":"사람들 앞에 나갈 준비 됐어? 괜찮겠어?"},{"english":"Hi, Sam. It's good to see you. Really is.","focus":"greeting / emphasis","notes":["<code>It's good to see you.</code>: 만나서 반갑다는 따뜻한 인사","<code>Really is.</code>: 앞 문장의 <code>It is</code>를 줄여 진심을 강조"],"chunks":["<code>It's good to see you.</code> 만나서 반가워요."],"translation":"안녕하세요, Sam. 만나서 정말 반가워요. 진심이에요."},{"english":"Don't you think it's surreal?\nHow do you mean?","focus":"asking what someone means","notes":["<code>surreal</code>: 비현실적인, 꿈같은","<code>How do you mean?</code>: 무슨 뜻이야? 어떻게 그런 말이야?"],"chunks":["<code>Don't you think ...?</code> ...라고 생각하지 않아?","<code>How do you mean?</code> 무슨 뜻이야?"],"translation":"이 상황이 너무 비현실적이지 않아? 무슨 뜻이야?"},{"english":"All of these people here except the one person who's supposed to be.","focus":"except / be supposed to","notes":["<code>except</code>: ...을 제외하고","<code>be supposed to + 동사</code>: ...하기로 되어 있다, ...해야 한다"],"chunks":["<code>the one person who's supposed to be here</code> 여기 있어야 할 단 한 사람"],"translation":"여기 이렇게 많은 사람들이 있는데, 정작 있어야 할 단 한 사람만 없잖아."},{"english":"I keep expecting her to walk out of the kitchen and tell me to stop slouching.\nI didn't know Dad was gonna be here.","focus":"keep -ing / tell someone to","notes":["<code>keep + -ing</code>: 계속 ...하다","<code>tell + 사람 + to + 동사</code>: 사람에게 ...하라고 말하다","<code>slouch</code>: 구부정하게 앉거나 서다"],"chunks":["<code>I keep expecting ...</code> 자꾸 ...할 것만 같아.","<code>I didn't know ... was gonna be here.</code> ...가 여기 올 줄 몰랐어."],"translation":"엄마가 주방에서 걸어 나와서 구부정하게 있지 말라고 할 것만 같아. 아빠가 여기 올 줄은 몰랐어."},{"english":"They were married for 20 years, most of them, happy.\nOf course he was gonna be there.\nWhatever.","focus":"of course / whatever","notes":["<code>for 20 years</code>: 20년 동안","<code>Of course</code>: 당연히","<code>Whatever.</code>: 됐어, 아무래도 상관없어처럼 대화를 밀어내는 말"],"chunks":["<code>Of course + 문장</code> 당연히 ...이지."],"translation":"두 분은 20년 동안 결혼 생활을 했고, 그 대부분은 행복했어. 당연히 아빠도 와야지. 됐어."},{"english":"I just hate when he talks as if the divorce was some kind of mutual decision.\nLike, bro, he left her. I hope your mom was clear about dividing stuff up.","focus":"as if / mutual decision","notes":["<code>as if</code>: 마치 ...인 것처럼","<code>mutual decision</code>: 서로 합의한 결정","<code>divide stuff up</code>: 물건이나 재산을 나누다"],"chunks":["<code>I hate when ...</code> ...할 때 정말 싫어.","<code>I hope ... was clear about ...</code> ...에 대해 분명히 해뒀으면 좋겠어."],"translation":"아빠가 이혼이 무슨 서로 합의한 결정이었던 것처럼 말할 때 정말 싫어. 아니, 형, 아빠가 엄마를 떠난 거잖아. 너희 엄마가 물건 나누는 문제를 분명히 해뒀길 바라."},{"english":"You don't wanna be like the Nelsons.\nThey don't talk to each other anymore.","focus":"wanna / anymore","notes":["<code>wanna</code>: <code>want to</code>의 편한 구어체","<code>not ... anymore</code>: 더 이상 ...하지 않다"],"chunks":["<code>You don't wanna be like ...</code> ...처럼 되고 싶진 않잖아."],"translation":"Nelson 가족처럼 되고 싶진 않잖아. 그 사람들은 이제 서로 말도 안 해."},{"english":"Agreed. As long as I get the Tamayo painting in the front hall.","focus":"as long as","notes":["<code>Agreed.</code>: 동의해","<code>as long as</code>: ...하기만 한다면","<code>front hall</code>: 현관 홀, 앞쪽 복도"],"chunks":["<code>As long as I get ...</code> 내가 ...만 받을 수 있다면."],"translation":"동의해. 현관 홀에 있는 Tamayo 그림만 내가 받는다면."},{"english":"God, Mom's barely been gone a week, and all you can talk about is her stuff?\nThat's easy for you to say. You're inheriting the company.","focus":"barely / inherit","notes":["<code>barely</code>: 겨우, 간신히; 여기서는 ‘고작’의 느낌","<code>inherit</code>: 상속받다"],"chunks":["<code>all you can talk about is ...</code> 네가 말하는 건 온통 ...뿐이야.","<code>That's easy for you to say.</code> 너야 그렇게 말하기 쉽지."],"translation":"세상에, 엄마가 돌아가신 지 고작 일주일도 안 됐는데 엄마 물건 얘기밖에 못 해? 너야 그렇게 말하기 쉽지. 넌 회사를 물려받을 거잖아."},{"english":"You don't know that. I've barely worked a year.","focus":"you don't know that","notes":["<code>You don't know that.</code>: 그건 아직 모르는 일이야","<code>barely worked a year</code>: 일한 지 겨우 1년 정도밖에 안 됐다"],"chunks":["<code>I've barely + 과거분사</code> 겨우 ...했을 뿐이야."],"translation":"그건 모르는 일이야. 나 일한 지 겨우 1년밖에 안 됐어."},{"english":"Why do you think Catherine spent so much time training you?\nGod, you make me sound like a pet.","focus":"why do you think","notes":["<code>Why do you think ...?</code>: 왜 ...라고 생각해? / ...인 이유가 뭐겠어?","<code>make me sound like ...</code>: 나를 ...처럼 들리게 만들다"],"chunks":["<code>You make me sound like ...</code> 네 말은 내가 ...인 것처럼 들리게 해."],"translation":"Catherine이 왜 그렇게 많은 시간을 들여 널 훈련시켰겠어? 세상에, 네 말 들으면 내가 애완동물 같잖아."},{"english":"Stop it, both of you. Alex is doing great at work.\nShe's entirely ready for what's ahead.","focus":"ready for what's ahead","notes":["<code>Stop it, both of you.</code>: 둘 다 그만해","<code>do great at work</code>: 직장에서 잘하다","<code>what's ahead</code>: 앞으로 닥칠 일, 앞으로의 상황"],"chunks":["<code>be ready for what's ahead</code> 앞으로의 일을 맞을 준비가 되어 있다."],"translation":"둘 다 그만해. Alex는 회사에서 아주 잘하고 있어. 앞으로의 일도 충분히 감당할 준비가 되어 있어."},{"english":"Hello, everyone. Apologies for being late.\nI'd just like to say how truly sorry I am for your loss.","focus":"condolences","notes":["<code>Apologies for being late.</code>: 늦어서 죄송합니다","<code>I'm sorry for your loss.</code>: 상을 당한 사람에게 전하는 애도 표현"],"chunks":["<code>I'd just like to say ...</code> ...라고 말씀드리고 싶습니다."],"translation":"여러분, 안녕하세요. 늦어서 죄송합니다. 진심으로 애도의 말씀을 드리고 싶습니다."},{"english":"Uh, who are you exactly?","focus":"exactly","notes":["<code>exactly</code>: 정확히; 질문에서 의아함이나 불편함을 더함"],"chunks":["<code>Who are you exactly?</code> 정확히 누구시죠?"],"translation":"어, 정확히 누구신데요?"},{"english":"My name is Brad Ackerman.\nI worked with your mother on the final draft of her will.","focus":"work with / will","notes":["<code>work with</code>: ...와 함께 일하다","<code>final draft</code>: 최종 초안","<code>will</code>: 유언장"],"chunks":["<code>I worked with ... on ...</code> ...와 함께 ... 작업을 했습니다."],"translation":"제 이름은 Brad Ackerman입니다. 어머니의 유언장 최종본 작업을 함께했습니다."},{"english":"Where's old man Sullivan? Mr. Sullivan is in his office.","focus":"old man / in his office","notes":["<code>old man</code>: 나이 든 남자를 가리키는 아주 편한 표현; 상황에 따라 무례할 수 있음","<code>in his office</code>: 사무실에 있다"],"chunks":["<code>Where's + 사람?</code> ...은 어디 있어요?"],"translation":"Sullivan 영감은 어디 있어요? Sullivan 씨는 사무실에 계십니다."},{"english":"Um, it's Brad, right? I'm sorry, but are you even a partner here?","focus":"I'm sorry, but","notes":["<code>It's Brad, right?</code>: Brad 맞죠?","<code>I'm sorry, but ...</code>: 미안하지만 ...; 불편한 말을 꺼낼 때 완충하는 표현","<code>even</code>: 심지어, 정말로의 뉘앙스"],"chunks":["<code>Are you even ...?</code> 당신이 정말 ...이긴 해요?"],"translation":"음, Brad 맞죠? 미안하지만, 여기 파트너 변호사이긴 해요?"},{"english":"I'm an associate partner. Maybe we should ask to see his law degree.","focus":"associate partner / should","notes":["<code>associate partner</code>: 준파트너, 협력 파트너급 직함","<code>law degree</code>: 법학 학위"],"chunks":["<code>Maybe we should + 동사</code> 우리 ...해야 할지도 몰라."],"translation":"저는 어소시에이트 파트너입니다. 그의 법학 학위를 보여달라고 해야 할지도 모르겠네."},{"english":"You must be Alex. And let me guess, Julian, Catherine, Lucas, and Zoe.\nCongratulations on the birth of your daughter, Emma. Thank you.","focus":"must be / let me guess","notes":["<code>You must be ...</code>: 당신이 ...이겠군요","<code>Let me guess</code>: 맞혀 볼게요","<code>Congratulations on ...</code>: ...을 축하합니다"],"chunks":["<code>Congratulations on the birth of ...</code> ...의 탄생을 축하합니다."],"translation":"당신이 Alex겠군요. 그리고 맞혀 볼게요, Julian, Catherine, Lucas, Zoe. 따님 Emma의 탄생을 축하드립니다. 감사합니다."},{"english":"Your mother was an amazing woman.\nEven when she was sick, she was so strong and funny,\nand, I don't know if this makes any sense, present in everything that she said and did.","focus":"make sense / present","notes":["<code>Even when ...</code>: ...할 때조차도","<code>make sense</code>: 말이 되다, 이해되다","<code>present</code>: 여기서는 순간에 온전히 깨어 있고 진심으로 함께하는 느낌"],"chunks":["<code>I don't know if this makes any sense</code> 이 말이 말이 될지 모르겠지만."],"translation":"어머니는 정말 대단한 분이셨습니다. 아프셨을 때조차도 강하고 유머가 있으셨고, 이 말이 말이 될지 모르겠지만, 말과 행동 하나하나에 온전히 깨어 있는 분이셨어요."},{"english":"I'm honored she chose me to be the executor of her estate.\nShall we begin?","focus":"executor / shall we","notes":["<code>I'm honored</code>: 영광입니다","<code>executor of her estate</code>: 유산 집행인","<code>Shall we begin?</code>: 시작할까요?"],"chunks":["<code>I'm honored + 문장</code> ...해서 영광입니다."],"translation":"그분이 저를 유산 집행인으로 선택해 주셔서 영광입니다. 시작할까요?"},{"english":"\"I, Elizabeth Rose, a resident of Brooklyn, New York, and a citizen of the United States, declare this to be my final will.\" \nThis is so weird.","focus":"legal wording","notes":["<code>resident</code>: 거주자","<code>citizen</code>: 시민, 국민","<code>declare this to be ...</code>: 이것을 ...로 선언하다"],"chunks":["<code>This is so weird.</code> 이거 너무 이상해."],"translation":"“나 Elizabeth Rose는 뉴욕 브루클린 거주자이자 미국 시민으로서, 이것이 나의 최종 유언장임을 선언한다.” 이거 너무 이상해."},{"english":"\"To Julian, I leave my Loeb edition of Plato's works.\"\n\"A gentle reminder that he may not always be the smartest person in the room.\"","focus":"leave / reminder","notes":["<code>leave A to B</code>: A를 B에게 남기다, 유산으로 주다","<code>a gentle reminder</code>: 부드러운 상기, 은근한 reminder","<code>may not always</code>: 항상 ...인 것은 아닐 수 있다"],"chunks":["<code>the smartest person in the room</code> 그 자리에서 가장 똑똑한 사람"],"translation":"“Julian에게는 내 Loeb판 플라톤 저작집을 남긴다.” “그가 항상 방 안에서 가장 똑똑한 사람은 아닐 수 있다는 부드러운 reminder로.”"},{"english":"\"The Tamayo painting, an evocative reminder of the heritage of our family, I leave to Zoe.\"\n\"She can share it with Lucas, as long as he never leaves her.\"\nI would never. ","focus":"as long as / leave","notes":["<code>evocative</code>: 강한 기억이나 감정을 불러일으키는","<code>heritage</code>: 유산, 전통","<code>as long as</code>: ...하기만 한다면","<code>I would never.</code>: 절대 안 그래"],"chunks":["<code>share it with + 사람</code> ...와 그것을 함께 쓰다/나누다."],"translation":"“우리 가족의 유산을 떠올리게 하는 Tamayo 그림은 Zoe에게 남긴다.” “Lucas가 절대 그녀를 떠나지 않는 한, Zoe는 그와 함께 나눠도 된다.” 절대 안 그래요."},{"english":"Next is your mother's house.\n\"It is my wish that neither the house nor its contents be sold or leased for 12 months.\"","focus":"neither nor","notes":["<code>It is my wish that ...</code>: ...이 나의 바람이다","<code>neither A nor B</code>: A도 B도 아니다","<code>leased</code>: 임대된"],"chunks":["<code>neither the house nor its contents</code> 집도 그 안의 물건들도"],"translation":"다음은 어머니의 집입니다. “집과 그 안의 물건 어느 것도 12개월 동안 팔거나 임대하지 않기를 바란다.”"},{"english":"\"My children may inhabit the home during this time, but for no longer than 90 consecutive days.\"","focus":"may / consecutive","notes":["<code>may</code>: ...해도 된다, 허가를 나타냄","<code>inhabit</code>: 거주하다","<code>consecutive</code>: 연속적인"],"chunks":["<code>no longer than ...</code> ...보다 길지 않게, 최대 ...까지만"],"translation":"“내 자녀들은 이 기간 동안 그 집에 거주할 수 있으나, 연속 90일을 넘겨서는 안 된다.”"},{"english":"Whoa, sorry to interrupt. Did our mother explain why she wanted us to keep the house?","focus":"sorry to interrupt","notes":["<code>Sorry to interrupt.</code>: 끼어들어서 죄송합니다","<code>explain why ...</code>: 왜 ...인지 설명하다","<code>keep the house</code>: 집을 유지하다, 처분하지 않다"],"chunks":["<code>Did ... explain why ...?</code> ...가 왜 ...인지 설명했나요?"],"translation":"잠깐만요, 끼어들어서 죄송한데요. 어머니가 왜 우리가 집을 유지하길 원했는지 설명하셨나요?"},{"english":"I wish we could keep it forever. The house is Mom. It's our history.","focus":"I wish we could","notes":["<code>I wish we could ...</code>: 우리가 ...할 수 있으면 좋겠어","<code>The house is Mom.</code>: 집이 곧 엄마라는 감정적 표현","<code>history</code>: 여기서는 가족의 추억과 역사"],"chunks":["<code>I wish we could keep it forever.</code> 영원히 간직할 수 있으면 좋겠어."],"translation":"우리가 영원히 간직할 수 있으면 좋겠어. 그 집은 엄마야. 우리 역사라고."},{"english":"Yeah, that's sweet, Alex. Do you know what the taxes are?","focus":"that's sweet / taxes","notes":["<code>That's sweet.</code>: 다정한 말이네; 문맥에 따라 살짝 빈정거릴 수도 있음","<code>taxes</code>: 세금"],"chunks":["<code>Do you know what ... are?</code> ...가 얼마인지 알아?"],"translation":"그래, 다정한 말이네, Alex. 세금이 얼마인지 알아?"},{"english":"Brad, are you sure she understood how expensive this will be?\nIn fact, she made provisions to cover any costs.","focus":"are you sure / provisions","notes":["<code>Are you sure ...?</code>: ...이 확실해요?","<code>make provisions</code>: 대비책을 마련하다, 필요한 조치를 해두다","<code>cover costs</code>: 비용을 충당하다"],"chunks":["<code>In fact</code> 사실은, 실제로는"],"translation":"Brad, 어머니가 이게 얼마나 비쌀지 정말 이해하신 게 맞나요? 사실, 비용을 충당할 대비책을 마련해 두셨습니다."},{"english":"Shall we move on to Rose Cosmetics?\n\"My children's shares of Rose Cosmetics will stay at 20%.\"","focus":"move on to / shares","notes":["<code>move on to</code>: 다음 주제로 넘어가다","<code>shares</code>: 주식, 지분","<code>stay at</code>: ...에 머무르다, 그대로 유지되다"],"chunks":["<code>Shall we move on to ...?</code> ...로 넘어갈까요?"],"translation":"Rose Cosmetics로 넘어갈까요? “내 자녀들의 Rose Cosmetics 지분은 20%로 유지된다.”"},{"english":"\"The remaining shares and title of CEO will go to my daughter-in-law, Catherine Williams Rose.\"","focus":"remaining / go to","notes":["<code>remaining</code>: 남아 있는","<code>title of CEO</code>: CEO 직함","<code>go to</code>: 유산이나 권리가 ...에게 돌아가다","<code>daughter-in-law</code>: 며느리"],"chunks":["<code>The remaining ... will go to ...</code> 남은 ...은 ...에게 돌아간다."],"translation":"“남은 지분과 CEO 직함은 내 며느리 Catherine Williams Rose에게 돌아간다.”"},{"english":"Wait, what? Your mother's remaining shares of Rose Cosmetics\nwill go to your sister-in-law, Catherine.","focus":"wait what / sister-in-law","notes":["<code>Wait, what?</code>: 잠깐, 뭐라고?","<code>sister-in-law</code>: 형수, 제수, 시누이 등 결혼으로 맺어진 자매 관계"],"chunks":["<code>will go to + 사람</code> ...에게 돌아갈 것이다."],"translation":"잠깐, 뭐라고요? 어머니의 Rose Cosmetics 남은 지분은 당신의 올케/형수인 Catherine에게 돌아갑니다."},{"english":"Her last directive is that Catherine appoint a new head of marketing.\nBut I'm head of marketing. ","focus":"directive / appoint","notes":["<code>directive</code>: 지시, 명령","<code>appoint< -called</code>: 이른바, 소위","<code>get one's affairs in order</code>: 죽음이나 큰일에 대비해 신변·재산 문제를 정리하다"],"chunks":["<code>I know. But ...</code> 알아. 하지만 ..."],"translation":"웃기지 않다는 거 알아. 하지만 설명할게, 알겠지? 지난주에 나는 이른바 내 신변 정리를 하고 있었어."},{"english":"Oh my God, the crap that we hold onto for no apparent reason.\nBut it was actually this amazing life flashback. You know?","focus":"hold onto / flashback","notes":["<code>crap</code>: 잡동사니, 쓸데없는 것들; 거친 편한 표현","<code>hold onto</code>: 붙들고 있다, 버리지 않고 갖고 있다","<code>for no apparent reason</code>: 뚜렷한 이유 없이","<code>flashback</code>: 과거가 떠오르는 순간"],"chunks":["<code>You know?</code> 알지? / 있잖아."],"translation":"세상에, 우리는 뚜렷한 이유도 없이 온갖 잡동사니를 붙들고 있더라. 그런데 그게 정말 놀라운 인생 회상 같은 시간이었어. 알지?"},{"english":"I mean, it was actually a you flashback.\nI got to Look at all this stuff I found. ","focus":"I mean / got to","notes":["<code>I mean</code>: 그러니까, 내 말은","<code>a you flashback</code>: 너에 대한 기억들이 떠오르는 시간이라는 장난스러운 표현","<code>I got to ...</code>: ...하게 되었다"],"chunks":["<code>Look at all this stuff.</code> 이것들 좀 봐."],"translation":"그러니까, 사실은 너에 대한 회상이었어. 내가 보게 됐거든. 내가 찾은 이 물건들 좀 봐."},{"english":"Look, all your finger paintings, report cards.\nBut in the middle of it all, I found this piece of paper.","focus":"in the middle of","notes":["<code>finger paintings</code>: 손가락으로 그린 그림들","<code>report cards</code>: 성적표","<code>in the middle of it all</code>: 그 모든 것들 사이에서"],"chunks":["<code>I found this piece of paper.</code> 이 종이 한 장을 찾았어."],"translation":"봐, 네 손가락 그림들, 성적표들. 그런데 그 모든 것들 사이에서 이 종이 한 장을 찾았어."},{"english":"A life list. Your life list. I love this list.\nThis list is such a reflection of who you are.","focus":"reflection of","notes":["<code>life list</code>: 인생에서 하고 싶은 일들의 목록","<code>a reflection of</code>: ...을 반영하는 것","<code>who you are</code>: 네 본모습, 네가 어떤 사람인지"],"chunks":["<code>It's such a reflection of ...</code> 그것은 ...을 정말 잘 보여줘."],"translation":"라이프 리스트. 네 라이프 리스트야. 난 이 리스트가 정말 좋아. 이 리스트는 네가 어떤 사람인지 정말 잘 보여줘."},{"english":"Who I was. I was 13 when I wrote it.\nAnd I know, obviously, you have changed.","focus":"who I was / obviously","notes":["<code>Who I was.</code>: 지금의 내가 아니라 예전의 나라는 반박","<code>obviously</code>: 당연히, 분명히","<code>have changed</code>: 변했다"],"chunks":["<code>I was 13 when ...</code> ...했을 때 나는 13살이었어."],"translation":"내가 어떤 사람이었는지를 보여주는 거겠지. 그걸 썼을 때 나는 13살이었어. 그리고 물론 네가 변했다는 건 알아."},{"english":"Oh my God, it's like she's listening to me.","focus":"it's like","notes":["<code>It's like ...</code>: 마치 ...같아","<code>listen to me</code>: 내 말을 듣다"],"chunks":["<code>It's like she's ...</code> 마치 그녀가 ...하는 것 같아."],"translation":"세상에, 마치 엄마가 내 말을 듣고 있는 것 같아."},{"english":"And I think that's my concern, is that I don't know that you have replaced this with anything.\nI wonder, have you given up your dreams and your aspirations? Your goals?","focus":"concern / give up","notes":["<code>concern</code>: 걱정, 우려","<code>replace A with B</code>: A를 B로 대체하다","<code>give up</code>: 포기하다","<code>aspirations</code>: 열망, 포부"],"chunks":["<code>I wonder, have you ...?</code> 궁금하구나, 네가 ...한 건 아닐까?"],"translation":"그리고 그게 내 걱정이야. 네가 이것을 다른 무엇으로 대체했는지 모르겠거든. 궁금해. 너는 꿈과 포부를 포기한 걸까? 네 목표들을?"},{"english":"And don't tell me Rose Cosmetics, because I feel like I gave you this cozy job that allowed you to run away from who you really are.","focus":"don't tell me / allow","notes":["<code>Don't tell me ...</code>: ...라고 말하지는 마","<code>cozy job</code>: 편하고 안락한 일자리","<code>allow someone to + 동사</code>: 사람이 ...할 수 있게 해주다","<code>run away from</code>: ...로부터 도망치다"],"chunks":["<code>who you really are</code> 네 진짜 모습"],"translation":"그리고 Rose Cosmetics라고 말하진 마. 내가 너에게 편한 일자리를 줘서 네 진짜 모습으로부터 도망칠 수 있게 해준 것 같거든."},{"english":"Thanks a lot.","focus":"sarcastic thanks","notes":["<code>Thanks a lot.</code>: 문자 그대로는 ‘정말 고마워’; 문맥에 따라 빈정거리는 말"],"chunks":[],"translation":"참 고맙네."},{"english":"So okay, let's look at the list.\n\"Help people and make a difference.\"\n\"Be a great teacher.\"\nAlex, you are a born teacher.","focus":"make a difference / born","notes":["<code>make a difference</code>: 좋은 변화를 만들다, 의미 있는 영향을 주다","<code>a born teacher</code>: 타고난 선생님"],"chunks":["<code>Let's look at ...</code> ...을 한번 보자.","<code>You are a born ...</code> 너는 타고난 ...야."],"translation":"그래, 리스트를 한번 보자. “사람들을 돕고 변화를 만들기.” “훌륭한 선생님 되기.” Alex, 너는 타고난 선생님이야."},{"english":"Okay, \"learn to drive, get a tattoo.\"\nYou can skip those, please, dear God.\nMy one request \"Find true love.\"\nWhy do I have a horrible feeling you've given up on that too?","focus":"skip / give up on","notes":["<code>learn to drive</code>: 운전을 배우다","<code>get a tattoo</code>: 문신을 하다","<code>skip</code>: 건너뛰다","<code>give up on + 명사</code>: ...을 포기하다"],"chunks":["<code>My one request</code> 내 한 가지 부탁","<code>Why do I have a horrible feeling ...?</code> 왜 ...일 것 같은 불길한 예감이 들지?"],"translation":"좋아, “운전 배우기, 문신하기.” 제발, 그것들은 건너뛰어도 돼. 내 한 가지 부탁은 “진정한 사랑 찾기.” 왜 그것마저 포기한 것 같은 불길한 느낌이 들까?"},{"english":"That's not fair.","focus":"not fair","notes":["<code>That's not fair.</code>: 그건 공평하지 않아, 그렇게 말하면 안 되지"],"chunks":[],"translation":"그건 불공평해."},{"english":"I want you to know how incredible you are.\nI want you to live your best life.\nYou have to get yourself out of this hole you're in.","focus":"want someone to / hole","notes":["<code>I want you to know ...</code>: 네가 ...을 알았으면 해","<code>live your best life</code>: 가장 자기답고 충만한 삶을 살다","<code>get yourself out of this hole</code>: 지금 빠진 구덩이 같은 상황에서 스스로 빠져나오다"],"chunks":["<code>You have to get yourself out of ...</code> 너는 ...에서 빠져나와야 해."],"translation":"네가 얼마나 대단한 사람인지 알았으면 해. 네 최고의 삶을 살았으면 해. 네가 빠져 있는 이 구덩이에서 스스로 빠져나와야 해."},{"english":"I'm not in a hole. ","focus":"denial","notes":["<code>be in a hole</code>: 곤란하거나 막힌 상황에 처해 있다"],"chunks":["<code>I'm not in ...</code> 나는 ...에 있는 게 아니야."],"translation":"나 구덩이에 빠진 거 아니야."},{"english":"I'm sorry, that's not up for discussion.\nI'm not gonna be around to dig you out, but I can sure as hell leave you a shovel.","focus":"not up for discussion","notes":["<code>not up for discussion</code>: 논의 대상이 아니다","<code>be around</code>: 곁에 있다","<code>dig someone out</code>: 곤란한 상황에서 꺼내 주다","<code>sure as hell</code>: 정말로, 반드시; 강한 구어체"],"chunks":["<code>That's not up for discussion.</code> 그건 논의할 문제가 아니야.","<code>leave you a shovel</code> 네가 빠져나올 삽은 남겨줄 수 있어."],"translation":"미안하지만 그건 논의할 문제가 아니야. 내가 곁에 있으면서 널 파내 줄 수는 없겠지만, 삽 하나쯤은 확실히 남겨줄 수 있어."},{"english":"I want you to complete this list, Bean. Hold on.\nMom, you can't just say that and..","focus":"complete / can't just","notes":["<code>complete this list</code>: 이 목록을 완수하다","<code>Hold on.</code>: 잠깐만","<code>You can't just say that</code>: 그런 말을 그냥 해버리면 안 되지"],"chunks":["<code>I want you to complete ...</code> 네가 ...을 완수했으면 해."],"translation":"Bean, 네가 이 리스트를 완수했으면 해. 잠깐만. 엄마, 그렇게 말만 하고..."},{"english":"Okay. Every time you check off something from the list,\nBrad is going to give you one of these DVDs, which I am going to record.","focus":"every time / check off","notes":["<code>every time</code>: ...할 때마다","<code>check off</code>: 목록에서 완료 표시를 하다","<code>one of these DVDs</code>: 이 DVD들 중 하나","<code>which</code>: 앞의 DVDs를 받아 추가 설명"],"chunks":["<code>Every time you + 동사</code> 네가 ...할 때마다"],"translation":"좋아. 네가 리스트에서 하나를 해낼 때마다 Brad가 내가 녹화해 둘 이 DVD들 중 하나를 줄 거야."},{"english":"And once the list is completely finished, you will get this envelope.\nBut the clock is ticking. The list has to be finished by New Year's.\nOtherwise, no envelope.","focus":"once / by / otherwise","notes":["<code>once + 문장</code>: 일단 ...하면","<code>the clock is ticking</code>: 시간이 가고 있다, 시간이 얼마 없다","<code>by New Year's</code>: 새해 전까지, 새해가 되기 전까지","<code>otherwise</code>: 그렇지 않으면"],"chunks":["<code>has to be finished by ...</code> ...까지 끝나야 한다."],"translation":"그리고 리스트가 완전히 끝나면 이 봉투를 받게 될 거야. 하지만 시간은 흐르고 있어. 리스트는 새해 전까지 끝내야 해. 그렇지 않으면 봉투는 없어."},{"english":"Oh my God, I can't believe this.","focus":"can't believe","notes":["<code>I can't believe this.</code>: 이게 믿기지 않아, 말도 안 돼"],"chunks":[],"translation":"세상에, 이걸 믿을 수가 없어."},{"english":"I'm not screwing around, Bean. This is serious business.\nThis is your life. And I love you.\nSee you on the next DVD.","focus":"serious business","notes":["<code>screw around</code>: 장난치다, 허튼짓하다; 매우 편한 표현","<code>serious business</code>: 진지한 일, 중요한 문제","<code>See you on ...</code>: ...에서 보자"],"chunks":["<code>I'm not screwing around.</code> 나 장난치는 거 아니야.","<code>This is your life.</code> 이건 네 인생이야."],"translation":"Bean, 나 장난치는 거 아니야. 이건 진지한 일이야. 이건 네 인생이야. 그리고 사랑해. 다음 DVD에서 보자."}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 8;
    const totalPages = Math.max(1, Math.ceil(items.length / itemsPerPage));
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 2:</strong> 09:20 이후 장례식과 유언장 공개 장면부터 Alex가 엄마의 DVD 메시지를 확인하는 장면까지, 사용자가 제공한 영화 &lt;라이프리스트&gt; 대사 순서대로 구성했습니다.</section>'
        : "";
      const body = rows
        ? '<section class="grid" aria-label="Sentence study table">' + rows + '</section>'
        : '<section class="empty">Section 2 대사 원문을 보내주면, Section 1과 같은 형식으로 번호, 해석, 문법, 활용 표현을 정리합니다.</section>';
      return '<main class="page"><header><div><h1>The Life List</h1><p class="subtitle">Section 2 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro + body +
        '<footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
