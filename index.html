<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Life List English Study</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --paper:#fff; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef1f4; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .header-inner, main { width:min(920px,calc(100% - 32px)); margin:0 auto; }
    .header-inner { padding:34px 0 27px; }
    .eyebrow { margin:0 0 7px; color:var(--accent); font-size:12px; font-weight:800; text-transform:uppercase; }
    h1 { margin:0; font-size:30px; letter-spacing:0; }
    .subtitle { margin:9px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    main { padding:28px 0 56px; }
    h2 { margin:0 0 12px; font-size:17px; }
    .section-list { overflow:hidden; border:1px solid var(--line); border-radius:7px; background:var(--paper); }
    .section-row { display:grid; grid-template-columns:110px 1fr auto; gap:18px; align-items:center; padding:18px 20px; color:inherit; text-decoration:none; }
    .section-row:hover { background:#f8fafb; }
    .section-number { color:var(--accent2); font-size:12px; font-weight:850; text-transform:uppercase; }
    .section-title { margin:0; font-size:16px; }
    .section-meta { margin:5px 0 0; color:var(--muted); font-size:12px; }
    .open { color:var(--accent); font-size:13px; font-weight:800; }
    .project-note { margin:20px 0 0; padding:15px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.7; }
    @media(max-width:620px) {
      h1 { font-size:24px; }
      .section-row { grid-template-columns:1fr auto; gap:8px 12px; }
      .section-number { grid-column:1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <p class="eyebrow">Movie Dialogue Study</p>
      <h1>The Life List English Study</h1>
      <p class="subtitle">영화 &lt;라이프리스트&gt; 대사를 장면 순서대로 공부하는 영어 자료입니다.</p>
    </div>
  </header>
  <main>
    <h2>Sections</h2>
    <div class="section-list">
      <a class="section-row" href="sections/section-01.html">
        <span class="section-number">Section 1</span>
        <span>
          <strong class="section-title">00:00~09:20</strong>
          <span class="section-meta">62 dialogue groups · English · 해석 · 문법 · 활용 표현</span>
        </span>
        <span class="open">열기 →</span>
      </a>
      <a class="section-row" href="sections/section-02.html">
        <span class="section-number">Section 2</span>
        <span>
          <strong class="section-title">다음 구간 준비 중</strong>
          <span class="section-meta">대사 원문을 받으면 같은 형식으로 정리 예정</span>
        </span>
        <span class="open">열기 →</span>
      </a>
    </div>
    <p class="project-note">새로운 구간이 완성될 때마다 Section 3, Section 4 순서로 이 목록에 추가됩니다.</p>
  </main>
</body>
</html>
